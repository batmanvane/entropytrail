[project]
name = "entropytrail"
version = "0.1.0"
description = "Study of next-token entropy while a local LLM builds single-file HTML apps"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["mlx-lm==0.32.2", "numpy", "pyarrow", "pyyaml"]

[project.scripts]
et = "entropytrail.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entropytrail"]

[tool.pytest.ini_options]
markers = ["slow: needs Qwen3.5-9B weights"]
addopts = "-m 'not slow'"
