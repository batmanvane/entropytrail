<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entropy Trail – rate apps</title>
<meta name="description" content="Try small web apps written by a language model and rate how useful and how new they are.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f2f1ec; --panel: #fbfaf7; --ink: #1a1a1a; --ink2: #5f5d58; --line: #dcdad3;
  --accent: #1f4d3a; --accent-ink: #ffffff; --accent-soft: #dfe8e2; --warn: #8a3b12;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161816; --panel: #1f2220; --ink: #ecebe6; --ink2: #a9a79f; --line: #34372f;
    --accent: #7fc1a0; --accent-ink: #0f1a14; --accent-soft: #24352c; --warn: #f0a37a;
  }
}
:root[data-theme="dark"] {
  --paper: #161816; --panel: #1f2220; --ink: #ecebe6; --ink2: #a9a79f; --line: #34372f;
  --accent: #7fc1a0; --accent-ink: #0f1a14; --accent-soft: #24352c; --warn: #f0a37a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line); }
header .brand { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: .02em; }
header .tools { display: flex; gap: 8px; align-items: center; color: var(--ink2); font-size: 14px; }
button, .btn { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); padding: 8px 14px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.link { border: none; background: none; padding: 4px 6px; color: var(--ink2); text-decoration: underline; }
main { max-width: 1400px; margin: 0 auto; padding: 16px; }
.intro { max-width: 680px; margin: 32px auto; }
.intro h1 { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; line-height: 1.25; }
.intro li { margin: 6px 0; }
.note { color: var(--ink2); font-size: 14px; }
.rate { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.brief { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
.brief .label { color: var(--ink2); font-size: 13px; }
.brief .text { font-family: "IBM Plex Mono", monospace; font-size: 14px; white-space: pre-wrap; }
.frame { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.frame iframe { display: block; width: 100%; height: 72vh; min-height: 420px; border: 0; background: #fff; }
.frame-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--panel); border-top: 1px solid var(--line); font-size: 13px; color: var(--ink2); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; position: sticky; top: 12px; }
fieldset { border: 0; margin: 0 0 16px; padding: 0; }
legend { font-weight: 600; margin-bottom: 6px; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.scale label, .choices label { display: block; text-align: center; border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 0; cursor: pointer; background: var(--paper); font-family: "IBM Plex Mono", monospace; }
.scale input, .choices input { position: absolute; opacity: 0; pointer-events: none; }
.scale input:checked + span, .choices input:checked + span { font-weight: 600; }
.scale label:has(input:checked), .choices label:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scale label:has(input:focus-visible), .choices label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.ends { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 12px; line-height: 1.3; color: var(--ink2); margin-top: 4px; gap: 6px; }
.ends span:nth-child(2) { text-align: center; }
.ends span:last-child { text-align: right; }
.warmup { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 14px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.thanks { max-width: 560px; margin: 48px auto; text-align: center; }
.thanks .big { font-family: "IBM Plex Mono", monospace; font-size: 40px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.error { color: var(--warn); }
.hidden { display: none !important; }
@media (max-width: 900px) {
  .rate { grid-template-columns: 1fr; }
  .panel { position: static; }
  .frame iframe { height: 64vh; }
}
</style>
</head>
<body>
<header>
  <span class="brand">entropy trail</span>
  <span class="tools">
    <span id="count" class="mono"></span>
    <button class="link" id="lang-btn" type="button"></button>
  </span>
</header>
<main>
  <section id="intro" class="intro">
    <h1 data-t="title"></h1>
    <p data-t="p1"></p>
    <ul>
      <li data-t="li1"></li>
      <li data-t="li2"></li>
      <li data-t="li3"></li>
      <li data-t="li4"></li>
    </ul>
    <p class="note" data-t="privacy"></p>
    <div class="row" style="justify-content:flex-start"><button class="primary" id="start" type="button" data-t="start"></button></div>
    <p class="note" id="intro-progress"></p>
  </section>

  <section id="rate" class="rate hidden">
    <div>
      <div class="warmup hidden" id="warmup"></div>
      <div class="brief"><div class="label" data-t="asked"></div><div class="text" id="brief"></div></div>
      <div class="frame">
        <iframe id="app" title="app" sandbox="allow-scripts allow-same-origin allow-modals allow-pointer-lock allow-forms"></iframe>
        <div class="frame-bar"><span data-t="keyhint"></span><button class="link" id="reload" type="button" data-t="reload"></button></div>
      </div>
    </div>
    <form class="panel" id="form">
      <fieldset>
        <legend data-t="q_use"></legend>
        <div class="scale" id="usefulness"></div>
        <div class="ends"><span data-t="use1"></span><span data-t="use3"></span><span data-t="use5"></span></div>
      </fieldset>
      <fieldset>
        <legend data-t="q_new"></legend>
        <div class="scale" id="novelty"></div>
        <div class="ends"><span data-t="new1"></span><span data-t="new3"></span><span data-t="new5"></span></div>
      </fieldset>
      <fieldset>
        <legend data-t="q_works"></legend>
        <div class="choices" id="works"></div>
      </fieldset>
      <button class="primary" id="submit" type="submit" style="width:100%" disabled data-t="submit"></button>
      <p class="note error hidden" id="form-error"></p>
      <div class="row"><button class="link" id="stop" type="button" data-t="stop"></button></div>
    </form>
  </section>

  <section id="thanks" class="thanks hidden">
    <div class="big" id="thanks-n"></div>
    <p id="thanks-text"></p>
    <div class="bar"><div id="bar"></div></div>
    <p class="note" id="study-progress"></p>
    <div class="row">
      <button class="primary" id="next" type="button" data-t="next"></button>
      <button id="stop2" type="button" data-t="stop"></button>
    </div>
  </section>

  <section id="done" class="thanks hidden">
    <div class="big">✓</div>
    <p id="done-text"></p>
  </section>

  <p class="note error hidden" id="net-error"></p>
</main>
<script>
const API = "https://entropytrail-ratings.entropytrail.workers.dev";
const T = {
  en: {
    other: "Deutsch",
    title: "Try apps a language model wrote, and tell us what you think",
    p1: "This is part of a research study on how a language model (Qwen3.5-9B) builds small web apps. The model got a short brief and wrote a complete app. We would like to know how people judge the result.",
    li1: "You see one app at a time, together with the brief the model was given.",
    li2: "Try it for a minute or two, then answer three short questions.",
    li3: "Rate as many apps as you like; every rating counts and you can stop at any time.",
    li4: "A laptop or desktop works best (some apps need a keyboard).",
    privacy: "Anonymous: no names, e-mail or IP addresses are stored; your browser gets a random id so you never see the same app twice. Ratings are published as open data for research.",
    start: "Start rating", asked: "The model was asked to build:",
    keyhint: "Click into the app first if it needs the keyboard.", reload: "Reload app",
    q_use: "How useful is this app?", use1: "1 = I would not use it for anything", use3: "3 = does the job in a basic way", use5: "5 = I would actually use this",
    q_new: "Have you seen something like this before?", new1: "1 = the standard version of this kind of app", new3: "3 = some ideas I had not seen", new5: "5 = this is new to me",
    warmup: (n, of) => `Warm-up ${n} of ${of}: everyone rates the same ${of} apps first. They help us understand how you use the scales; there are no right answers.`,
    q_works: "Does it work?", works: { yes: "yes", partly: "partly", no: "no" },
    submit: "Save and continue", stop: "Stop here", next: "Next app",
    you: (n) => n === 1 ? "You have rated 1 app. Thank you!" : `You have rated ${n} apps. Thank you!`,
    study: (p) => `Study progress: ${p.ratings_toward_target} of ${p.target} ratings needed, ${p.apps_done} of ${p.apps} apps complete.`,
    count: (n) => n ? `${n} rated` : "",
    allDone: "You have rated every app in the study. Thank you very much!",
    stopped: (n) => `Thank you! You rated ${n} ${n === 1 ? "app" : "apps"}. You can close this page or come back later.`,
    net: "The connection to the rating server failed. Please try again in a moment.",
    saveErr: "Could not save the rating. Please try again.",
  },
  de: {
    other: "English",
    title: "Apps ausprobieren, die ein Sprachmodell geschrieben hat – und sagen, was Sie davon halten",
    p1: "Das ist Teil einer Forschungsstudie dazu, wie ein Sprachmodell (Qwen3.5-9B) kleine Web-Apps baut. Das Modell hat eine kurze Aufgabe bekommen und eine vollständige App geschrieben. Wir möchten wissen, wie Menschen das Ergebnis beurteilen.",
    li1: "Sie sehen jeweils eine App, zusammen mit der Aufgabe, die das Modell bekommen hat (auf Englisch).",
    li2: "Probieren Sie sie ein, zwei Minuten aus und beantworten Sie dann drei kurze Fragen.",
    li3: "Bewerten Sie so viele Apps, wie Sie möchten; jede Bewertung zählt, und Sie können jederzeit aufhören.",
    li4: "Am besten geht es am Laptop oder PC (manche Apps brauchen eine Tastatur).",
    privacy: "Anonym: Es werden keine Namen, E-Mail- oder IP-Adressen gespeichert; Ihr Browser erhält eine Zufallskennung, damit Sie keine App zweimal sehen. Die Bewertungen werden als offene Forschungsdaten veröffentlicht.",
    start: "Bewertung starten", asked: "Das Modell sollte bauen:",
    keyhint: "Erst in die App klicken, wenn sie die Tastatur braucht.", reload: "App neu laden",
    q_use: "Wie nützlich ist diese App?", use1: "1 = würde ich für nichts nutzen", use3: "3 = erfüllt den Zweck in einfacher Form", use5: "5 = würde ich wirklich nutzen",
    q_new: "Haben Sie so etwas schon einmal gesehen?", new1: "1 = die übliche Version dieser Art App", new3: "3 = einige Ideen, die ich noch nicht kannte", new5: "5 = das ist neu für mich",
    warmup: (n, of) => `Einstieg ${n} von ${of}: Alle bewerten zuerst dieselben ${of} Apps. Sie helfen uns zu verstehen, wie Sie die Skalen nutzen; es gibt keine richtigen Antworten.`,
    q_works: "Funktioniert sie?", works: { yes: "ja", partly: "teilweise", no: "nein" },
    submit: "Speichern und weiter", stop: "Hier aufhören", next: "Nächste App",
    you: (n) => n === 1 ? "Sie haben 1 App bewertet. Vielen Dank!" : `Sie haben ${n} Apps bewertet. Vielen Dank!`,
    study: (p) => `Stand der Studie: ${p.ratings_toward_target} von ${p.target} benötigten Bewertungen, ${p.apps_done} von ${p.apps} Apps vollständig.`,
    count: (n) => n ? `${n} bewertet` : "",
    allDone: "Sie haben alle Apps der Studie bewertet. Herzlichen Dank!",
    stopped: (n) => `Vielen Dank! Sie haben ${n} ${n === 1 ? "App" : "Apps"} bewertet. Sie können die Seite schließen oder später wiederkommen.`,
    net: "Die Verbindung zum Bewertungsserver ist fehlgeschlagen. Bitte gleich noch einmal versuchen.",
    saveErr: "Die Bewertung konnte nicht gespeichert werden. Bitte noch einmal versuchen.",
  },
};

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
let lang = store("et-lang") || ((navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en");
let rater = store("et-rater");
if (!rater) { rater = "r-" + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)); store("et-rater", rater); }
let briefs = {}, current = null, shownAt = 0, ratedByYou = 0, warm = null;
function showWarm() { $("warmup").textContent = warm ? T[lang].warmup(warm.n, warm.of) : ""; $("warmup").classList.toggle("hidden", !warm); }
const $ = (id) => document.getElementById(id);
const show = (id) => ["intro", "rate", "thanks", "done"].forEach((s) => $(s).classList.toggle("hidden", s !== id));

function buildScale(id, values, labels) {
  $(id).innerHTML = values.map((v, i) =>
    `<label><input type="radio" name="${id}" value="${v}" required><span>${labels ? labels[i] : v}</span></label>`).join("");
}
function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { const v = t[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  $("lang-btn").textContent = t.other;
  const w = document.querySelector('input[name="works"]:checked');
  buildScale("works", ["yes", "partly", "no"], ["yes", "partly", "no"].map((k) => t.works[k]));
  if (w) document.querySelector(`input[name="works"][value="${w.value}"]`).checked = true;
  $("count").textContent = t.count(ratedByYou);
  if (typeof showWarm === "function" && $("warmup")) showWarm();
}
$("lang-btn").onclick = () => { lang = lang === "en" ? "de" : "en"; store("et-lang", lang); applyLang(); };
buildScale("usefulness", [1, 2, 3, 4, 5]);
buildScale("novelty", [1, 2, 3, 4, 5]);
applyLang();

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
function netError(on) { $("net-error").textContent = T[lang].net; $("net-error").classList.toggle("hidden", !on); }

async function loadNext() {
  netError(false);
  let d;
  try { d = await api(`/next?rater=${encodeURIComponent(rater)}`); } catch (e) { netError(true); return; }
  ratedByYou = d.rated_by_you; $("count").textContent = T[lang].count(ratedByYou);
  warm = d.anchor;
  if (!d.app) { $("done-text").textContent = T[lang].allDone; show("done"); return; }
  current = d.app;
  $("brief").textContent = briefs[current] || "";
  $("form").reset(); $("submit").disabled = true; $("form-error").classList.add("hidden");
  $("app").src = `${API}/apps/${current}.html`;
  showWarm();
  shownAt = performance.now();
  show("rate");
  window.scrollTo(0, 0);
}
$("form").addEventListener("change", () => {
  $("submit").disabled = !["usefulness", "novelty", "works"].every((n) => document.querySelector(`input[name="${n}"]:checked`));
});
$("reload").onclick = () => { $("app").src = `${API}/apps/${current}.html`; };
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const val = (n) => document.querySelector(`input[name="${n}"]:checked`).value;
  const body = { app: current, rater, usefulness: +val("usefulness"), novelty: +val("novelty"), works: val("works"),
                 seconds: Math.round((performance.now() - shownAt) / 100) / 10, lang };
  $("submit").disabled = true;
  try {
    await api("/rate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  } catch (err) {
    $("form-error").textContent = T[lang].saveErr; $("form-error").classList.remove("hidden"); $("submit").disabled = false; return;
  }
  $("app").src = "about:blank";
  if (warm) { loadNext(); return; }
  ratedByYou += 1;
  $("count").textContent = T[lang].count(ratedByYou);
  $("thanks-n").textContent = ratedByYou;
  $("thanks-text").textContent = T[lang].you(ratedByYou);
  show("thanks");
  try {
    const p = await api("/progress");
    $("bar").style.width = `${Math.round(100 * p.ratings_toward_target / p.target)}%`;
    $("study-progress").textContent = T[lang].study(p);
  } catch (err) { $("study-progress").textContent = ""; }
});
function stop() { $("app").src = "about:blank"; $("done-text").textContent = T[lang].stopped(ratedByYou); show("done"); }
$("stop").onclick = stop; $("stop2").onclick = stop;
$("next").onclick = loadNext;
$("start").onclick = loadNext;

fetch("apps.json").then((r) => r.json()).then((a) => { briefs = Object.fromEntries(a.map((x) => [x.id, x.prompt])); });
api("/progress").then((p) => { $("intro-progress").textContent = T[lang].study(p); }).catch(() => {});
</script>
</body>
</html>
