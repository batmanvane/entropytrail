# DRAFT prompt grid v1 for the main series (WP2). Not used by any run until Robert has
# reviewed it and it is frozen as prompts/prompts.yaml (version v1).
# Grid: 3 domains x {tight, loose} x 3 prompts + 3 free prompts = 21 prompts.
version: v1-draft
system_prompts:
  sys-v1: >-
    You are a web developer. Produce exactly one self-contained HTML file that
    implements the requested app. Use inline CSS and inline JavaScript only.
    Do not use any external resources or libraries (no CDNs, fonts, images or
    scripts loaded from elsewhere). Output only the file, with no explanation
    and no text before or after it.
prompts:
  # --- Education, tight: the idea is fixed, decisions are left in the details
  - id: edu-tight-01
    domain: education
    openness: tight
    text: >-
      Build a quiz with 10 multiple-choice questions on adding and comparing
      fractions. Show one question at a time, give immediate feedback after each
      answer, and show the score at the end.
  - id: edu-tight-02
    domain: education
    openness: tight
    text: >-
      Build a times-table trainer for the tables 1 to 10: random questions, an
      input field for the answer, a 60-second timer and a counter of correct
      answers.
  - id: edu-tight-03
    domain: education
    openness: tight
    text: >-
      Build an interactive illustration of the Pythagorean theorem: two sliders
      set the legs a and b, the app draws the right triangle with a square on
      each side and shows a² + b² = c² with the current numbers.
  # --- Education, loose: the model has to choose the idea
  - id: edu-loose-01
    domain: education
    openness: loose
    text: Build an app that helps students understand fractions.
  - id: edu-loose-02
    domain: education
    openness: loose
    text: Build an app that helps students learn something about the solar system.
  - id: edu-loose-03
    domain: education
    openness: loose
    text: Build an app that helps students practise for a test.
  # --- Game, tight
  - id: game-tight-01
    domain: game
    openness: tight
    text: >-
      Build Snake on a 20×20 grid: arrow keys to steer, the snake grows when it
      eats food, the speed increases after every 5 pieces of food, show the score,
      and show a game-over message with a restart button.
  - id: game-tight-02
    domain: game
    openness: tight
    text: >-
      Build a memory card game with 16 cards (8 pairs) in a 4×4 grid: two cards
      are turned over per move, matching pairs stay open, count the moves and
      show a message when all pairs are found.
  - id: game-tight-03
    domain: game
    openness: tight
    text: >-
      Build Breakout: a paddle moved with the left and right arrow keys, one
      ball, 5 rows of 10 bricks, 3 lives and a score.
  # --- Game, loose
  - id: game-loose-01
    domain: game
    openness: loose
    text: Build a simple game for a short break.
  - id: game-loose-02
    domain: game
    openness: loose
    text: Build a game that can be played with only one key.
  - id: game-loose-03
    domain: game
    openness: loose
    text: Build a puzzle game.
  # --- Tool, tight
  - id: tool-tight-01
    domain: tool
    openness: tight
    text: >-
      Build a unit converter for centimetres, inches and feet: one input field,
      a selector for the input unit, and the values in the other two units
      updated while typing.
  - id: tool-tight-02
    domain: tool
    openness: tight
    text: >-
      Build a Pomodoro timer: 25-minute work phases and 5-minute breaks, start,
      pause and reset buttons, and a counter of completed work phases.
  - id: tool-tight-03
    domain: tool
    openness: tight
    text: >-
      Build a tip calculator: bill amount, tip percentage via buttons for 10 %,
      15 % and 20 % or a custom value, number of people; show the tip and the
      amount per person.
  # --- Tool, loose
  - id: tool-loose-01
    domain: tool
    openness: loose
    text: Build a small everyday helper.
  - id: tool-loose-02
    domain: tool
    openness: loose
    text: Build a tool that helps with planning.
  - id: tool-loose-03
    domain: tool
    openness: loose
    text: Build a tool that makes a repetitive task easier.
  # --- Free: the widest landscape
  - id: free-01
    domain: free
    openness: open
    text: Build an HTML app of your choice.
  - id: free-02
    domain: free
    openness: open
    text: Build an HTML app that you think nobody has built before.
  - id: free-03
    domain: free
    openness: open
    text: Build an HTML app that you would enjoy building.
