<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --card-back: #34495e;
            --card-front: #ecf0f1;
            --text-color: #ecf0f1;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 10px;
            perspective: 1000px;
        }

        /* Card Container */
        .card {
            width: 80px;
            height: 80px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        /* Flipped state */
        .card.flip {
            transform: rotateY(180deg);
        }

        /* Matching pair matched state */
        .card.matched {
            cursor: default;
        }

        /* Face styling */
        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
        }

        .card-front {
            background-color: var(--card-back);
            background-image: linear-gradient(135deg, #2c3e50 25%, #34495e 25%, #34495e 50%, #2c3e50 50%, #2c3e50 75%, #34495e 75%, #34495e 100%);
            background-size: 20px 20px;
            border: 2px solid #7f8c8d;
        }

        .card-back {
            background-color: var(--card-front);
            color: #333;
            transform: rotateY(180deg);
        }

        .card.matched .card-back {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-front);
            color: #333;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 90%;
        }

        .modal h2 {
            margin-top: 0;
            color: var(--success-color);
        }

        button {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #219150;
        }

        /* Responsive adjustments */
        @media (max-width: 400px) {
            .game-board {
                grid-template-columns: repeat(4, 60px);
                grid-template-rows: repeat(4, 60px);
            }
            .card {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>

    <h1>MEMORY</h1>
    
    <div class="stats">
        <span>Moves: <b id="move-count">0</b></span>
    </div>

    <div class="game-board" id="game-board">
        <!-- Cards will be injected here by JavaScript -->
    </div>

    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2>Great Job!</h2>
            <p>You found all the pairs!</p>
            <p>Total Moves: <b id="final-moves">0</b></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const board = document.getElementById('game-board');
        const moveCountElement = document.getElementById('move-count');
        const modal = document.getElementById('win-modal');
        const finalMovesElement = document.getElementById('final-moves');
        
        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchedPairs = 0;
        const totalPairs = 8;

        // Emojis to use for pairs
        const icons = ['🍕', '🚀', '🌵', '🎈', '🐱', '🍦', '🎸', '🚗'];

        function initGame() {
            // Reset state
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            moves = 0;
            matchedPairs = 0;
            moveCountElement.innerText = moves;
            modal.style.display = 'none';
            board.innerHTML = '';

            // Duplicate and shuffle icons
            const gameData = [...icons, ...icons];
            cards = shuffle(gameData);

            // Create HTML elements
            cards.forEach(icon => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.icon = icon;
                card.dataset.index = icon; // Used for matching logic if needed, though dataset.icon is enough

                const frontFace = document.createElement('div');
                frontFace.classList.add('card-face', 'card-front');
                
                const backFace = document.createElement('div');
                backFace.classList.add('card-face', 'card-back');
                backFace.innerText = icon;

                card.appendChild(frontFace);
                card.appendChild(backFace);
                
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            // Prevent flipping if board is locked or clicking same card
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                // First click
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Second click
            secondCard = this;
            incrementMoves();
            checkForMatch();
        }

        function incrementMoves() {
            moves++;
            moveCountElement.innerText = moves;
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.icon === secondCard.dataset.icon;

            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            // It's a match
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            
            // Remove event listeners so they can't be clicked again
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);

            resetBoard();
            matchedPairs++;

            if (matchedPairs === totalPairs) {
                setTimeout(() => {
                    finalMovesElement.innerText = moves;
                    modal.style.display = 'flex';
                }, 500);
            }
        }

        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1000); // 1 second delay
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function restartGame() {
            initGame();
        }

        // Start the game on load
        initGame();

    </script>
</body>
</html>
