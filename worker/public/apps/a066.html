<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grunt Work Automator</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #334155;
            --text-light: #64748b;
            --success: #10b981;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        header {
            background: var(--primary);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
        .subtitle { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; display: block; }

        .controls {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
        
        label { font-size: 0.75rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; }

        input[type="text"], textarea {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s;
            width: 100%;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea { resize: vertical; min-height: 80px; }

        .btn-row {
            display: flex;
            gap: 1rem;
        }

        button {
            cursor: pointer;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; flex: 1; justify-content: center; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { background: var(--border); color: var(--text-light); cursor: not-allowed; }

        .btn-secondary { background: white; border: 1px solid var(--border); color: var(--text); }
        .btn-secondary:hover { background: var(--bg); }
        
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }

        .workspace {
            display: flex;
            flex: 1;
            min-height: 0; /* Essential for scrolling within flex container */
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            position: relative;
        }

        .pane:last-child { border-right: none; }

        .pane-header {
            padding: 0.75rem 1rem;
            background: #f1f5f9;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .textarea-content {
            flex: 1;
            padding: 1rem;
            overflow: auto;
            background-image: linear-gradient(var(--border) 1px, transparent 1px);
            background-size: 100% 2rem;
            background-position: 0 0;
        }

        /* Debug Console */
        .console-log {
            background: #1e293b;
            color: #94a3b8;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
            padding: 0.75rem;
            height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 5px;
        }
        
        .log-entry { border-bottom: 1px solid #334155; padding-bottom: 2px;}
        .log-entry.warning { color: #fbbf24; }
        .log-entry.error { color: #ef4444; }
        .log-entry.info { color: #60a5fa; }

        footer {
            padding: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-light);
            background: var(--surface);
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Grunt Work Automator</h1>
            <span class="subtitle">Regex text manipulation and bulk processor</span>
        </div>
        <div style="text-align: right; display: none;" id="progress-group">
            <!-- Progress indicator can be added here if needed -->
        </div>
    </header>

    <div class="controls">
        <div class="control-group">
            <label for="inputRaw">Input Source (Raw Lines)</label>
            <textarea id="inputRaw" spellcheck="false" placeholder="Paste your list here...&#10;Ex:&#10;john@example.com&#10;jane_doe@company.net&#10;no_match@spam.com"></textarea>
        </div>

        <div class="control-group">
            <label for="checkRegex">Find (Regex)</label>
            <input type="text" id="checkRegex" placeholder="e.g. (I need to clarify|Do not reply)">
            <div class="btn-row" style="margin-top: 5px; gap: 5px;">
                <button class="btn-secondary" onclick="regexTest('checkRegex')" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">Test Check</button>
            </div>
        </div>

        <div class="control-group">
            <label for="replaceRegex">Replace With</label>
            <input type="text" id="replaceRegex" value="@ExampleCorp: ">
        </div>

        <div class="control-group">
            <label for="replaceAll">Replacement Action</label>
            <select id="replaceAll" style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; width: 100%;">
                <option value="standard">Standard (Find & Replace)</option>
                <option value="trim">Trim Whitespace (Trim all)</option>
                <option value="uppercase">Uppercase Text</option>
                <option value="lowercase">Lowercase Text</option>
                <option value="split_delim">Split by Comma (CSV)</option>
                <option value="filter_keep">Keep Only (Destructive Filter)</option>
                <option value="filter_remove">Remove Lines Containing (Destructive)</option>
            </select>
        </div>

        <div class="control-group" style="align-items: flex-start;">
            <label>&nbsp;</label>
            <button class="btn-secondary" onclick="swapped()">⏪ Swap Input / Output</button>
            <div class="btn-row" style="margin-top: 0.25rem; justify-content: flex-end;">
                <button class="btn-primary" onclick="processText()">Run Processing Tool</button>
            </div>
        </div>
    </div>

    <div class="workspace">
        <div class="pane" id="paneInput">
            <div class="pane-header">
                <span>Standard Input</span>
                <span id="countInput">0 chars</span>
            </div>
            <textarea class="textarea-content" id="textareaInput" readonly placeholder="Output will appear here..."></textarea>
        </div>

        <div class="pane" id="paneOutput" style="flex: 0.8;">
            <div class="pane-header">
                <span>Processed Output</span>
                <span id="countOutput">0 chars</span>
            </div>
            <textarea class="textarea-content" id="textareaOutput"></textarea>
            
            <div class="pane-footer">
                <div style="display: flex; gap: 10px; padding-bottom: 10px;">
                    <button class="btn-secondary" onclick="clearAll()" style="flex: 1;">Clear All</button>
                    <button class="btn-success" onclick="exportToClipboard()">Copy Output to Clipboard</button>
                    <button class="btn-secondary" onclick="downloadFile()">Save as .txt</button>
                </div>
            </div>
        </div>
    </div>

    <div class="console-log" id="consoleLog">
        <div class="log-entry info">System ready. Waiting for input...</div>
    </div>

    <footer>
        Grunt Work Automator v1.0 | Built withstood-by
    </footer>
</div>

<script>
    // State Management
    let state = {
        input: '',
        output: '',
        temp: ''
    };

    // DOM Elements
    const els = {
        inputRaw: document.getElementById('inputRaw'),
        textareaInput: document.getElementById('textareaInput'),
        textareaOutput: document.getElementById('textareaOutput'),
        checkRegex: document.getElementById('checkRegex'),
        replaceRegex: document.getElementById('replaceRegex'),
        replaceAction: document.getElementById('replaceAll'),
        console: document.getElementById('consoleLog'),
        countInput: document.getElementById('countInput'),
        countOutput: document.getElementById('countOutput'),
        paneInput: document.getElementById('paneInput'),
        paneOutput: document.getElementById('paneOutput')
    };

    // Initialize
    function init() {
        updateCharCounts();
        els.inputRaw.addEventListener('input', (e) => {
            state.input = e.target.value;
            updateCharCounts();
        });

        // Setup textareaInput to mimic inputRaw but readonly
        els.textareaInput.value = state.input;
        
        // Allow user to paste directly into Output
        els.textareaOutput.addEventListener('input', (e) => {
            state.output = e.target.value;
            updateCharCounts();
        });
    }

    // Core Logic
    function processText() {
        const rawInput = els.textareaInput.value;
        const action = els.replaceAction.value;
        const regexPattern = els.checkRegex.value || ''; // Can be empty for standard ops
        const replacement = els.replaceRegex.value || '';
        const regexOrValue = createRegex(regexPattern);

        let result = "";
        const startLog = performance.now();

        log(`Starting: [${action}]`, 'info');

        try {
            if (!rawInput.trim()) {
                throw new Error("Input is empty");
            }

            switch(action) {
                case 'standard':
                    result = regexStandard(rawInput, regexOrValue, replacement);
                    break;
                case 'trim':
                    result = regexTrim(rawInput);
                    break;
                case 'uppercase':
                    result = rawInput.toUpperCase();
                    break;
                case 'lowercase':
                    result = rawInput.toLowerCase();
                    break;
                case 'split_delim':
                    result = regexSplitDelim(rawInput, regexOrValue, replacement);
                    break;
                case 'filter_keep':
                    result = regexFilterKeep(rawInput, regexOrValue);
                    break;
                case 'filter_remove':
                    result = regexFilterRemove(rawInput, regexOrValue, '\n'); // Remove matching lines
                    break;
                default:
                    log('Unknown action', 'warning');
            }

            els.textareaOutput.value = result;
            log(`Finished. Processed ${result.length} chars in ${(performance.now() - startLog).toFixed(2)}ms`, 'success');
        } catch (err) {
            log(`Error: ${err.message}`, 'error');
            console.error(err);
        }
    }

    // Action Implementations

    function regexStandard(input, re, replace) {
        if (!re.source || re.source === '') return input; // Just return if no check
        return input.replace(re, replace);
    }

    function regexTrim(input) {
        return input.replace(/^\s+|\s+$/gm, ''); 
    }

    function regexSplitDelim(input, re, replace) {
        const lines = input.split('\n');
        let final = [];
        lines.forEach((line, idx) => {
            const parts = line.split(re.source);
            parts.forEach((part, pIdx) => {
                final.push(parts[pIdx]);
            });
        });
        return final.join('\n');
    }

    function regexFilterKeep(input, re) {
        if (!re.source) return input; // If no regex, standard filter is identity
        const lines = input.split('\n');
        const result = lines.filter(line => {
            // Check 1: If undefined, keep. 
            const test = re.test(line) ? re.test(line) : true; 
            return !test ? false : true; 
        });
        // This is tricky with generic regex. 
        // If re is already truthy/tested, we need to inverse logic.
        if(re.source) {
            return lines.filter(line => re.test(line)).join('\n');
        }
        return input;
    }

    function regexFilterRemove(input, re, separator) {
        if (!re.source) return input;
        return input.split(sep).filter(line => !re.test(line)).join(separator);
    }

    // Helper to safely create regex
    function createRegex(pattern) {
        if (!pattern) return null;
        return new RegExp(pattern.replace(/[-[\]/{}()*+?.\\^$|]/g, '\\$&'), 'g');
    }

    // Utilities
    function swapped() {
        // Swaps the content of Input and Output panes
        const tempOutput = els.textareaOutput.value;
        const tempInput = els.textareaInput.value;

        // Swap values
        state.tempInput = tempOutput;
        state.tempOutput = tempInput;

        els.textareaOutput.value = tempOutput;
        els.textareaInput.value = tempInput;
        
        // Update counts
        updateCharCounts();
        log("Panes swapped", 'info');
        els.inputRaw.value = tempInput; // Sync raw input box
    }

    function updateCharCounts() {
        els.countInput.textContent = `${state.input.length} chars`;
        els.countOutput.textContent = `${state.output.length} chars`;
    }

    function clearAll() {
        if(confirm('Clear all fields?')) {
            els.inputRaw.value = '';
            state.input = '';
            updateCharCounts();
            els.textareaInput.value = '';
            state.output = '';
            els.textareaOutput.value = '';
            log("All data cleared", 'info');
        }
    }

    function exportToClipboard() {
        if (!state.output) return;
        
        navigator.clipboard.writeText(state.output).then(() => {
            const toast = document.createElement('div');
            toast.textContent = "Copied to clipboard!";
            toast.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#334155; color:white; padding:10px 20px; border-radius:20px; font-size:0.9rem; z-index:100;";
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }).catch(err => {
            log("Failed to copy to clipboard", 'error');
        });
    }

    function downloadFile() {
        if (!state.output) return;
        const blob = new Blob([state.output], { type: "text/plain" });
        const anchor = document.createElement("a");
        anchor.download = "processed_data.txt"; // Assuming simple filename logic
        anchor.href = window.URL.createObjectURL(blob);
        anchor.target = "_blank";
        anchor.style.display = "none";
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
    }

    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.textContent = `[${time}] ${msg}`;
        els.console.insertBefore(div, els.console.firstChild);
    }

    function regexTest(targetId) {
        // Helper to just test the check regex box
        const el = document.getElementById(targetId);
        // In a real app this might open a multiline tester, 
        // here we just toggle format
        if(el.value) {
            const val = el.value.replace(/[-[\]/{}()*+?.\\^$|]/g, '\\$&');
            els.replaceRegex.value = val; 
            log(`Regex escaped for replacement: ${val}`, 'info');
        }
    }

    // Run
    init();

</script>
</body>
</html>
