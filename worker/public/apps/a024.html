<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        :root {
            --bg-color: #efefef;
            --container-bg: #ffffff;
            --primary-color: #ba4949;
            --text-color: #000000;
            --secondary-text: #8e8e8e;
            --font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: var(--font-family);
        }

        .container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 450px;
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-display {
            margin-bottom: 40px;
            font-size: 90px;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn {
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-stop {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
        }

        .btn-stop:hover {
            background-color: #f5f5f5;
        }

        .btn-active {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .btn-reset {
            border: none;
            background: none;
            color: var(--text-color);
            font-size: 16px;
            margin-left: auto;
            margin-right: 0;
            padding: 0;
        }

        .stats {
            border-top: 1px solid #e6e6e6;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cycle-badge {
            background-color: var(--bg-color);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* State Classes */
        .mode-focusing .container {
            border-top: 10px solid var(--primary-color);
        }
        
        .mode-working .timer-display {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="container mode-focusing">
        <div class="timer-display" id="timer">25:00</div>
        
        <div class="controls">
            <button id="btnStart" class="btn btn-start">Start</button>
            <button id="btnStop" class="btn btn-stop" style="display: none;">Pause</button>
            <button id="btnReset" class="btn btn-reset">Reset</button>
        </div>

        <div class="stats">
            <div class="cycle-badge">
                Cycle: <span id="cycleCount">0</span>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const WORK_TIME = 25 * 60; // 25 minutes in seconds
        const BREAK_TIME = 5 * 60; // 5 minutes in seconds

        // State
        let timeLeft = WORK_TIME;
        let totalTime = WORK_TIME;
        let isRunning = false;
        let isWorkMode = true;
        let cycleCount = 0;
        let timerInterval = null;

        // DOM Elements
        const timerDisplay = document.getElementById('timer');
        const cycleCountDisplay = document.getElementById('cycleCount');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnReset = document.getElementById('btnReset');
        const container = document.querySelector('.container');

        // Initialize
        updateTimerDisplay();

        // Event Listeners
        btnStart.addEventListener('click', toggleTimer);
        btnStop.addEventListener('click', toggleTimer);
        btnReset.addEventListener('click', resetTimer);

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            isRunning = true;
            
            // Switch button text
            btnStart.style.display = 'none';
            btnStop.style.display = 'inline-block';

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    timerFinished();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            
            btnStart.style.display = 'inline-block';
            btnStop.style.display = 'none';
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = isWorkMode ? WORK_TIME : BREAK_TIME;
            cycleCount = 0; // Reset cycles on manual reset? Usually pomodoros count even if paused, 
                            // but for simplicity, we keep the current state if they didn't pause.
                            // Let's reset cycle count to 0 only if timer hasn't started, 
                            // otherwise keep current count to honor "completed work phases".
            
            cycleCount = isWorkMode ? 0 : 0;
            updateTimerDisplay();
            updateState();
        }

        function timerFinished() {
            clearInterval(timerInterval);
            isRunning = false;
            btnStart.style.display = 'inline-block';
            btnStop.style.display = 'none';

            // Play a simple beep/vibration
            if (navigator.vibrate) navigator.vibrate(200);

            if (isWorkMode) {
                cycleCount++;
                cycleCountDisplay.innerText = cycleCount;
                switchMode(BREAK_TIME);
            } else {
                switchMode(WORK_TIME);
            }
        }

        function switchMode(duration) {
            isWorkMode = !isWorkMode;
            totalTime = duration;
            timeLeft = duration;
            
            // Visual updates
            updateState();
            
            // Auto start next timer
            // pauseTimer(); // Optional: Auto-start behavior choice. 
                         // Let's uncomment this for a seamless flow, or keep manual.
                         // For a strict app feel, usually we reset or resume.
              // startTimer();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.innerText = `${pad(minutes)}:${pad(seconds)}`;
        }

        function updateState() {
            if (isWorkMode) {
                container.classList.remove('mode-working', 'mode-break');
                container.classList.add('mode-focusing');
            } else {
                container.classList.remove('mode-focusing', 'mode-working');
                container.classList.add('mode-break');
            }
        }

        function pad(num) {
            return num.toString().padStart(2, '0');
        }
    </script>
</body>
</html>
