<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Zen Task Manager</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        h1 { margin-bottom: 0.5rem; font-weight: 800; color: var(--primary); }
        p.subtitle { color: var(--text-muted); margin-bottom: 2rem; }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* Header / Date */
        .header {
            background: var(--primary);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
            position: relative;
        }
        .date-display { font-size: 1.5rem; font-weight: 600; letter-spacing: 0.5px; }
        
        /* Input Area */
        .input-group {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
            background: white;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 0 1.25rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-add:hover { background: var(--primary-hover); }

        /* Filter Tabs */
        .filters {
            display: flex;
            padding: 0 1.5rem;
            border-bottom: 1px solid var(--border);
            background: #f9fafb;
        }
        .filter-btn {
            flex: 1;
            padding: 0.75rem 0;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        .filter-btn.active { color: var(--primary); }
        .filter-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }

        /* Task List */
        .task-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s, transform 0.2s;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-item:hover { background-color: #f9fafb; }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            margin-right: 1rem;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .checkbox:hover { border-color: var(--primary); }
        
        .task-item.completed .checkbox {
            background: var(--success);
            border-color: var(--success);
        }
        .task-item.completed .checkbox::after {
            content: '✔';
            color: white;
            font-size: 12px;
        }

        .task-content { flex: 1; font-size: 1rem; transition: color 0.2s; }
        .task-item.completed .task-content { text-decoration: line-through; color: var(--text-muted); }

        .delete-btn {
            background: none;
            border: none;
            color: #d1d5db;
            cursor: pointer;
            padding: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
            border-radius: 6px;
        }
        .task-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { color: var(--danger); background: #fee2e2; }

        .footer {
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9fafb;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: color 0.2s;
        }
        .clear-btn:hover { color: var(--danger); }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            display: none;
        }
        .empty-state.visible { display: block; }

        /* Animations for deletion */
        .leaving {
            transform: translateX(100%);
            opacity: 0;
            background-color: var(--danger) !important;
            border-color: var(--danger) !important;
        }

        /* Scrollbar styling */
        .task-list::-webkit-scrollbar { width: 6px; }
        .task-list::-webkit-scrollbar-track { background: transparent; }
        .task-list::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 10px; }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.875rem;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .toast.active { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <h1>TaskMaster</h1>
    <p class="subtitle">Build your day with ease</p>

    <div class="app-container">
        <header class="header">
            <div id="dateDisplay" class="date-display">Loading...</div>
        </header>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="60">
            <button id="addBtn" class="btn-add">Add</button>
        </div>

        <nav class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </nav>

        <ul id="taskList" class="task-list">
            <!-- Tasks will appear here -->
        </ul>
        
        <div id="emptyState" class="empty-state">
            <p>No tasks yet. Enjoy your day!</p>
        </div>

        <footer class="footer">
            <span id="itemsLeft">0 items left</span>
            <button id="clearBtn" class="clear-btn">Clear Completed</button>
        </footer>
    </div>

    <div id="toast" class="toast">Task Added!</div>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const itemsLeftSpan = document.getElementById('itemsLeft');
        const clearBtn = document.getElementById('clearBtn');
        const dateDisplay = document.getElementById('dateDisplay');
        const emptyState = document.getElementById('emptyState');
        const toast = document.getElementById('toast');

        // State
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';

        // Initialize
        function init() {
            renderDate();
            renderTasks();
            updateStats();
            
            // Event Listeners
            addBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask();
            });
            
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTasks();
                });
            });

            clearBtn.addEventListener('click', clearCompleted);
        }

        // Helper: Date Formatting
        function renderDate() {
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            const today = new Date();
            dateDisplay.textContent = today.toLocaleDateString('en-US', options);
        }

        // Helper: Local Storage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Core: Add Task
        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.unshift(newTask); // Add to top
            saveTasks();
            renderTasks();
            
            // Clear input
            taskInput.value = '';
            taskInput.focus();
            showToast('Task added successfully');
        }

        // Core: Delete Task
        function deleteTask(id) {
            const taskIndex = tasks.findIndex(t => t.id === id);
            if (taskIndex === -1) return;

            // Animation logic
            const item = document.querySelectorAll('.task-item')[taskIndex];
            if(item) {
                item.classList.add('leaving');
                setTimeout(() => {
                    tasks.splice(taskIndex, 1);
                    saveTasks();
                    renderTasks();
                }, 300);
            } else {
                tasks.splice(taskIndex, 1);
                saveTasks();
                renderTasks();
            }
        }

        // Core: Toggle Complete
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        // Core: Clear Completed
        function clearCompleted() {
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            renderTasks();
            showToast('Completed tasks cleared');
        }

        // Render Logic
        function renderTasks() {
            taskList.innerHTML = '';
            
            const filteredTasks = tasks.filter(task => {
                if (currentFilter === 'active') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                return true;
            });

            if (filteredTasks.length === 0) {
                emptyState.classList.add('visible');
            } else {
                emptyState.classList.remove('visible');
            }

            filteredTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                li.dataset.id = task.id;
                li.innerHTML = `
                    <div class="checkbox" onclick="toggleTask(${task.id})"></div>
                    <span class="task-content">${escapeHtml(task.text)}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                `;
                taskList.appendChild(li);
            });

            updateStats();
        }

        function updateStats() {
            const activeTasks = tasks.filter(t => !t.completed).length;
            itemsLeftSpan.textContent = `${activeTasks} item${activeTasks !== 1 ? 's' : ''} left`;
            
            clearBtn.innerHTML = activeTasks === 0 
                ? "No Completed Tasks" 
                : "Clear Completed";
            
            clearBtn.disabled = tasks.every(t => t.completed);
            clearBtn.style.opacity = tasks.every(t => t.completed) ? '0.5' : '1';
            clearBtn.style.cursor = tasks.every(t => t.completed) ? 'not-allowed' : 'pointer';
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Security: Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Run
        init();

    </script>
</body>
</html>
