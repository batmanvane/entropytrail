<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--text);
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem 2rem 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .currency-symbol {
            position: absolute;
            left: 1rem;
            font-weight: 600;
            color: #6b7280;
        }

        .custom-input-wrapper {
            position: relative;
        }

        /* Tip Buttons */
        .tip-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .tip-btn {
            padding: 0.75rem;
            border: 1px solid var(--border);
            background: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tip-btn:hover {
            background-color: var(--bg);
        }

        .tip-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        input[type="range"] {
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
            accent-color: var(--primary);
        }

        /* Inputs */
        .bill-input {
            padding-left: 2rem;
        }

        .people-input {
            padding-left: 1rem;
        }

        /* Results */
        .results {
            background-color: var(--bg);
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
        }

        .result-item {
            display: flex;
            flex-direction: column;
        }

        .result-label {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 0.25rem;
        }

        .result-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }

        .separator {
            margin: 0 0.5rem;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Tip Calculator</h2>

    <!-- Bill Amount -->
    <div class="input-group">
        <label for="bill">Bill Amount</label>
        <div class="input-wrapper bill-input">
            <span class="currency-symbol">$</span>
            <input type="number" id="bill" placeholder="0.00" min="0" step="0.01">
        </div>
    </div>

    <!-- Tip Percentage -->
    <div class="input-group">
        <label>Tip Percentage</label>
        <div class="tip-options" id="tip-btns">
            <button class="tip-btn" data-tip="10">10%</button>
            <button class="tip-btn" data-tip="15">15%</button>
            <button class="tip-btn" data-tip="20">20%</button>
        </div>
        <input type="range" id="tip-range" min="0" max="30" value="10">
        <div style="text-align: right; font-weight: 600;" id="tip-display">10%</div>
    </div>

    <!-- Number of People -->
    <div class="input-group">
        <label for="people">Number of People</label>
        <div class="input-wrapper people-input">
            <input type="number" id="people" placeholder="2" min="1" value="2">
        </div>
    </div>

    <!-- Results -->
    <div class="results">
        <div class="result-item">
            <span class="result-label">Tip Amount</span>
            <span class="result-value" id="total-tip">$0.00</span>
        </div>
        <div class="separator">|</div>
        <div class="result-item">
            <span class="result-label">Total Per Person</span>
            <span class="result-value" id="total-per-person">$0.00</span>
        </div>
    </div>
</div>

<script>
    // DOM Elements
    const billInput = document.getElementById('bill');
    const peopleInput = document.getElementById('people');
    const tipRange = document.getElementById('tip-range');
    const tipDisplay = document.getElementById('tip-display');
    const tipBtns = document.querySelectorAll('.tip-btn');
    
    // Result Elements
    const totalTipEl = document.getElementById('total-tip');
    const totalPerPersonEl = document.getElementById('total-per-person');

    // State
    let currentTipPercentage = 10;

    // Function to calculate and update UI
    function calculateTip() {
        const bill = parseFloat(billInput.value);
        const people = parseInt(peopleInput.value);

        // Validation
        const validBill = !isNaN(bill) && bill >= 0;
        const validPeople = !isNaN(people) && people > 0;

        if (!validBill || !validPeople) {
            totalTipEl.textContent = '$0.00';
            totalPerPersonEl.textContent = '$0.00';
            return;
        }

        const taxRate = currentTipPercentage / 100;
        const tipAmount = bill * taxRate;
        const totalAmount = bill + tipAmount;
        const perPerson = totalAmount / people;

        // Update DOM
        totalTipEl.textContent = '$' + tipAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        totalPerPersonEl.textContent = '$' + perPerson.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Event Listeners for Inputs
    billInput.addEventListener('input', calculateTip);
    peopleInput.addEventListener('input', calculateTip);
    tipRange.addEventListener('input', updateTipState);

    function updateTipState(e) {
        const val = parseInt(e.target.value);
        currentTipPercentage = val;
        tipDisplay.textContent = val + '%';
        calculateTip();
    }

    // Event Listeners for Buttons
    tipBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            // Remove active class from all
            tipBtns.forEach(b => b.classList.remove('active'));
            
            // Add active class to clicked
            btn.classList.add('active');
            
            // Update state and range
            currentTipPercentage = parseInt(btn.dataset.tip);
            tipRange.value = currentTipPercentage;
            tipDisplay.textContent = currentTipPercentage + '%';
            
            calculateTip();
        });
    });

    // Initial Calculation
    calculateTip();
</script>

</body>
</html>
