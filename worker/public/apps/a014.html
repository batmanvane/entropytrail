<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #374151;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .divider {
            height: 1px;
            background-color: #e5e7eb;
            margin: 1.5rem 0;
        }

        .tip-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .radio-group {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .radio-group label {
            margin-bottom: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        input[type="radio"] {
            accent-color: #3b82f6;
            transform: scale(1.2);
        }

        input[type="text"] {
            flex-grow: 1;
        }

        .custom-tip-container {
            margin-left: 2rem;
        }

        .results {
            background-color: #eff6ff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            color: #4b5563;
        }

        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 0.75rem;
            border-top: 1px solid #dbeafe;
            font-weight: 700;
            color: #111827;
            font-size: 1.25rem;
        }

        .btn-reset {
            background: none;
            border: none;
            color: #6b7280;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.875rem;
            margin-top: 1rem;
            width: 100%;
        }

        .btn-reset:hover {
            color: #374151;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💰 Tip Calculator</h1>

    <div class="form-group">
        <label for="billAmount">Bill Amount ($)</label>
        <input type="number" id="billAmount" value="50" min="0" step="0.01">
    </div>

    <div class="form-group">
        <label for="people">Number of People</label>
        <input type="number" id="people" value="1" min="1">
    </div>

    <div class="divider"></div>

    <div class="form-group">
        <label for="tipPercentage">Tip Percentage</label>
        <div class="radio-group">
            <label>
                <input type="radio" name="tipPercentage" value="10" checked>
                10%
            </label>
            <label>
                <input type="radio" name="tipPercentage" value="15">
                15%
            </label>
            <label>
                <input type="radio" name="tipPercentage" value="20">
                20%
            </label>
        </div>
        <div class="custom-tip-container">
            <input type="text" id="customTip" placeholder="Custom % (e.g. 25)">
        </div>
    </div>

    <div class="results">
        <div class="result-row">
            <span>Total Tip:</span>
            <span id="totalTipDisplay">$0.00</span>
        </div>
        <div class="result-row">
            <span>Tip per Person:</span>
            <span id="tipPerPersonDisplay">$0.00</span>
        </div>
        <div class="result-row">
            <span>Total per Person:</span>
            <span id="totalPerPersonDisplay">$0.00</span>
        </div>
    </div>
    
    <button class="btn-reset" onclick="resetCalculator()">Reset Fields</button>
</div>

<script>
    // DOM Elements
    const billInput = document.getElementById('billAmount');
    const peopleInput = document.getElementById('people');
    const customTipInput = document.getElementById('customTip');
    const radios = document.querySelectorAll('input[name="tipPercentage"]');
    
    const totalTipDisplay = document.getElementById('totalTipDisplay');
    const tipPerPersonDisplay = document.getElementById('tipPerPersonDisplay');
    const totalPerPersonDisplay = document.getElementById('totalPerPersonDisplay');

    function formatCurrency(amount) {
        return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD'
        }).format(amount);
    }

    function calculate() {
        // Get Values
        const bill = parseFloat(billInput.value);
        const people = parseFloat(peopleInput.value);
        
        // Determine Tip Percentage
        let tipPercent = 10; // Default
        
        // Check radio buttons first
        for (const radio of radios) {
            if (radio.checked) {
                tipPercent = parseFloat(radio.value);
                // If custom is typed, we usually override the selected radio
                if (customTipInput.value.trim() !== "") {
                    tipPercent = parseFloat(customTipInput.value);
                }
                break;
            }
        }

        // Validation
        if (isNaN(bill) || bill < 0) bill = 0;
        if (isNaN(people) || people <= 0) people = 1;
        if (isNaN(tipPercent) || tipPercent < 0) tipPercent = 0;

        // Calculations
        const totalTip = bill * (tipPercent / 100);
        const tipPerPerson = totalTip / people;
        const totalPerPerson = (bill + totalTip) / people;

        // Update Display
        totalTipDisplay.textContent = formatCurrency(totalTip);
        tipPerPersonDisplay.textContent = formatCurrency(tipPerPerson);
        totalPerPersonDisplay.textContent = formatCurrency(totalPerPerson);
    }

    function resetCalculator() {
        billInput.value = 50;
        peopleInput.value = 1;
        customTipInput.value = "";
        
        // Set first radio as default
        radios[0].checked = true;

        calculate();
    }

    // Event Listeners
    billInput.addEventListener('input', calculate);
    peopleInput.addEventListener('input', calculate);
    
    customTipInput.addEventListener('input', function() {
        // Clear selected radio if custom is entered
        radios.forEach(r => r.checked = false);
        calculate();
    });
    
    // Attach listeners to all radio buttons manually to ensure they trigger logic even if custom is empty
    radios.forEach(radio => {
        radio.addEventListener('change', calculate);
    });

    // Initialize
    calculate();
</script>

</body>
</html>
