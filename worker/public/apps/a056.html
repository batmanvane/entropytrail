<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin-top: 0;
            text-shadow: 2px 2px #000;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        canvas {
            background-color: #000;
            display: block;
            border: 2px solid #555;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #game-over {
            display: none;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #fff;
            pointer-events: auto;
        }
        #game-over h2 {
            margin-top: 0;
            color: #ff4444;
        }
        #restart-btn {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            text-transform: uppercase;
            font-weight: bold;
        }
        #restart-btn:hover {
            background-color: #45a049;
        }
        #score-board {
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="ui-layer">
            <div id="game-over">
                <h2>GAME OVER</h2>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        // Game Constants
        const CANVAS_BORDER_COLOR = 'black';
        const CANVAS_BACKGROUND_COLOR = 'black';
        const SNAKE_COLOR = 'lightgreen';
        const SNAKE_BORDER_COLOR = 'darkgreen';
        const FOOD_COLOR = 'red';
        const FOOD_BORDER_COLOR = 'darkred';
        
        const GAME_SPEED_BASE = 100; // ms per frame (inverted speed)
        const SPEED_DECREMENT = 2;   // How much faster per level
        const MIN_SPEED = 40;        // Cap maximum speed
        
        const GRID_SIZE = 20;
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 400;

        // DOM Elements
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const finalScoreElement = document.getElementById("final-score");
        const gameOverModal = document.getElementById("game-over");
        const restartBtn = document.getElementById("restart-btn");

        // Game State
        let score = 0;
        let changingDirection = false;
        let gameRunning = false;
        let gameSpeed = GAME_SPEED_BASE;
        
        // Start coordinates
        let snake = [
            {x: 200, y: 200},
            {x: 190, y: 200},
            {x: 180, y: 200},
            {x: 170, y: 200},
            {x: 160, y: 200}
        ];
        
        let dx = 10;
        let dy = 0;
        let foodX;
        let foodY;
        let gameLoopInterval;

        // Initialize
        createFood();
        startGame();

        // Event Listeners
        document.addEventListener("keydown", changeDirection);
        restartBtn.addEventListener("click", startGame);

        function startGame() {
            if (gameRunning) return;

            // Reset State
            score = 0;
            scoreElement.innerHTML = score;
            dx = 10;
            dy = 0;
            changingDirection = false;
            gameSpeed = GAME_SPEED_BASE;
            snake = [
                {x: 200, y: 200},
                {x: 190, y: 200},
                {x: 180, y: 200},
                {x: 170, y: 200},
                {x: 160, y: 200}
            ];
            
            createFood();
            gameOverModal.style.display = "none";
            gameRunning = true;
            
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(main, gameSpeed);
        }

        function main() {
            if (didGameEnd()) {
                endGame();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            advanceSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = CANVAS_BACKGROUND_COLOR;
            ctx.strokeStyle = CANVAS_BORDER_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach(drawSnakePart);
        }

        function drawSnakePart(snakePart) {
            ctx.fillStyle = SNAKE_COLOR;
            ctx.strokeStyle = SNAKE_BORDER_COLOR;
            ctx.fillRect(snakePart.x, snakePart.y, 10, 10);
            ctx.strokeRect(snakePart.x, snakePart.y, 10, 10);
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            const didEatFood = snake[0].x === foodX && snake[0].y === foodY;
            if (didEatFood) {
                score += 10;
                scoreElement.innerHTML = score;
                createFood();
                
                // Check if we need to speed up (every 5 pieces)
                // Assuming 10 points per food, score % 50 === 0 means 5, 10, 15... pieces eaten
                if (score % 50 === 0) {
                    if (gameSpeed > MIN_SPEED) {
                        gameSpeed -= SPEED_DECREMENT;
                        clearInterval(gameLoopInterval);
                        gameLoopInterval = setInterval(main, gameSpeed);
                    }
                }
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            // Self-collision
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            // Wall collision
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x > canvas.width - 10;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y > canvas.height - 10;

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        function endGame() {
            gameRunning = false;
            finalScoreElement.innerText = score;
            gameOverModal.style.display = "block";
        }

        function randomTen(min, max) {
            return Math.round((Math.random() * (max-min) + min) / GRID_SIZE) * GRID_SIZE;
        }

        function createFood() {
            foodX = randomTen(0, canvas.width - 10);
            foodY = randomTen(0, canvas.height - 10);

            if (onSnake(foodX, foodY)) {
                createFood();
            }
        }

        function onSnake(x, y) {
            return snake.some(part => part.x === x && part.y === y);
        }

        function drawFood() {
            ctx.fillStyle = FOOD_COLOR;
            ctx.strokeStyle = FOOD_BORDER_COLOR;
            ctx.fillRect(foodX, foodY, 10, 10);
            ctx.strokeRect(foodX, foodY, 10, 10);
        }

        function changeDirection(event) {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;
            const W_KEY = 87;
            const A_KEY = 65;
            const S_KEY = 83;
            const D_KEY = 68;

            // Prevent the snake from reversing
            if (changingDirection) return;
            changingDirection = true;

            const keyPressed = event.keyCode;
            const goingUp = dy === -10;
            const goingDown = dy === 10;
            const goingRight = dx === 10;
            const goingLeft = dx === -10;

            if ((keyPressed === LEFT_KEY || keyPressed === A_KEY) && !goingRight) {
                dx = -10;
                dy = 0;
            }
            if ((keyPressed === UP_KEY || keyPressed === W_KEY) && !goingDown) {
                dx = 0;
                dy = -10;
            }
            if ((keyPressed === RIGHT_KEY || keyPressed === D_KEY) && !goingLeft) {
                dx = 10;
                dy = 0;
            }
            if ((keyPressed === DOWN_KEY || keyPressed === S_KEY) && !goingUp) {
                dx = 0;
                dy = 10;
            }
        }
    </script>
</body>
</html>
