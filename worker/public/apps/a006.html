<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Prep Hub</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--primary-color);
            color: white;
            padding: 1rem 2rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 1.5rem; font-weight: 600; }

        /* Layout */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            transition: transform 0.2s ease;
        }

        .card:hover { transform: translateY(-2px); }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .btn-outline { background: transparent; border: 2px solid var(--primary-color); color: var(--primary-color); }
        .btn-outline:hover { background: rgb(239, 246, 255); }

        .btn-minus { background: #e5e7eb; color: var(--text-main); padding: 0.5rem 1rem; font-weight: bold; }
        .btn-plus { background: var(--success); color: white; padding: 0.5rem 1rem; font-weight: bold; }

        /* Input */
        input[type="text"], textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary); }

        /* Progress Bar (Shared Card) */
        .progress-container {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 10px;
            margin: 1rem 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 10px;
            background: var(--success);
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats { display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }

        /* Question Section */
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .options-list { list-style: none; }
        .option-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-item:hover { border-color: var(--primary-color); background-color: #f9fafb; }
        .option-item.selected { border-color: var(--primary-color); background-color: rgb(219, 234, 254); }
        .option-item.correct { border-color: var(--success); background-color: #d1fae5; }
        .option-item.wrong { border-color: var(--error); background-color: #fee2e2; }

        .progress-steps {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }
        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .step.active { background: var(--primary-color); color: white; }
        .step.completed { background: var(--success); color: white; }

        /* Utility */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mt-4 { margin-top: 1rem; }

    </style>
</head>
<body>

    <header>
        <h1>PrepHub</h1>
        <nav>
            <button class="btn btn-outline" onclick="app.showHome()" style="margin-right: 10px; color: white; border-color: white;">Dashboard</button>
            <button class="btn" onclick="alert('This feature is coming soon!')" style="background: rgba(255,255,255,0.2); color: white;">Flashcards</button>
        </nav>
    </header>

    <main id="app-container">
        <!-- Content injected by JS -->
    </main>

    <script>
        /**
         * Sample Data for the Quiz
         */
        const quizData = [
            {
                id: 1,
                topic: "Microbiology",
                question: "Which of the following is NOT a prokaryotic cell?",
                options: [
                    "Bacteria",
                    "Archaea",
                    "Eukarya",
                    "Cyanobacteria"
                ],
                correct: 2 // Index of correct answer (Eukarya)
            },
            {
                id: 2,
                topic: "Physics",
                question: "What is the SI unit for Force?",
                options: [
                    "Joule",
                    "Newton",
                    "Watt",
                    "Pascal"
                ],
                correct: 1
            },
            {
                id: 3,
                topic: "Literature",
                question: "Who wrote 'To Kill a Mockingbird'?",
                options: [
                    "Harper Lee",
                    "Mark Twain",
                    "John Steinbeck",
                    "Ernest Hemingway"
                ],
                correct: 0
            },
            {
                id: 4,
                topic: "Chemistry",
                question: "What is the chemical symbol for Gold?",
                options: [
                    "Au",
                    "Ag",
                    "Fe",
                    "Gd"
                ],
                correct: 0
            }
        ];

        /**
         * Application Logic
         */
        const app = {
            state: {
                currentView: 'home', // home, study, review, quiz
                quizIndex: 0,
                score: 0,
                currentQuestion: null,
                selectedOption: null,
                reviewedIds: [], // IDs for the review section
            },

            // --- Views ---

            views: {
                HOME: `
                    <div class="card">
                        <h2>Ready to Test Your Knowledge?</h2>
                        <p style="margin-bottom: 1.5rem; color: var(--text-secondary);">
                            You have completed <strong>${this.state.reviewedIds.length}</strong> out of <strong>${quizData.length}</strong> questions so far.
                        </p>
                        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                            <button class="btn btn-primary" onclick="app.startQuiz()" style="flex: 1; justify-content: center;">
                                Start Quiz 🚀
                            </button>
                            <button class="btn btn-outline" onclick="app.showStudyMode()" style="flex: 1; justify-content: center;">
                                Study Only 📖
                            </button>
                        </div>
                    </div>
                    <div class="card text-center">
                        <h3>Recent Progress</h3>
                        <div class="progress-container" style="margin-top: 1rem; width: 100%;">
                            <div class="progress-bar" id="home-progress-bar"></div>
                        </div>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">${this.getPercentage()}% Completed</p>
                    </div>
                `,
                QUIZ: `
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <span style="font-weight: 600;">Question ${this.state.quizIndex + 1} of ${quizData.length}</span>
                            <span style="color: var(--primary-color); font-weight: 600;">Score: ${this.state.score}</span>
                        </div>
                        
                        <div class="progress-steps">
                            ${this.state.quizIndex < 3 ? `<div class="step active">1</div>` : ''}
                            ${this.state.quizIndex == 3 ? `<div class="step completed">2</div>` : ''}
                            ${this.state.quizIndex == 4 ? `<div class="step completed">3</div>` : ''}
                            ${this.state.quizIndex == 5 ? `<div class="step completed">4</div>` : ''}
                        </div>

                        <div style="margin-bottom: 1.5rem;">
                            <span style="font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;">${this.state.currentQuestion.topic}</span>
                            <div class="question-text" id="q-text">${this.state.currentQuestion.question}</div>
                        </div>

                        <ul class="options-list">
                            ${this.state.currentQuestion.options.map((opt, index) => `
                                <li class="option-item" onclick="app.selectOption(${index})">
                                    <span style="margin-right: 1rem; color: var(--primary-color); font-weight: bold;">${String.fromCharCode(65 + index)})</span>
                                    ${opt}
                                </li>
                            `).join('')}
                        </ul>

                        ${this.state.selectedOption !== null ? `
                            <div id="feedback-msg" style="margin-bottom: 1rem; font-weight: 600; text-align: center; display: none;">
                                ${this.getFeedback()}
                            </div>
                        ` : ''}

                        <div style="display: flex; justify-content: flex-end;">
                            <button id="next-btn" class="btn btn-primary" onclick="app.nextQuestion()" style="opacity: 0.5; pointer-events: none;" disabled>
                                Next Question &rarr;
                            </button>
                        </div>
                    </div>
                `,
                REVIEW: `
                    <div class="card">
                        <h2>Review Your Performance</h2>
                        <p style="margin-bottom: 1.5rem; color: var(--text-secondary);">Go through the questions you got wrong or reviewed earlier.</p>
                        
                        <div style="max-height: 300px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px;">
                            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                                <thead style="background: #f9fafb; border-bottom: 2px solid #e5e7eb;">
                                    <tr>
                                        <th style="padding: 1rem; font-size: 0.9rem;">Question</th>
                                        <th style="padding: 1rem; font-size: 0.9rem; text-align: right;">Your Answer</th>
                                        <th style="padding: 1rem; font-size: 0.9rem; text-align: center;">Wrong?</th>
                                        <th style="padding: 1rem; font-size: 0.9rem; text-align: center;">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${quizData.map(q => {
                                        const isWrong = this.state.reviewedIds.includes(q.id);
                                        return `
                                        <tr style="border-bottom: 1px solid #f3f4f6;">
                                            <td style="padding: 1rem;">${q.question}</td>
                                            <td style="padding: 1rem; border: 2px solid #e5e7eb; border-radius: 4px; width: 120px; min-height: 50px;">Your Answer here</td>
                                            <td style="padding: 1rem; text-align: center;">
                                                ${isWrong ? '<span style="color: var(--error); font-weight: bold;">Yes</span>' : '<span style="color: var(--success); font-weight: bold;">No</span>'}
                                            </td>
                                            <td style="padding: 1rem; text-align: center;">
                                                ${isWrong ? '<button class="btn btn-minus" onclick="this.closest(\'tr\').style.border=\'2px solid var(--error)\'">Review Again</button>' : 
                                                    `<button class="btn btn-plus" onclick="alert('Marked as mastered!'); this.closest('tr').style.opacity='0.5'">✓ Done</button>`}
                                            </td>
                                        </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `,
                STUDY_MODE: `
                     <div class="card">
                        <h2>Study Mode</h2>
                        <p style="margin-bottom: 1rem; color: var(--text-secondary);">Quiz yourself. Don't look at the correct answer until you decide on an option.</p>
                     </div>
                     
                     <!-- Simple Flashcard Interface for Study -->
                     <div id="flashcard-container" class="card text-center" style="margin-bottom: 2rem;">
                        <div id="flashcard-front" style="background: var(--primary-color); color: white; padding: 3rem; border-radius: 12px; margin-bottom: 1rem; cursor: pointer;" onclick="this.nextElementSibling.classList.toggle('hidden'); this.classList.toggle('hidden');">
                            <h2 id="flash-question">Loading...</h2>
                            <p style="margin-top: 1rem; opacity: 0.8;">(Click to flip answer)</p>
                        </div>
                        <div id="flashcard-back" class="hidden" style="background: #f9fafb; padding: 3rem; border-radius: 12px; border: 2px solid var(--primary-color);">
                            <h3 id="flash-answer"></h3>
                            <h4 style="color: var(--text-secondary); margin-bottom: 1rem; font-size: 0.9rem;" id="flash-topic"></h4>
                            <div style="display: flex; gap: 10px; justify-content: center;">
                                <button class="btn btn-minus" onclick="app.flipNextFlashcard(-1)">Prev</button>
                                <button class="btn btn-plus" onclick="app.flipNextFlashcard(1)">Next</button>
                            </div>
                        </div>
                     </div>
                `
            },

            // --- Actions ---

            init: () => {
                app.render();
                
                // Simulate some saved state
                const completedCount = localStorage.getItem('prepCompleted') || Math.floor(Math.random() * 3) + 1;
                // Just for demo, we won't persist actual progress in this simple version, 
                // but the UI shows static data or random local storage.
                
                // Set initial review list to one random question to demonstrate functionality
                app.state.reviewedIds = [0]; 
                app.ensureStateisValid();
            },

            render: () => {
                const container = document.getElementById('app-container');
                let html = '';

                switch(app.state.currentView) {
                    case 'home':
                        html = app.views.HOME;
                        // Update Home Progress
                        const total = quizData.length;
                        const done = 0; // In this demo, home view doesn't track completion until quiz is done
                        const pct = Math.round((done / total) * 100);
                        document.getElementById('home-progress-bar').style.width = `${pct}%`;
                        break;
                    case 'quiz':
                        if (!app.state.currentQuestion) app.startQuiz();
                        html = app.views.QUIZ;
                        document.getElementById('q-text').innerText = app.state.currentQuestion.question;
                        
                        // Reset State for new question
                        app.state.selectedOption = null;
                        document.getElementById('next-btn').disabled = true;
                        document.getElementById('next-btn').style.opacity = '0.5';
                        document.getElementById('next-btn').style.pointerEvents = 'none';
                        document.getElementById('feedback-msg').style.display = 'none';
                        
                        // Reset options visual state
                        document.querySelectorAll('.option-item').forEach(el => {
                            el.className = 'option-item';
                        });
                        break;
                    case 'review':
                        html = app.views.REVIEW;
                        break;
                    case 'study':
                        html = app.views.STUDY_MODE;
                        app.flipNextFlashcard(0);
                        break;
                }

                container.innerHTML = html;
            },

            // --- Quiz Logic ---

            startQuiz: () => {
                app.state.currentView = 'quiz';
                app.state.quizIndex = 0;
                app.state.score = 0;
                app.render();
            },

            nextQuestion: () => {
                // Save Score
                app.state.score += Math.floor((this.state.selectedOption === app.state.currentQuestion.correct ? 1 : 0) * 10);
                
                // Save state logic
                if (this.state.selectedOption === app.state.currentQuestion.correct) {
                    // If correct, push to reviewed list
                    app.state.reviewedIds.push(app.state.currentQuestion.id);
                } else {
                    // If wrong, push to reviewed list (idempotent, keeps ID in list)
                    if (!app.state.reviewedIds.includes(app.state.currentQuestion.id)) {
                        app.state.reviewedIds.push(app.state.currentQuestion.id);
                    }
                }
                app.ensureStateisValid();

                // Move Next
                if (app.state.quizIndex < quizData.length - 1) {
                    app.state.quizIndex++;
                    app.state.currentQuestion = quizData[app.state.quizIndex];
                    app.render();
                } else {
                    alert("Quiz Finished! Final Score: " + app.state.score);
                    app.state.currentView = 'home';
                    app.render();
                }
            },

            selectOption: (index) => {
                if (app.state.selectedOption === null) {
                    app.state.selectedOption = index;
                    document.getElementById('next-btn').disabled = false;
                    document.getElementById('next-btn').style.opacity = '1';
                    document.getElementById('next-btn').style.pointerEvents = 'auto';
                }
            },

            getFeedback: () => {
                const isCorrect = app.state.selectedOption === app.state.currentQuestion.correct;
                const div = document.getElementById('feedback-msg');
                const list = document.querySelectorAll('.option-item');
                
                // Highlight selected
                list.forEach((el, idx) => {
                    if (idx === app.state.selectedOption) {
                        if (isCorrect) el.classList.add('correct');
                        else el.classList.add('wrong');
                    }
                    if (idx === app.state.currentQuestion.correct && !isCorrect) {
                        el.classList.add('correct'); // Show correct answer if wrong
                        el.style.display = 'flex'; // Ensure visibility
                    }
                });

                if (isCorrect) {
                    div.innerText = `Correct! ${app.state.currentQuestion.options[app.state.selectedOption]}`;
                    div.style.color = 'var(--success)';
                } else {
                    div.innerText = `Wrong. The correct answer is: ${app.state.currentQuestion.options[app.state.currentQuestion.correct]}`;
                    div.style.color = 'var(--error)';
                }
                div.style.display = 'block';
            },

            // --- Study Mode Logic ---

            flipNextFlashcard: (direction) => {
                // (Simplified for this demo - just picks a random card for study)
                const randomCardIndex = Math.floor(Math.random() * quizData.length);
                const card = quizData[randomCardIndex];
                
                document.getElementById('flash-question').innerText = card.question;
                document.getElementById('flash-topic').innerText = card.topic;
                document.getElementById('flash-answer').innerText = card.options[card.correct];
            },

            // --- Utilities ---

            showHome: () => {
                app.state.currentView = 'home';
                app.render();
            },

            guaranteeState: () => {
                // Ensures we render correctly even if state was reset
            },
            
            ensureStateisValid: () => {
                // Redux-like state sanity check
                if(!Number.isInteger(app.state.score)) app.state.score = 0;
                if(!Number.isInteger(app.state.quizIndex)) app.state.quizIndex = 0;
            },

            getPercentage: () => {
                const total = quizData.length;
                const done = app.state.reviewedIds.length;
                return Math.round((done / total) * 100) || 0;
            }
        };

        // Start App
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

    </script>
</body>
</html>
