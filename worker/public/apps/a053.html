<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Breakout</title>
    <style>
        body {
            background-color: #222;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            background-color: #000;
            display: block;
            border: 4px solid #444;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
            display: none;
        }
        #message.show {
            display: block;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="uiLayer">
        <div class="hud">
            <span id="scoreDisplay">Score: 0</span>
            <span id="livesDisplay">Lives: 3</span>
        </div>
        <div id="message">Press SPACE to Start</div>
    </div>
</div>

<script>
    // --- Configuration ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const messageEl = document.getElementById('message');

    // Game Constants
    const PADDLE_WIDTH = 100;
    const PADDLE_HEIGHT = 15;
    const BALL_RADIUS = 8;
    const BRICK_ROW_COUNT = 5;
    const BRICK_COLUMN_COUNT = 10;
    const BRICK_WIDTH = 60;
    const BRICK_HEIGHT = 25;
    const BRICK_PADDING = 10;
    const BRICK_OFFSET_TOP = 40;
    const BRICK_OFFSET_LEFT = 35;
    const PADDLE_SPEED = 7;
    
    // Game State
    let score = 0;
    let lives = 3;
    let isGameRunning = false;
    let animationId = null;

    // Entities
    const paddle = {
        x: (canvas.width - PADDLE_WIDTH) / 2,
        y: canvas.height - PADDLE_HEIGHT - 10,
        dx: 0
    };

    const ball = {
        x: canvas.width / 2,
        y: canvas.height - 30,
        dx: 4,
        dy: -4,
        speed: 5 // Base speed magnitude
    };

    let bricks = [];

    // Input Handling
    document.addEventListener('keydown', keyDownHandler);
    document.addEventListener('keyup', keyUpHandler);

    function keyDownHandler(e) {
        if (e.key === 'Right' || e.key === 'ArrowRight') {
            paddle.dx = PADDLE_SPEED;
        } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
            paddle.dx = -PADDLE_SPEED;
        } else if (!isGameRunning && e.key === ' ') {
            startGame();
        }
    }

    function keyUpHandler(e) {
        if (e.key === 'Right' || e.key === 'ArrowRight' || 
            e.key === 'Left' || e.key === 'ArrowLeft') {
            paddle.dx = 0;
        } else if (e.key === ' ' && !isGameRunning) {
            startGame();
        }
    }

    function initBricks() {
        bricks = [];
        for (let c = 0; c < BRICK_COLUMN_COUNT; c++) {
            bricks[c] = [];
            for (let r = 0; r < BRICK_ROW_COUNT; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }
    }

    function startGame() {
        if (isGameRunning) return;
        
        // Reset State
        score = 0;
        lives = 3;
        isGameRunning = true;
        messageEl.classList.remove('show');
        
        initBricks();
        resetBall();
        updateUI();
        
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    function resetBall() {
        ball.x = canvas.width / 2;
        ball.y = canvas.height - 40;
        ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
        ball.dy = -4;
        paddle.x = (canvas.width - PADDLE_WIDTH) / 2;
    }

    function movePaddle() {
        paddle.x += paddle.dx;

        // Wall collisions
        if (paddle.x < 0) {
            paddle.x = 0;
        }
        if (paddle.x + PADDLE_WIDTH > canvas.width) {
            paddle.x = canvas.width - PADDLE_WIDTH;
        }
    }

    function moveBricks() {
        for (let c = 0; c < BRICK_COLUMN_COUNT; c++) {
            for (let r = 0; r < BRICK_ROW_COUNT; r++) {
                if (bricks[c][r].status === 1) {
                    const brickX = (c * (BRICK_WIDTH + BRICK_PADDING)) + BRICK_OFFSET_LEFT;
                    const brickY = (r * (BRICK_HEIGHT + BRICK_PADDING)) + BRICK_OFFSET_TOP;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                }
            }
        }
    }

    function collisionDetection() {
        for (let c = 0; c < BRICK_COLUMN_COUNT; c++) {
            for (let r = 0; r < BRICK_ROW_COUNT; r++) {
                const b = bricks[c][r];
                if (b.status === 1) {
                    if (ball.x > b.x && ball.x < b.x + BRICK_WIDTH && ball.y > b.y && ball.y < b.y + BRICK_HEIGHT) {
                        ball.dy = -ball.dy;
                        b.status = 0;
                        score += 10;
                        updateUI();

                        // Win Condition
                        if (score === BRICK_ROW_COUNT * BRICK_COLUMN_COUNT * 10) {
                            isGameRunning = false;
                            messageEl.textContent = "YOU WIN!";
                            messageEl.classList.add('show');
                        }
                    }
                }
            }
        }
    }

    function updateUI() {
        scoreDisplay.textContent = `Score: ${score}`;
        livesDisplay.textContent = `Lives: ${lives}`;
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = "#ff0000";
        ctx.fill();
        ctx.closePath();
    }

    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddle.x, paddle.y, PADDLE_WIDTH, PADDLE_HEIGHT);
        ctx.fillStyle = "#00ccff";
        ctx.fill();
        ctx.closePath();
    }

    function drawBricks() {
        for (let c = 0; c < BRICK_COLUMN_COUNT; c++) {
            for (let r = 0; r < BRICK_ROW_COUNT; r++) {
                if (bricks[c][r].status === 1) {
                    const brickX = (c * (BRICK_WIDTH + BRICK_PADDING)) + BRICK_OFFSET_LEFT;
                    const brickY = (r * (BRICK_HEIGHT + BRICK_PADDING)) + BRICK_OFFSET_TOP;
                    
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;

                    ctx.beginPath();
                    ctx.rect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT);
                    // Color based on row
                    ctx.fillStyle = `hsl(${r * 40}, 70%, 50%)`;
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function draw() {
        // Clear Canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBricks();
        drawBall();
        drawPaddle();
    }

    function update() {
        if (!isGameRunning) return;

        movePaddle();
        moveBricks();
        collisionDetection();

        // Ball Movement
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Ball Wall Collisions (Left/Right)
        if (ball.x + ball.dx > canvas.width - BALL_RADIUS || ball.x + ball.dx < BALL_RADIUS) {
            ball.dx = -ball.dx;
        }

        // Ball Ceiling Collision
        if (ball.y + ball.dy < BALL_RADIUS) {
            ball.dy = -ball.dy;
        } 
        // Ball Floor Collision (Game Over / Jump)
        else if (ball.y + ball.dy > canvas.height - BALL_RADIUS) {
            // Check if hitting paddle
            if (ball.x > paddle.x && ball.x < paddle.x + PADDLE_WIDTH) {
                // Simple angle calculation based on where it hit the paddle
                // Normalize collision point
                let collidePoint = ball.x - (paddle.x + PADDLE_WIDTH / 2);
                collidePoint = collidePoint / (PADDLE_WIDTH / 2);
                
                // Calculate angle (max 60 degrees)
                let angle = collidePoint * (Math.PI / 3);
                
                // Maintain speed (speed limit slightly higher for gameplay feel)
                let speed = Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy);
                speed = Math.min(speed + 0.2, 12); // Cap max speed

                ball.dx = speed * Math.sin(angle);
                ball.dy = -speed * Math.cos(angle);
            } else if (ball.y + ball.dy > canvas.height - BALL_RADIUS) {
                // Lost life
                lives--;
                updateUI();
                if (!lives) {
                    isGameRunning = false;
                    messageEl.textContent = "GAME OVER";
                    messageEl.classList.add('show');
                } else {
                    resetBall();
                }
            }
        }
    }

    function gameLoop() {
        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    // Initial Draw
    initBricks();
    draw();

</script>
</body>
</html>
