<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Table Trainer</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --success: #10b981;
            --error: #ef4444;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-light);
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .stat-value {
            color: var(--text);
        }

        .question-display {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--text);
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 1rem;
            font-size: 2rem;
            text-align: center;
            border: 2px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        input[type="number"].correct {
            border-color: var(--success);
            background-color: #ecfdf5;
        }

        input[type="number"].incorrect {
            border-color: var(--error);
            background-color: #fef2f2;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
        }

        .message {
            margin-top: 1rem;
            font-weight: 600;
            min-height: 1.5rem;
        }

        .message.success { color: var(--success); }
        .message.error { color: var(--error); }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            display: none;
        }

        .timer-display {
            color: var(--primary);
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-secondary {
            background-color: #e5e7eb;
            color: var(--text);
        }
        
        .btn-secondary:hover {
            background-color: #d1d5db;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Times Table Trainer</h1>
        
        <div class="stats-bar">
            <div>Score: <span id="score" class="stat-value">0</span></div>
            <div class="timer-display">Time: <span id="timer">60</span>s</div>
        </div>

        <div class="question-display" id="question">
            <!-- Question goes here -->
        </div>

        <div class="input-group">
            <input type="number" id="answer" placeholder="?" autocomplete="off">
        </div>

        <button id="submit-btn" class="btn">Submit</button>
        <div id="feedback" class="message"></div>

        <div class="controls">
            <button id="next-btn" class="btn btn-secondary">Skip</button>
            <button id="start-btn" class="btn">Start Game</button>
        </div>
    </div>

    <div id="game-over-overlay" class="overlay">
        <div class="container" style="padding: 1.5rem;">
            <h2>Time's Up!</h2>
            <p style="margin: 1rem 0; font-size: 1.2rem;">Final Score: <span id="final-score" style="font-weight: bold; color: var(--primary);">0</span></p>
            <button id="restart-btn" class="btn">Play Again</button>
        </div>
    </div>

    <script>
        // State variables
        let score = 0;
        let timeRemaining = 60;
        let isPlaying = false;
        let timerInterval = null;
        let currentQuestion = {};

        // DOM Elements
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const questionEl = document.getElementById('question');
        const inputEl = document.getElementById('answer');
        const submitBtn = document.getElementById('submit-btn');
        const feedbackEl = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const startBtn = document.getElementById('start-btn');
        const startBtnText = startBtn.innerText;
        const overlay = document.getElementById('game-over-overlay');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const nextBtnText = nextBtn.innerText;

        // Helper: Generate random number between min and max (inclusive)
        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        const generateQuestion = () => {
            const num1 = getRandomInt(1, 10);
            const num2 = getRandomInt(1, 10);
            currentQuestion = {
                num1,
                num2,
                answer: num1 * num2
            };
        };

        const updateUI = () => {
            scoreEl.textContent = score;
            timerEl.textContent = timeRemaining;

            if (isPlaying) {
                timerEl.style.color = 'var(--primary)';
                submitBtn.style.display = 'block';
                nextBtn.disabled = true;
            } else {
                timerEl.style.color = 'var(--text-light)';
                submitBtn.style.display = 'none';
                nextBtn.disabled = false;
                inputEl.disabled = !isPlaying;
            }

            // Focus input if playing and input is empty
            if (isPlaying && inputEl.value === '') {
                inputEl.focus();
            }
        };

        const renderQuestion = () => {
            questionEl.textContent = `${currentQuestion.num1} × ${currentQuestion.num2} = ?`;
            inputEl.value = '';
            inputEl.className = ''; // reset classes
            feedbackEl.textContent = '';
            inputEl.focus();
        };

        const handleStart = () => {
            if (!isPlaying) {
                score = 0;
                timeRemaining = 60;
                isPlaying = true;
                startBtn.textContent = startBtnText;
                updateUI();
                nextButtonState();
                renderQuestion();
                generateQuestion();
                startTimer();
            } else {
                // Just restarting without losing score logic could go here, 
                // but standard flow resets and runs open loop.
                resetGameLoop();
            }
        };

        const handleSkip = () => {
            if (!isPlaying) return;
            score = 0; // Skipping resets score usually
            timeRemaining = 60;
            isPlaying = true;
            startButtonText = "Start Game";
            updateUI();
            nextButtonState();
            renderQuestion();
            generateQuestion();
            startTimer();
        };

        const checkAnswer = () => {
            const userVal = inputEl.value;
            if (userVal === '') return;
            
            const userNum = parseInt(userVal);

            if (userNum === currentQuestion.answer) {
                // Correct
                score++;
                scoreEl.textContent = score;
                feedbackEl.textContent = 'Correct!';
                feedbackEl.className = 'message success';
                inputEl.className = 'correct';
                playSound('success');
                renderQuestion();
            } else {
                // Incorrect
                feedbackEl.textContent = `Wrong! It was ${currentQuestion.answer}`;
                feedbackEl.className = 'message error';
                inputEl.className = 'incorrect';
                playSound('error');
            }
            
            nextBtn.disabled = false;
        };

        const endGame = () => {
            isPlaying = false;
            clearInterval(timerInterval);
            submitBtn.style.display = 'none';
            restartBtn.style.display = 'block';
            finalScoreEl.textContent = score;
            overlay.style.display = 'flex';
            submitBtn.focus(); // for accessibility
        };

        const resetGameLoop = () => {
            clearInterval(timerInterval);
            endGame();
            overlay.style.display = 'none';
            startBtnText = "Start Game";
            updateUI();
            resetInput();
        };

        const startTimer = () => {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                if (timeRemaining < 10) {
                    timerEl.style.color = 'var(--error)';
                }
                
                if (timeRemaining <= 0) {
                    endGame();
                } else {
                    updateUI();
                }
            }, 1000);
        };

        const nextButtonState = () => {
            if (isPlaying) {
                submitBtn.disabled = false;
                nextBtn.disabled = true;
                submitBtn.focus();
            } else {
                submitBtn.disabled = true;
                nextBtn.disabled = false;
            }
        };

        const playSound = (type) => {
            // Simple AudioContext for a generated beep to avoid external assets
            // This keeps it self-contained without loading external files.
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
                }
                
                oscillationStart = ctx.currentTime;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {
                // Silence if audio not supported or blocked
            }
        };

        // Event Listeners
        startBtn.addEventListener('click', handleStart);
        nextBtn.addEventListener('click', handleSkip);
        submitBtn.addEventListener('click', checkAnswer);
        restartBtn.addEventListener('click', resetGameLoop);

        // Enter key to submit
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (isPlaying) {
                    checkAnswer();
                } else if (isPlaying && inputEl.value !== '') {
                    checkAnswer();
                }
            }
        });

        // Initialize UI
        updateUI();

    </script>
</body>
</html>
