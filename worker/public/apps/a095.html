<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --card-bg: #ecf0f1;
            --card-back: #3498db;
            --text-color: #ecf0f1;
            --accent: #e74c3c;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
            perspective: 1000px;
        }

        .card {
            width: 100px;
            height: 100px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .card.flip {
            transform: rotateY(180deg);
        }

        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-size: 2.5rem;
        }

        .card-front {
            background-color: var(--card-bg);
            transform: rotateY(180deg);
        }

        .card-back {
            background-color: var(--card-back);
            background-image: linear-gradient(45deg, #2980b9 25%, transparent 25%, transparent 75%, #2980b9 75%, #2980b9), 
                              linear-gradient(45deg, #2980b9 25%, transparent 25%, transparent 75%, #2980b9 75%, #2980b9);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        ..message-box {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 1.5em;
            color: #2ecc71;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: var(--card-back);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Mobile Responsiveness */
        @media (max-width: 500px) {
            .grid-container {
                grid-template-columns: repeat(4, 70px);
                grid-template-rows: repeat(4, 70px);
                gap: 8px;
            }
            .card {
                width: 70px;
                height: 70px;
            }
            .card-face {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <h1>Memory Game</h1>
    
    <div class="stats">
        <span>Moves: <span id="move-count">0</span></span>
        <span>Matches: <span id="match-count">0</span>/8</span>
    </div>

    <div class="grid-container" id="game-grid">
        <!-- Cards will be injected here by JavaScript -->
    </div>

    <div class="message-box" id="message"></div>
    <button onclick="initGame()">Restart Game</button>

    <script>
        // Game Configuration
        const emojis = ['🍕', '🚀', '🐱', '🌺', '🎸', '🍦', '⚽', '💎'];
        // Double the array to create pairs
        const cardsArray = [...emojis, ...emojis];
        
        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matches = 0;
        let gameWon = false;

        // DOM Elements
        const gridElement = document.getElementById('game-grid');
        const moveCountElement = document.getElementById('move-count');
        const matchCountElement = document.getElementById('match-count');
        const messageElement = document.getElementById('message');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            // Reset state
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            moves = 0;
            matches = 0;
            gameWon = false;

            // Update UI
            moveCountElement.innerText = moves;
            matchCountElement.innerText = matches;
            messageElement.innerText = '';

            // Prepare cards
            cards = shuffle([...cardsArray]);

            // Generate HTML
            gridElement.innerHTML = '';
            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                // Use dataset to store the value for matching
                card.dataset.value = emoji;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-face card-front">${emoji}</div>
                    <div class="card-face card-back"></div>
                `;

                card.addEventListener('click', flipCard);
                gridElement.appendChild(card);
            });
        }

        function flipCard() {
            // Prevent flipping if board is locked (waiting for flip animation)
            if (lockBoard) return;
            // Prevent clicking the same card twice
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                // First card clicked
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Second card clicked
            secondCard = this;
            incrementMoves();
            checkForMatch();
        }

        function incrementMoves() {
            moves++;
            moveCountElement.innerText = moves;
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.value === secondCard.dataset.value;

            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            // It's a match
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);

            matches++;
            matchCountElement.innerText = matches;

            resetBoard();

            // Check for game win
            if (matches === emojis.length) {
                setTimeout(() => {
                    messageElement.innerText = `You won in ${moves} moves! 🎉`;
                    gameWon = true;
                }, 500);
            }
        }

        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        // Start the game on load
        initGame();
    </script>
</body>
</html>
