<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Reflex - Break Time</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #00ff9d;
            --danger-color: #ff0055;
            --secondary-color: #2a2a2a;
            --font-primary: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 90vw;
            max-width: 800px;
            height: 60vh;
            background-color: var(--secondary-color);
            border: 2px solid var(--secondary-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            touch-action: none;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #ccc;
            text-align: center;
            max-width: 80%;
        }

        /* Buttons */
        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--bg-color);
            background-color: var(--accent-color);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.6);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
        }

        #timer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 8px;
            background-color: var(--accent-color);
            width: 100%;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--accent-color);
        }

        // Elements
        .element {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .element.good {
            background-color: rgba(0, 255, 157, 0.2);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
        }

        .element.bad {
            background-color: rgba(255, 0, 85, 0.2);
            border: 2px solid var(--danger-color);
            color: var(--danger-color);
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            #game-container { width: 95vw; height: 50vh; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">Score: <span id="score">0</span></div>
        <div id="timer-bar"></div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>Neon Reflex</h1>
            <p>Click or tap the <span style="color:var(--accent-color)">Green</span> circles. Avoid the <span style="color:var(--danger-color)">Red</span> ones.</p>
            <button class="btn" id="start-btn">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h1 style="color: var(--danger-color); text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);">Game Over</h1>
            <p>Your Score: <span id="final-score" style="color: white; font-weight: bold; font-size: 1.5em;">0</span></p>
            <button class="btn" id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        /**
         * Game Logic for Neon Reflex
         * Implements a loop, entity management, and DOM event handling.
         */
        
        // Configuration
        const CONFIG = {
            spawnRate: 800, // ms between spawns initially
            baseCircleSize: 50,
            fallSpeed: 0, // Calculated dynamically
            timerDuration: 30, // seconds
            colors: {
                good: '#00ff9d',
                bad: '#ff0055',
                bg: '#121212',
                secondary: '#2a2a2a'
            }
        };

        // State
        let state = {
            isPlaying: false,
            score: 0,
            timer: CONFIG.timerDuration,
            spawnTimer: 0,
            elements: [], // Array of { domElement, y, type, id }
            lastTime: 0,
            difficultyMultiplier: 1
        };

        // DOM Elements
        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const timerBar = document.getElementById('timer-bar');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Utility: Random Number
        const random = (min, max) => Math.random() * (max - min) + min;

        // Game Loop
        function gameLoop(timestamp) {
            if (!state.isPlaying) return;

            // Calculate Delta Time
            const deltaTime = timestamp - state.lastTime;
            state.lastTime = timestamp;

            updateGameLogic(deltaTime);
            checkCollisions();
            requestAnimationFrame(gameLoop);
        }

        function updateGameLogic(deltaTime) {
            // Timer Logic
            state.timer -= deltaTime / 1000;
            if (state.timer <= 0) {
                endGame();
                return;
            }
            updateTimerVisual();

            // Spawn Logic
            state.spawnTimer += deltaTime;
            // Decrease spawn interval as score increases (difficulty)
            const currentSpawnRate = Math.max(200, CONFIG.spawnRate - (state.score * 5));
            
            if (state.spawnTimer > currentSpawnRate) {
                spawnElement();
                state.spawnTimer = 0;
            }

            // Cleanup off-screen elements
            state.elements.forEach((el, index) => {
                if (el.y > window.innerHeight) {
                    removeElement(el);
                    state.elements.splice(index, 1);
                }
            });
        }

        function spawnElement() {
            const isGood = Math.random() > 0.4; // 60% chance to be good
            const size = random(CONFIG.baseCircleSize * 0.8, CONFIG.baseCircleSize * 1.2);
            
            const el = document.createElement('div');
            el.classList.add('element', isGood ? 'good' : 'bad');
            el.textContent = isGood ? '🟢' : '🔴';
            
            // Random X Position (constrained to container width)
            const containerRect = container.getBoundingClientRect();
            const maxX = containerRect.width - size;
            const x = random(0, maxX);

            // Random Y (start just above container)
            const startY = -size * 2;
            
            const elementData = {
                el: el,
                x: x,
                y: startY,
                size: size,
                velocityY: random(2, 5),
                type: isGood ? 'good' : 'bad'
            };

            // Position in DOM
            elementData.el.style.left = `${elementData.x}px`;
            elementData.el.style.top = `${elementData.y}px`;
            elementData.el.style.width = `${elementData.size}px`;
            elementData.el.style.height = `${elementData.size}px`;

            // Event Listeners for clicking
            const handleInput = (e) => {
                if (!state.isPlaying) return;
                // Prevent default to stop double firing on some touch devices
                e.preventDefault();
                checkHit(elementData, e);
            };
            
            elementData.el.addEventListener('mousedown', handleInput);
            elementData.el.addEventListener('touchstart', handleInput);

            container.appendChild(el);
            state.elements.push(elementData);

            // Remove listener when element is removed
            const cleanup = () => {
                el.removeEventListener('mousedown', handleInput);
                el.removeEventListener('touchstart', handleInput);
                el.removeEventListener('click', cleanup); // also clicks
            };
            elementData.el.addEventListener('click', cleanup);
        }

        function checkCollisions() {
            const rect = container.getBoundingClientRect();
            
            state.elements.forEach(el => {
                el.y += el.velocityY;
                el.el.style.top = `${el.y}px`;

                // Simple AABB Collision with mouse/cursor
                // We check if the element's bounding box is very close to the cursor
                const centX = el.x + el.size / 2;
                const centY = el.y + el.size / 2;
                
                // We use the opposite click handling for bad elements:
                // If mouse is slightly inside, it's considered a hit or hover
                
                const dx = mousePos.x - centX;
                const dy = mousePos.y - centY;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                // Hit radius (slightly smaller than element)
                const hitRadius = el.size / 2 - 5;

                if (distance < hitRadius) {
                    // Hit logic
                    if (el.type === 'good') {
                        // Correct, but only counts if we didn't just click it (handled by removing logic, 
                        // but visual feedback is instant so let's just remove it)
                        // Note: Since 'click' event fires on position: center, this is fine.
                        // However, we need to handle timeout so score doesn't count if clicked too late?
                        // No, click happens immediately.
                        
                        removeElement(el);
                        addScore(10);
                    } else {
                        // Bad
                        endGame();
                    }
                }
                
                // Remove if clicked specifically
                if (['element', 'good', 'bad'].includes(el.el.dataset.status)) {
                    el.el.addEventListener('click', () => {
                        if (el.type === 'good') {
                            removeElement(el);
                            addScore(10);
                        } else {
                            // Self-destruct bad item
                            addScore(5); // Bonus for bravery?
                            removeElement(el);
                        }
                    });
                    el.el.dataset.status = 'click'; // Mark as clickable
                }
            });
        }

        // Integrate click listener for processing hits properly in the loop or via direct call
        // Actually, let's handle the click logic purely via the EventListener attached to the DOM element
        // We just need to ensure we don't let the element fall if clicked.
        
        state.elements.forEach(el => {
            el.el.addEventListener('click', (e) => {
                if (state.isPlaying) {
                    if (el.type === 'good') {
                        removeElement(el);
                        addScore(10);
                        createParticles(e.clientX, e.clientY, CONFIG.colors.good);
                    } else {
                        removeElement(el);
                        addScore(5); // Bonus for catching red
                        createParticles(e.clientX, e.clientY, CONFIG.colors.bad);
                    }
                }
            });
        });


        function checkHit(elemData, event) {
            // Remove from array to prevent double processing
            const index = state.elements.indexOf(elemData);
            if (index > -1) {
                state.elements.splice(index, 1);
                elemData.el.remove();
            }
            
            if (elemData.type === 'good') {
                addScore(20); // Bonus for clicking
            } else {
                // In this version, clicking "Bad" is allowed for points but maybe speed up?
                // Let's keep it simple: Click Good = +20, Click Bad = Game Over (standard reflex arc)
                // OR let's do the "Atomic Heart" style: Click Bad = -Score.
                // Let's go with: Click Bad = 5 points (incentive, but risky).
                endGame(); 
            }
        }
        
        // Refactored click handler to be cleaner
        const clickHandlers = new Map();

        function createClickHandler(type, onGoodHit, onBadHit) {
            return (e) => {
                if (!state.isPlaying) return;
                e.preventDefault(); // Prevent double fire on touch
                
                const elem = e.target;
                const data = elem.dataset.clicked; // Disable one-shot

                if (!data || data !== 'processed') {
                    // Hit Logic
                    if (type === 'good') {
                        onGoodHit(elem, data);
                    } else {
                        onBadHit(elem, data);
                    }
                    elem.dataset.clicked = 'processed';
                }
            };
        }


        // Helper to mark elements as processed
        function setupClickLogic() {
            container.querySelectorAll('.element').forEach(el => {
                el.dataset.clicked = 'processed'; // Init
                
                el.addEventListener('click', (e) => {
                    if (e.target.dataset.clicked === 'processed') {
                        if (el.classList.contains('good')) {
                            // Good Item
                            removeElement(el);
                            addScore(10);
                            createParticles(parseInt(e.clientX), parseInt(e.clientY), CONFIG.colors.good);
                        } else {
                            // Bad Item (Or captured Good)
                            addScore(-20); // Penalty for mistakes if missed? 
                            // Or just Game Over? Let's do penality on click for variety.
                            // Actually, let's go with "Avoid Red, Catch Green".
                            // If you click Too Late, you miss it.
                            // If you click Wrong, Game Over.
                            if (Math.random() > 0.3) { // 70% chance to survive click red
                                removeElement(el);
                                addScore(-5); // Loss for clicking red
                            } else {
                                removeElement(el);
                                endGame();
                            }
                        }
                    }
                });
            });
        }


        function addScore(points) {
            state.score += points;
            if (state.score < 0) state.score = 0;
            scoreEl.textContent = state.score;
        }

        function removeElement(elData) {
            const el = elData.el;
            el.style.transform = 'scale(1.2)';
            el.style.opacity = '0';
            // Fade out effect
            el.addEventListener('transitionend', () => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, {once:true});
        }

        function createParticles(x, y, color) {
            // Simple CSS particle explosion
            const particle = document.createElement('div');
            particle.style.position = 'absolute';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.width = '10px';
            particle.style.height = '10px';
            particle.style.backgroundColor = color;
            particle.style.borderRadius = '50%';
            particle.style.pointerEvents = 'none';
            particle.style.zIndex = '20';
            particle.style.boxShadow = `0 0 10px ${color}`;
            
            // Randomize movement
            const destX = random(x - 20, x + 20);
            const destY = random(y - 20, y + 20);
            
            // Animate using Web Animations API
            particle.animate([
                { transform: 'translate(0,0) scale(1)' },
                { transform: `translate(${destX - x}px, ${destY - y}px) scale(0)` }
            ], {
                duration: 400,
                easing: 'cubic-bezier(0, .9, .57, 1)',
                fill: 'forwards'
            }).onfinish = () => particle.remove();

            container.appendChild(particle);

            // Confetti burst logic simplified
            for(let i=0; i<5; i++) {
                const p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.width = '6px';
                p.style.height = '6px';
                p.style.backgroundColor = color;
                p.style.borderRadius = '2px';
                p.style.pointerEvents = 'none';
                p.style.zIndex = '20';
                
                const angle = (Math.PI * 2 * i) / 5;
                const dist = 50;
                const vx = Math.cos(angle) * dist;
                const vy = Math.sin(angle) * dist;
                
                p.animate([
                    { transform: 'translate(0,0)' },
                    { transform: `translate(${vx}px, ${vy - 50}px)` } // -50 because some might float up
                ], {
                    duration: 500,
                    easing: 'ease-in-out',
                    fill: 'forwards'
                }).onfinish = () => p.remove();

                container.appendChild(p);
            }
        }

        function updateTimerVisual() {
            const percentage = (state.timer / CONFIG.timerDuration) * 100;
            timerBar.style.width = `${percentage}%`;
            
            // Color shift based on urgency
            if (percentage < 30) {
                timerBar.style.backgroundColor = CONFIG.colors.bad;
                timerBar.style.boxShadow = `0 0 10px ${CONFIG.colors.bad}`;
            } else {
                timerBar.style.backgroundColor = CONFIG.colors.good;
                timerBar.style.boxShadow = `0 0 10px ${CONFIG.colors.good}`;
            }
        }

        function updateMousePosition(e) {
            const containerRect = container.getBoundingClientRect();
            state.mousePos = {
                x: e.clientX - containerRect.left,
                y: e.clientY - containerRect.top
            };
        }

        // Listeners for UI
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        window.addEventListener('mousemove', updateMousePosition);
        // Touch move for mouse logic
        window.addEventListener('touchmove', updateMousePosition);

        function startGame() {
            // Reset State
            state.score = 0;
            state.timer = CONFIG.timerDuration;
            state.spawnTimer = 0;
            state.isPlaying = true;
            state.elements = [];
            state.difficultyMultiplier = 1;

            // Clear UI
            container.innerHTML = '<div id="hud">Score: <span id="score">0</span></div><div id="timer-bar"></div>';
            document.getElementById('hud').querySelector('span').textContent = '0';
            document.getElementById('timer-bar').style.width = '100%';
            
            setupClickLogic();
            
            // Jumpshot restart hook
            window.addEventListener('keyup', respawnHook);

            // Show/Hide screens
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            // Start Loop
            state.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            state.isPlaying = false;
            window.removeEventListener('keyup', respawnHook);
            finalScoreEl.textContent = state.score;
            gameOverScreen.classList.remove('hidden');
        }

        // Blink element on Up Arrow to retry failed click
        let respawnTimeout;
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowUp' && state.score < 1000) { // Simple restart once
                // Prevent window scroll
                e.preventDefault();
                startGame();
            }
        });

    </script>
</body>
</html>
