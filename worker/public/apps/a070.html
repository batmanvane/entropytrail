<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kairos: Bio-Resonant Visualization</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-1: #00ffea;
            --accent-2: #ff0099;
            --text-color: rgba(255, 255, 255, 0.8);
        }

        * { box-sizing: border-box; outline: none; user-select: none; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-color);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Center Interface */
        #ui-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
        }

        h1 {
            font-size: 1.5rem;
            font-weight: normal;
            letter-spacing: 0.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-1);
            mix-blend-mode: screen;
        }

        p.status {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 2rem;
        }

        /* The Orb / Listener */
        #core {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--accent-1), transparent);
            box-shadow: 0 0 40px var(--accent-1);
            margin: 0 auto;
            cursor: crosshair;
            transition: transform 0.1s ease-out;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #core.laughing {
            box-shadow: 0 0 60px var(--accent-2);
            background: radial-gradient(circle at 30% 30%, var(--accent-2), transparent);
        }

        #core.ssss {
            box-shadow: 0 0 20px white;
            background: radial-gradient(circle at 30% 30%, white, transparent);
        }

        /* UI Indicators */
        .metric {
            display: flex;
            justify-content: space-between;
            width: 300px;
            margin: 10px auto;
            font-size: 0.7rem;
            opacity: 0;
            animation: fadeOut 2s forwards;
        }
        
        .metric.visible { animation: fadeIn 0.5s forwards 0.5s; }

        .bar-container {
            flex-grow: 1;
            height: 2px;
            background: rgba(255,255,255,0.2);
            margin-left: 10px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: var(--accent-1);
            width: 0%;
            box-shadow: 0 0 10px var(--accent-1);
        }

        /* Particle Rain */
        .drop {
            position: absolute;
            width: 2px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            pointer-events: none;
        }

        /* Animations */
        @keyframes scale {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; } }

        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 1s ease;
        }

        button {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 15px 30px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            font-family: inherit;
        }

        button:hover {
            background: white;
            color: black;
            box-shadow: 0 0 20px white;
        }

        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.8);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 10px;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transform: translate(-50%, -150%);
            transition: opacity 0.2s;
        }
        .tooltip.visible { opacity: 1; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1>Kairos</h1>
        <p>Bio-Resonant Visualization</p>
        <p style="font-size: 0.8rem; max-width: 400px; text-align: center;">
            Aim your cursor at the Sphere.<br>
            <span style="color:var(--accent-1)">Smooth movement</span> = Singing/Rain<br>
            <span style="color:var(--accent-2)">Shaking/Jitter</span> = Glitch/Drone<br>
            <span style="color:white">Holding</span> = Explosion
        </p>
        <button id="init-btn">Begin Session</button>
    </div>

    <canvas id="canvas"></canvas>
    
    <div id="ui-layer">
        <div id="core">
            <div id="tooltip" class="tooltip"></div>
        </div>
        
        <div class="metric" id="m-velocity">
            <span>VELOCITY</span>
            <div class="bar-container"><div class="bar-fill" id="bar-v"></div></div>
        </div>
        
        <div class="metric" id="m-jitter">
            <span>JITTER</span>
            <div class="bar-container"><div class="bar-fill" id="bar-j"></div></div>
        </div>

        <div class="status" id="status-text">Focus your mouse...</div>
    </div>

    <script>
        /**
         * KAIROS - Bio-Resonant Visualization
         * A procedural audio/visual engine running entirely in-browser.
         */

        // --- CONFIGURATION ---
        const config = {
            minPath: 25,     // Minimum path length for "Laughter" state
            threshold: 2.0,  // Velocity threshold for "Breath" state
            decay: 0.95,     // Rain fade rate
            maxParticles: 80
        };

        // --- STATE MANAGEMENT ---
        const state = {
            x: 0, y: 0,
            lastX: 0, lastY: 0,
            jitter: 0,
            velocityPath: [],
            active: false,
            canvas: null,
            ctx: null,
            audioCtx: null,
            masterGain: null,
            percussionGain: null,
            windSynth: null,
            rainSynth: null,
            particles: []
        };

        // --- INITIALIZATION ---
        const core = document.getElementById('core');
        const tooltip = document.getElementById('tooltip');
        const statusText = document.getElementById('status-text');
        
        function init() {
            state.canvas = document.getElementById('canvas');
            state.ctx = state.canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Event Listeners
            window.addEventListener('mousemove', handleInput);
            document.getElementById('init-btn').addEventListener('click', startApp);

            // Loop
            requestAnimationFrame(loop);
        }

        function resizeCanvas() {
            state.canvas.width = window.innerWidth;
            state.canvas.height = window.innerHeight;
        }

        function startApp() {
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('start-overlay').remove(), 1000);
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            state.audioCtx = new AudioContext();
            
            // Master Gain
            state.masterGain = state.audioCtx.createGain();
            state.masterGain.gain.value = 0.3;
            state.masterGain.connect(state.audioCtx.destination);

            // Rain Gain
            state.percussionGain = state.audioCtx.createGain();
            state.percussionGain.gain.value = 0.1;
            state.percussionGain.connect(state.masterGain);

            state.active = true;
            update();
        }

        // --- AUDIO ENGINE (Synthesizers) ---
        
        // 1. The Wind (Detected by Velocity/Path)
        function createWindSynth() {
            // Low frequency oscillator
            const osc = state.audioCtx.createOscillator();
            const gain = state.audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = 40;
            
            // Distortion for texture
            const dist = state.audioCtx.createWaveShaper();
            const curve = new Float32Array(state.audioCtx.sampleRate * 10);
            for (let i = 0; i < curve.length; i++) {
                const x = (i / curve.length) * 2 - 1;
                curve[i] = (2 / Math.PI) * Math.asin(x); // Soft clip
            }
            // Actually, let's do frequency modulation for "windiness"
            const modOsc = state.audioCtx.createOscillator();
            modOsc.type = 'triangle';
            modOsc.frequency.value = 10; // Low hum
            
            osc.connect(dist);
            dist.connect(gain);
            gain.connect(state.percussionGain);
            
            osc.start();
            modOsc.start();
            
            return { node: osc, mod: modOsc, gain };
        }

        // 2. The Rain (Detected by Velocity/VelocityVariation)
        function createRainSynth() {
            const bufferSize = 2 * state.audioCtx.sampleRate;
            const buffer = state.audioCtx.createBuffer(1, bufferSize, state.audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const noise = state.audioCtx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;
            
            // Filtering
            const filter = state.audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.Q.value = 1;
            filter.frequency.value = 800;

            const gain = state.audioCtx.createGain();
            gain.gain.value = 0;

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(state.percussionGain);
            
            noise.start();
            return { node: noise, gain };
        }

        let synthWind = null;
        let synthRain = null;

        function setupAudio() {
            synthWind = createWindSynth();
            synthRain = createRainSynth();
            
            // Simple loop for sound
            setInterval(() => {
                if(!state.audioCtx) return;
                if(state.velocityPath.length > config.minPath) {
                    // Increase pitch/quality with focus
                    synthWind.node.frequency.value = 50 + (state.velocityPath.length % 10 || 1); 
                }
            }, 100);
        }

        // --- INPUT PROCESSING ---

        function handleInput(e) {
            state.x = e.clientX;
            state.y = e.clientY;

            // Calculate velocity
            const dx = state.x - state.lastX;
            const dy = state.y - state.lastY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            // Decay velocity path
            state.velocityPath.push(dist);
            if (state.velocityPath.length > 20) state.velocityPath.shift();

            // Calculate Jitter (Accelerometer/Mouse Shake)
            state.rams = 0;
            const sum = state.velocityPath.reduce((a, b) => a + b, 0);
            const mean = sum / state.velocityPath.length;
            const variance = state.velocityPath.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b, 0);
            state.jitter = Math.sqrt(variance / state.velocityPath.length) / 2.0;

            // Normalization for UI (0-1)
            const normVel = Math.min(dist / 100, 1);
            const normJitter = Math.min(state.jitter, 1);

            // UI Updates
            updateUI(normVel, normJitter);
            moveCore(dx, dy, dist, normJitter);
            createParticles(dx, dy, dist, normJitter);
        }

        // --- VISUAL RENDERING ---

        function moveCore(dx, dy, dist, jitter) {
            const intensity = dist + jitter;
            
            // Visual CSS manipulation
            if (state.active) {
                const scale = 1 + (jitter * 0.1);
                core.style.transform = `scale(${scale})`;
                
                // Rim light color shift
                const hue = 180 + (dist * 2); // Cyan to Greenish
                core.style.setProperty('--accent-1', `hsl(${hue}, 100%, 50%)`);
            }

            // Tooltip Logic
            if (dist > config.threshold) {
                tooltip.className = "tooltip laughing visible"; // Jitter/Large moves
                tooltip.innerText = "Glitch Found";
            } else if (dist > 5 && dist < config.threshold) {
                tooltip.className = "tooltip ssss visible"; // Smooth small moves
                tooltip.innerText = "Flowing";
            } else {
                tooltip.className = "tooltip";
            }
        }

        function createParticles(dx, dy, dist, jitter) {
            // Noise floor
            if(Math.random() > 0.5) return;

            // Emit based on velocity
            if (dist > 1 || jitter > 0.3) {
                const count = Math.floor(Math.random() * 3) + 1;
                for(let i=0; i<count; i++) {
                    const el = document.createElement('div');
                    el.className = 'drop';
                    document.getElementById('core').appendChild(el);
                    
                    const size = Math.random() * 4 + 2;
                    el.style.width = `${size}px`;
                    el.style.height = `${size}px`;
                    
                    // Physics
                    let vx = (dx * 0.1) + (Math.random() - 0.5);
                    let vy = (dy * 0.1) + (Math.random() - 0.5);
                    let x = 0;
                    let y = 0;

                    // Update Loop for particles is handled in main loop
                    // But we store the DOM element
                    el.dataset.vx = vx;
                    el.dataset.vy = vy;
                    
                    el.style.display = 'block';
                }
            }
        }

        function updateUI(v, j) {
            const vBar = document.getElementById('bar-v');
            const jBar = document.getElementById('bar-j');
            
            vBar.style.width = `${v * 100}%`;
            jBar.style.width = `${j * 100}%`;

            const mVel = document.getElementById('m-velocity');
            const mJit = document.getElementById('m-jitter');
            const mStatus = document.getElementById('status-text');

            mStatus.innerText = "Ready...";
            mStatus.style.opacity = 0;

            // Reset animations
            setTimeout(() => {
                mVel.style.animation = 'fadeIn 0.5s forwards';
                mJit.style.animation = 'fadeIn 0.5s forwards';
                setTimeout(() => {
                    mVel.style.animation = 'fadeOut 1s forwards';
                    mJit.style.animation = 'fadeOut 1s forwards';
                }, 500);
            }, 1000);
        }

        // --- MAIN LOOP ---

        function update() {
            if (!state.active) return;

            // Draw
            const ctx = state.ctx;
            const w = state.canvas.width;
            const h = state.canvas.height;

            // Trail effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, w, h);

            // Draw Grid (Background)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            const centerX = w / 2;
            const centerY = h / 2;
            
            // Dynamic grid scaling
            const zoom = 1 + (state.velocityPath.length / 100);
            
            ctx.beginPath();
            for(let x=0; x<w; x+=gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            for(let y=0; y<h; y+=gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
            }
            ctx.stroke();

            // Update Particles
            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;

                if (p.life <= 0) {
                    state.particles.splice(i, 1);
                    const el = document.getElementById('core').querySelector(`[data-p="${p.id}"]`);
                    if(el) el.remove();
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            requestAnimationFrame(loop);
        }

        function loop() {
            if (!state.active) return;

            // Update Particles from DOM logic
            const drops = document.querySelectorAll('.drop');
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Generate new particles based on recent velocity
            const avgVel = state.velocityPath.reduce((a,b)=>a+b, 0) / (state.velocityPath.length || 1);
            if (avgVel > 2 || (state.lastX === centerX && Math.random() > 0.9)) {
                 // Emit drop
                 const el = document.createElement('div');
                 el.className = 'drop';
                 el.style.left = `${centerX}px`;
                 el.style.top = `${centerY}px`;
                 document.getElementById('core').appendChild(el);
                 state.particles.push({
                     vx: (Math.random() - 0.5),
                     vy: (Math.random() - 0.5) + 2, // Gravity
                     life: 1.0,
                     size: Math.random() * 3 + 1,
                     id: Math.random()
                 });
            }

            // Update DOM particles positions
            state.particles.forEach(p => {
                const el = document.getElementById(`core [data-p="${p.id}"]`);
                if(el) {
                    el.style.left = `${el.offsetLeft + p.vx * 20 + p.vx * p.vx * 5}px`;
                    el.style.top = `${el.offsetTop + p.vy * 20 + p.vy * p.vy * 5}px`;
                }
            });

            // Audio Reactivity Loop
            updateAudio(avgVel, state.jitter);

            requestAnimationFrame(loop);
        }

        function updateAudio(avgVel, jitter) {
            if (!state.audioCtx || !state.percussionGain || !synthWind || !synthRain) return;

            // Filter Frequency Reacts to Jitter (High Jitter = Open Filter)
            const filterInst = state.percussionGain.peq = state.percussionGain.createBiquadFilter();
            // Wait, we can't wrap gain in peq easily without re-routing.
            // Let's just modulate the wind gain or rain gain.
            
            // Rain Volume = Velocity
            if(synthRain) sintRain.gain.gain.setTargetAtTime(Math.min(avgVel / 5, 1), state.audioCtx.currentTime, 0.1);
            
            // Wind Pitch = Velocity
            if(synthWind && synthWind.node.frequency) {
                 synthWind.node.frequency.setTargetAtTime(50 + (avgVel * 50), state.audioCtx.currentTime, 0.1);
            }
        }
        
        // Fix typo in updateAudio
        Object.assign(updateAudio, {
            func: (v, j) => {
                 if(synthRain) synthRain.gain.gain.setTargetAtTime(Math.min(v / 5, 1), state.audioCtx.currentTime, 0.1);
                 if(synthWind && synthWind.node.frequency) {
                     synthWind.node.frequency.setTargetAtTime(50 + (v * 50), state.audioCtx.currentTime, 0.1);
                 }
            }
        });

        // Start
        init();

    </script>
</body>
</html>
