<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slither Puzzle</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --board-bg: #16213e;
            --snake-color: #0f3460;
            --snake-head: #e94560;
            --ui-text: #eaeaea;
            --accent: #00fff5;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--ui-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 10px 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 255, 245, 0.3);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .stat-box {
            background: var(--board-bg);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #30475e;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        #game-container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 500px;
            max-height: 500px;
            background-color: var(--board-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #30475e;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--snake-head);
        }

        .overlay p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ccc;
        }

        button {
            background: linear-gradient(135deg, var(--snake-head), #c7365f);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        .key {
            display: inline-block;
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            margin: 0 2px;
        }
    </style>
</head>
<body>

    <h1>Neon Snake</h1>

    <div class="stats">
        <div class="stat-box">Score: <span id="score">0</span></div>
        <div class="stat-box">High: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="start-screen" class="overlay active">
            <h2>Ready?</h2>
            <p>Eat the dots to grow.</p>
            <button id="start-btn">Play</button>
        </div>

        <div id="game-over-screen" class="overlay">
            <h2>Game Over</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button id="restart-btn">Try Again</button>
        </div>
    </div>

    <div class="controls-hint">
        Use <span class="key">Arrow Keys</span> or <span class="key">WASD</span> to move.
        <br>Swipe on mobile.
    </div>

<script>
/**
 * Game Logic
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('high-score');
const finalScoreEl = document.getElementById('final-score');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');

// Game Constants
const TILE_COUNT = 20; // 20x20 grid
let TILE_SIZE; // Calculated dynamically based on canvas size

// Game State
let snake = [];
let food = { x: 0, y: 0 };
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let foodEaten = 0;
let score = 0;
let highScore = localStorage.getItem('snakeHighScore') || 0;
let gameRunning = false;
let gameLoopInterval = null;

// Colors
const COLOR_BG = '#16213e';
const COLOR_SNAKE = '#0f3460';
const COLOR_SNAKE_HEAD = '#e94560';
const COLOR_FOOD = '#00fff5';
const COLOR_GRID = 'rgba(255, 255, 255, 0.03)';

// Initialize High Score UI
highScoreEl.textContent = highScore;

// Event Listeners
window.addEventListener('resize', resizeCanvas);
document.addEventListener('keydown', handleKeyInput);
startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

// Touch handling for Swipe
let touchStartX = 0;
let touchStartY = 0;
canvas.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, {passive: false});

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
}, {passive: false});

function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    TILE_SIZE = canvas.width / TILE_COUNT;
    draw(); // Redraw immediately
}

function initGame() {
    resizeCanvas();
    // Reset state
    snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    foodEaten = 0;
    placeFood();
    scoreEl.textContent = score;
    draw();
}

function startGame() {
    initGame();
    gameRunning = true;
    startScreen.classList.remove('active');
    gameOverScreen.classList.remove('active');
    
    // Speed increases slightly as score goes up
    let speed = 150;
    if (score > 5) speed = 130;
    if (score > 10) speed = 100;
    
    clearInterval(gameLoopInterval);
    gameLoopInterval = setInterval(gameStep, speed);
}

function gameStep() {
    if (!gameRunning) return;

    direction = { ...nextDirection };
    
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // Wall Collision
    if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
    }

    // Self Collision
    for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    // Food Collision
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        foodEaten++;
        placeFood();
        // Speed up every 50 points
        if (score % 50 === 0) {
            clearInterval(gameLoopInterval);
            const newSpeed = Math.max(50, 150 - Math.floor(score / 20));
            gameLoopInterval = setInterval(gameStep, newSpeed);
        }
    } else {
        snake.pop();
    }

    draw();
}

function placeFood() {
    let valid = false;
    while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        
        valid = true;
        // Check if food spawned on snake body
        for (let part of snake) {
            if (part.x === food.x && part.y === food.y) {
                valid = false;
                break;
            }
        }
    }
}

function gameOver() {
    gameRunning = false;
    clearInterval(gameLoopInterval);
    
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
        highScoreEl.textContent = highScore;
    }
    
    finalScoreEl.textContent = score;
    gameOverScreen.classList.add('active');
}

function handleKeyInput(e) {
    // Prevent scrolling with arrows
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
        e.preventDefault();
    }

    // Prevent reversing direction directly
    switch(e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
            if (direction.y === 0) nextDirection = { x: 0, y: -1 };
            break;
        case 'ArrowDown':
        case 's':
        case 'S':
            if (direction.y === 0) nextDirection = { x: 0, y: 1 };
            break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
            if (direction.x === 0) nextDirection = { x: -1, y: 0 };
            break;
        case 'ArrowRight':
        case 'd':
        case 'D':
            if (direction.x === 0) nextDirection = { x: 1, y: 0 };
            break;
    }
}

function handleSwipe(startX, startY, endX, endY) {
    const dx = endX - startX;
    const dy = endY - startY;
    
    if (Math.abs(dx) > Math.abs(dy)) {
        // Horizontal
        if (Math.abs(dx) > 30) {
            if (dx > 0 && direction.x === 0) nextDirection = { x: 1, y: 0 }; // Right
            else if (dx < 0 && direction.x === 0) nextDirection = { x: -1, y: 0 }; // Left
        }
    } else {
        // Vertical
        if (Math.abs(dy) > 30) {
            if (dy > 0 && direction.y === 0) nextDirection = { x: 0, y: 1 }; // Down
            else if (dy < 0 && direction.y === 0) nextDirection = { x: 0, y: -1 }; // Up
        }
    }
}

function draw() {
    // Clear background
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Grid (Optional, subtle)
    ctx.strokeStyle = COLOR_GRID;
    ctx.lineWidth = 1;
    for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * TILE_SIZE, 0);
        ctx.lineTo(i * TILE_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * TILE_SIZE);
        ctx.lineTo(canvas.width, i * TILE_SIZE);
        ctx.stroke();
    }

    // Draw Food
    ctx.fillStyle = COLOR_FOOD;
    ctx.shadowColor = COLOR_FOOD;
    ctx.shadowBlur = 15;
    // Draw a circle for food
    ctx.beginPath();
    ctx.arc(
        (food.x * TILE_SIZE) + (TILE_SIZE / 2), 
        (food.y * TILE_SIZE) + (TILE_SIZE / 2), 
        (TILE_SIZE / 2) - 2, 
        0, 
        Math.PI * 2
    );
    ctx.fill();
    ctx.shadowBlur = 0;

    // Draw Snake
    snake.forEach((part, index) => {
        // Head is different color
        if (index === 0) {
            ctx.fillStyle = COLOR_SNAKE_HEAD;
            ctx.shadowColor = COLOR_SNAKE_HEAD;
            ctx.shadowBlur = 10;
        } else {
            ctx.fillStyle = COLOR_SNAKE;
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }
        
        // Rounded rectangles for segments
        const x = part.x * TILE_SIZE;
        const y = part.y * TILE_SIZE;
        const s = TILE_SIZE;
        
        ctx.beginPath();
        ctx.roundRect(x + 1, y + 1, s - 2, s - 2, index === 0 ? 6 : 2); // More rounded head
        ctx.fill();
    });
    
    // Reset shadow for next frame
    ctx.shadowBlur = 0;
}

// Initial Draw
resizeCanvas();

</script>
</body>
</html>
