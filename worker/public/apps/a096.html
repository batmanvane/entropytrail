<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer</title>
    <style>
        :root {
            --bg-color: #0b0d17;
            --card-bg: #15192b;
            --accent: #ffb703;
            --text-main: #e0e1dd;
            --text-secondary: #94a3b8;
            --success: #4cc9f0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: rgba(21, 25, 43, 0.9);
            padding: 1rem 2rem;
            border-bottom: 1px solid #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Main Layout */
        main {
            flex: 1;
            display: flex;
            padding: 1rem;
            gap: 1rem;
            overflow: hidden; /* Prevent full page scroll, scroll inner area */
        }

        /* Sidebar - Navigation */
        aside {
            width: 250px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            border: 1px solid #2d3748;
            overflow-y: auto;
        }

        .nav-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .planet-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .planet-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }

        .planet-btn.active {
            background: rgba(255, 183, 3, 0.1);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.2);
        }

        .planet-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        /* Content Area */
        section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .visual-display {
            height: 150px;
            background: radial-gradient(circle at center, #1e293b 0%, #0b0d17 70%);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #2d3748;
        }

        .planet-model {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5), 0 0 30px rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
            position: relative;
        }

        .planet-rings {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160%;
            height: 160%;
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            border: 4px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        /* Cards Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 1.25rem;
            transition: transform 0.2s;
        }

        .info-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent);
        }

        .info-card h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1rem;
        }

        .info-card p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 0.5rem;
        }

        .info-card small {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #64748b;
        }

        /* Quiz Section (Bottom) */
        .quiz-container {
            margin-top: auto;
            padding-top: 1.5rem;
            border-top: 1px solid #2d3748;
        }

        .quiz-question {
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .quiz-btn {
            background: #2d3748;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .quiz-btn:hover {
            background: #4a5568;
        }

        .quiz-btn.correct {
            background: var(--success);
            color: #000;
        }

        .quiz-btn.wrong {
            background: #ef4444;
        }

        /* Responsive */
        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }
            aside {
                width: 100%;
                height: 150px;
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
            }
            .planet-btn {
                flex-direction: column;
                padding: 10px;
                min-width: 100px;
            }
            .nav-label {
                display: none;
            }
            .quiz-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌌 Solar System</h1>
        <div class="stats">
            Score: <span id="score">0</span>
        </div>
    </header>

    <main>
        <aside id="planet-nav">
            <!-- Nav buttons injected by JS -->
        </aside>

        <section>
            <div class="visual-display" id="visual-display">
                <!-- Planet model injected by JS -->
            </div>

            <div class="info-grid" id="info-grid">
                <!-- Info cards injected by JS -->
            </div>

            <div class="quiz-container">
                <div class="quiz-question" id="quiz-question">Select a planet to begin learning!</div>
                <div class="quiz-options" id="quiz-options">
                    <!-- Quiz buttons injected by JS -->
                </div>
            </div>
        </section>
    </main>

    <script>
        // Data Object
        const solarSystemData = [
            {
                id: 'mercury',
                name: 'Mercury',
                color: '#A5A5A5', // Gray
                rings: false,
                facts: ["The smallest planet in our solar system.", "Gives a rocky terrain somewhat similar to the Moon.", "It has an extremely long year of 88 days."],
                quizQuestion: "What is Mercury known for?",
                quizOptions: ["It has the most moons.", "Its year is only 88 days.", "It is a gas giant.", "It has rings."],
                quizAnswer: 1
            },
            {
                id: 'venus',
                name: 'Venus',
                color: '#E3BB76', // Yellowish
                rings: false,
                facts: ["It shines the brightest in the night sky.", "It has a thick atmosphere made mostly of carbon dioxide.", "It is the hottest planet in the solar system."],
                quizQuestion: "Why is Venus the hottest planet?",
                quizOptions: ["It is closest to the Sun.", "It has no atmosphere.", "It has a thick, toxic atmosphere.", "It rotates very fast."],
                quizAnswer: 2
            },
            {
                id: 'earth',
                name: 'Earth',
                color: '#22A6B3', // Blue
                rings: false,
                facts: ["It is the only planet in our solar system known to have life.", "Three-quarters of Earth's surface is water.", "It has one natural satellite, the Moon."],
                quizQuestion: "Which fact about Earth is true?",
                quizOptions: ["It has no natural satellites.", "It is covered entirely in water.", "It supports life.", "It has no atmosphere."],
                quizAnswer: 2
            },
            {
                id: 'mars',
                name: 'Mars',
                color: '#EB4D4B', // Red
                rings: false,
                facts: ["Also known as the Red Planet due to iron oxide (rust).", "It has the tallest mountain in the solar system, Olympus Mons.", "It has two small moons, Phobos and Deimos."],
                quizQuestion: "Mars is called the Red Planet because of...",
                quizOptions: ["The atmosphere.", "Lack of sunlight.", "Iron oxide on the surface.", "Volcanic activity."],
                quizAnswer: 2
            },
            {
                id: 'jupiter',
                name: 'Jupiter',
                color: '#D6B369', // Orange/Brown
                rings: false,
                facts: ["The largest planet in the solar system.", "It has a Great Red Spot, a storm that has raged for centuries.", "It is a gas giant."],
                quizQuestion: "Jupiter is a what type of planet?",
                quizOptions: ["Gas Giant", "Terrestrial", "Icy Moon", "Dwarf Planet"],
                quizAnswer: 0
            },
            {
                id: 'saturn',
                name: 'Saturn',
                color: '#F4D03F', // Light Yellow
                rings: true,
                facts: ["Adorned with dazzling, complex rings made of ice and rock.", "It is the second-largest planet.", "It has an extremely low density and could float in water if you could find a pool big enough."],
                quizQuestion: "What are Saturn's rings made of?",
                quizOptions: ["Metal sheets", "Ice and rock", "Diamond dust", "Water vapor"],
                quizAnswer: 1
            },
            {
                id: 'uranus',
                name: 'Uranus',
                color: '#7ED6DF', // Cyan
                rings: true,
                facts: ["It spins on its side.", "Its atmosphere is mostly hydrogen and helium.", "It is a gas giant."],
                quizQuestion: "How is Uranus oriented?",
                quizOptions: ["It spins upright.", "It spins on its side.", "It spins backwards.", "It spins vertically."],
                quizAnswer: 1
            },
            {
                id: 'neptune',
                name: 'Neptune',
                color: '#3498DB', // Blue
                rings: true,
                facts: ["It is the most distant and second largest planet.", "It is dark, cold, and whipped by supersonic winds.", "It is actually barely visible to the unaided eye."],
                quizQuestion: "Neptune is the...",
                quizOptions: ["Closest planet.", "Most distant planet.", "Smallest planet.", "Hottest planet."],
                quizAnswer: 1
            }
        ];

        // State
        let currentPlanet = solarSystemData[0];
        let score = 0;
        let currentQuizAnswer = 0;

        // DOM Elements
        const planetNav = document.getElementById('planet-nav');
        const visualDisplay = document.getElementById('visual-display');
        const infoGrid = document.getElementById('info-grid');
        const quizQuestion = document.getElementById('quiz-question');
        const quizOptions = document.getElementById('quiz-options');
        const scoreDisplay = document.getElementById('score');

        // Initialization
        function init() {
            renderNav();
            loadPlanet(currentPlanet.id);
        }

        // Render Navigation
        function renderNav() {
            planetNav.innerHTML = '';
            solarSystemData.forEach(planet => {
                const btn = document.createElement('button');
                btn.className = `planet-btn ${planet.id === currentPlanet.id ? 'active' : ''}`;
                btn.onclick = () => loadPlanet(planet.id);
                
                const icon = document.createElement('div');
                icon.className = 'planet-icon';
                icon.style.backgroundColor = planet.color;
                
                btn.appendChild(icon);
                btn.innerHTML += `<div>${planet.name}</div>`;
                planetNav.appendChild(btn);
            });
        }

        // Load Planet Data
        function loadPlanet(id) {
            currentPlanet = solarSystemData.find(p => p.id === id);
            currentQuizAnswer = currentPlanet.quizAnswer;
            
            // Update UI
            renderNav();
            renderVisual();
            renderInfo();
            renderQuiz();
            
            // Haptic feedback (if supported)
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // Render Visual Model
        function renderVisual() {
            visualDisplay.innerHTML = '';
            
            const model = document.createElement('div');
            model.className = 'planet-model';
            model.style.backgroundColor = currentPlanet.color;

            if (currentPlanet.rings) {
                const rings = document.createElement('div');
                rings.className = 'planet-rings';
                model.appendChild(rings);
            }

            visualDisplay.appendChild(model);
        }

        // Render Info Cards
        function renderInfo() {
            infoGrid.innerHTML = '';
            const facts = currentPlanet.facts;
            const cardCount = Math.min(3, facts.length); // Cap at 3 cards

            for (let i = 0; i < cardCount; i++) {
                const card = document.createElement('div');
                card.className = 'info-card';
                card.innerHTML = `
                    <h3>${i + 1}.${facts[i].split('.')[0]}</h3>
                    <p>${facts[i]}</p>
                `;
                infoGrid.appendChild(card);
            }
        }

        // Render Quiz
        function renderQuiz() {
            quizQuestion.textContent = `Challenge: ${currentPlanet.quizQuestion}`;
            quizOptions.innerHTML = '';

            currentPlanet.quizOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(index, btn);
                quizOptions.appendChild(btn);
            });
        }

        // Check Answer
        function checkAnswer(selectedIndex, btnElement) {
            // Disable all buttons to prevent double clicking
            const allBtns = quizOptions.querySelectorAll('.quiz-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selectedIndex === currentQuizAnswer) {
                btnElement.classList.add('correct');
                score += 10;
                scoreDisplay.textContent = score;
            } else {
                btnElement.classList.add('wrong');
                // Highlight the correct one
                allBtns[currentQuizAnswer].classList.add('correct');
            }
            
            // Reset text after a delay
            setTimeout(() => {
                btnElement.disabled = false;
                if(btnElement.classList.contains('correct') || btnElement.classList.contains('wrong')) {
                    btnElement.textContent = ""; // Clear text to keep UI clean
                }
            }, 1500);
        }

        // Start App
        init();

    </script>
</body>
</html>
