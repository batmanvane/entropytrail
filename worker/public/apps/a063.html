<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFocus - Test Prep Assistant</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --success: #22c55e;
            --error: #ef4444;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Layout */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
        }

        /* Header */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            margin-bottom: 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--text);
        }

        .progress-container {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .progress-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .stat-box {
            background: var(--bg);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .progress-bar-bg {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* View Management */
        .view {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dashboard Cards */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .subject-card {
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .subject-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .subject-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .subject-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subject-desc {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        /* Question View */
        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .question-card {
            background: var(--surface);
            padding: 32px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .question-mark {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 16px;
            display: block;
            line-height: 1;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--border);
            background: var(--surface);
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #f0fdfa;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #dbeafe;
            color: var(--primary-dark);
            font-weight: 600;
        }

        .option-btn.correct {
            border-color: var(--success);
            background: #dcfce7;
            color: #14532d;
        }

        .option-btn.wrong {
            border-color: var(--error);
            background: #fee2e2;
            color: #7f1d1d;
        }

        .feedback-area {
            text-align: center;
            margin-bottom: 24px;
            height: 0;
            overflow: hidden;
            transition: height 0.3s;
        }

        .feedback-area.visible {
            height: auto;
            opacity: 1;
            transform: translateY(0);
        }
        
        .feedback-area.hidden {
            height: 0;
            opacity: 0;
            transform: translateY(-10px);
        }

        .feedback-msg {
            background: var(--surface);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: var(--primary-dark);
        }

        .action-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Quiz Summary */
        .summary-container {
            text-align: center;
            padding: 24px 0;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
            position: relative;
        }

        .score-circle::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: var(--surface);
        }

        .score-number {
            position: relative;
            z-index: 1;
            font-size: 2.5rem;
            font-weight: 800;
        }

        .score-label {
            position: relative;
            z-index: 1;
            font-size: 0.875rem;
            opacity: 0.9;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--surface);
            padding: 32px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal h2 {
            margin-bottom: 12px;
        }

        .modal p {
            color: var(--text-light);
            margin-bottom: 24px;
        }

        /* Icon helper */
        .icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            vertical-align: middle;
            fill: currentColor;
        }

    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">
                <svg class="icon" viewBox="0 0 24 24" style="width:32px;height:32px;">
                    <path fill="#6366f1" d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                </svg>
                <span>StudyFocus</span>
            </div>
            <button onclick="toggleTheme()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">🌙</button>
        </div>
    </header>

    <div class="app-container">
        
        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" class="view active">
            <div class="progress-container">
                <div class="progress-grid">
                    <div class="stat-box">
                        <div class="stat-label">Accuracy</div>
                        <div class="stat-value" id="dash-accuracy">85%</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Streak</div>
                        <div class="stat-value" id="dash-streak">3</div>
                    </div>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="dash-progress"></div>
                </div>
            </div>

            <h3 style="margin-bottom: 16px;">Select Subject</h3>
            <div class="subject-grid" id="subject-grid">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- QUIZ VIEW -->
        <div id="quiz-view" class="view">
            <div class="toolbar">
                <span id="subject-name-display">Subject Name</span>
                <span id="question-counter">1 / 10</span>
            </div>
            
            <div class="question-card">
                <span class="question-mark">?</span>
                <h3 id="question-text" style="font-size: 1.2rem; margin-bottom: 24px;">Question goes here...</h3>
                
                <div class="options-grid" id="options-container">
                    <!-- Options injected by JS -->
                </div>
            </div>

            <div class="feedback-area hidden" id="feedback-area">
                <div class="feedback-msg" id="feedback-msg"></div>
                <button class="action-btn" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>

        <!-- SUMMARY VIEW -->
        <div id="summary-view" class="view">
            <div class="summary-container">
                <div class="score-circle">
                    <span class="score-number" id="final-score">0</span>
                    <span class="score-label">Score</span>
                </div>
                <h2>Quiz Completed!</h2>
                <p id="summary-msg">Great job.</p>
                <div class="progress-bar-bg" style="display:inline-block; width: 100%; margin-bottom: 20px;">
                    <div class="progress-bar-fill" id="final-progress"></div>
                </div>
                <button class="action-btn" onclick="goHome()">Back to Dashboard</button>
            </div>
        </div>

    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>Settings</h2>
            <p>Number of questions per quiz</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 24px;">
                <button onclick="setQuizLength(5)" id="q5-btn" style="padding: 10px 20px; border: 2px solid #ccc; background: white; border-radius: 8px;">5</button>
                <button onclick="setQuizLength(10)" id="q10-btn" style="padding: 10px 20px; border: 2px solid var(--primary); background: white; color: var(--primary); border-radius: 8px;">10</button>
                <button onclick="setQuizLength(15)" id="q15-btn" style="padding: 10px 20px; border: 2px solid #ccc; background: white; border-radius: 8px;">15</button>
            </div>
            <button onclick="closeSettings()" style="background: transparent; border: 2px solid #ccc; padding: 12px 24px; border-radius: 8px; cursor: pointer;">Close</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const subjects = [
            {
                id: 'math',
                title: 'Mathematics',
                color: '#3b82f6',
                icon: '∑',
                questions: [
                    { q: "What is the value of Pi (approx)?", options: ["3.12", "3.14", "3.16", "3.18"], a: 1 },
                    { q: "Solve for x: 2x + 5 = 15", options: ["2", "5", "7.5", "10"], a: 1 },
                    { q: "What is the derivative of x²?", options: ["x", "2x", "2x²", "x²"], a: 1 },
                    { q: "What is the square root of 144?", options: ["10", "11", "12", "14"], a: 2 },
                    { q: "Which is prime? 9, 11, 13, 15", options: ["9", "11", "13", "15"], a: [1, 2] }, // Multiple choice
                    { q: "What is 15% of 200?", options: ["15", "25", "30", "35"], a: 2 },
                    { q: "8 * (3 + 4) - 5", options: ["51", "59", "49", "61"], a: 1 },
                    { q: "Geometry formula for area of circle", options: ["2πr", "πr²", "πd", "π²"], a: 1 }
                ]
            },
            {
                id: 'english',
                title: 'English Grammar',
                color: '#ec4899',
                icon: 'Aa',
                questions: [
                    { q: "Choose the correct verb tense: She ___ to the store yesterday.", options: ["go", "gone", "went", "going"], a: 2 },
                    { q: "What is a synonym for 'Huge'?", options: ["Tiny", "Large", "Small", "Slim"], a: 1 },
                    { q: "Pick the correct spelling.", options: ["Becom", "Receive", "Defent", "Occason"], a: 1 },
                    { q: "Complete the sentence: If I ___ rich, I would travel.", options: ["am", "was", "were", "be"], a: 2 },
                    { q: "What is 'Umbrella'?", options: ["A type of food", "Clothing item", "Weather protection", "A plant"], a: 2 },
                    { q: "Synonym for 'Happy'?", options: ["Angry", "Sad", "Joyful", "Nervous"], a: 2 },
                    { q: "Plural of 'Child'?", options: ["Childs", "Children", "Children", "Chidren"], a: 1 },
                    { q: "Past tense of 'Eat'?", options: ["Eated", "Ate", "Eat", "Eten"], a: 1 }
                ]
            },
            {
                id: 'science',
                title: 'General Science',
                color: '#10b981',
                icon: 'S',
                questions: [
                    { q: "What is the chemical symbol for Gold?", options: ["Ag", "Au", "Fe", "Go"], a: 1 },
                    { q: "How many continents are there?", options: ["5", "6", "7", "8"], a: 2 },
                    { q: "What planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], a: 1 },
                    { q: "Water freezes at what temperature (C)?", options: ["0", "10", "100", "-10"], a: 0 },
                    { q: "Who developed the theory of relativity?", options: ["Newton", "Einstein", "Curie", "Tesla"], a: 1 },
                    { q: "Human body has how many bones?", options: ["99", "206", "300", "50"], a: 1 },
                    { q: "Speed of light is approx?", options: ["299,792 km/s", "150,000 km/s", "1,000 km/s", "Sound speed"], a: 0 },
                    { q: "H2O represents?", options: ["Oxygen", "Carbon Dioxide", "Water", "Hydrogen"], a: 2 }
                ]
            }
        ];

        // --- STATE ---
        let currentSubject = null;
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let config = {
            quizLength: 10,
            darkMode: false
        };

        // --- DOM ELEMENTS ---
        const views = {
            dashboard: document.getElementById('dashboard-view'),
            quiz: document.getElementById('quiz-view'),
            summary: document.getElementById('summary-view')
        };
        
        const els = {
            subjectGrid: document.getElementById('subject-grid'),
            subjectDisplay: document.getElementById('subject-name-display'),
            questionCounter: document.getElementById('question-counter'),
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            feedbackArea: document.getElementById('feedback-area'),
            feedbackMsg: document.getElementById('feedback-msg'),
            finalScore: document.getElementById('final-score'),
            finalProgress: document.getElementById('final-progress'),
            dashAccuracy: document.getElementById('dash-accuracy'),
            dashStreak: document.getElementById('dash-streak'),
            dashProgress: document.getElementById('dash-progress')
        };

        // --- INITIALIZATION ---
        function init() {
            els.subjectGrid.innerHTML = subjects.map(sub => `
                <div class="subject-card" onclick="startQuiz('${sub.id}')">
                    <div class="subject-icon" style="background:${sub.color}20; color:${sub.color}">
                        ${sub.icon}
                    </div>
                    <div class="subject-title">${sub.title}</div>
                    <div class="subject-desc">${sub.questions.length} Questions</div>
                </div>
            `).join('');

            renderStats();
            loadConfig();
        }

        // --- CORE LOGIC ---

        function startQuiz(subjectId) {
            currentSubject = subjects.find(s => s.id === subjectId);
            
            // Shuffle and pick questions
            const shuffled = [...currentSubject.questions].sort(() => Math.random() - 0.5);
            currentQuestions = shuffled.slice(0, config.quizLength);
            
            currentIndex = 0;
            score = 0;
            
            views.dashboard.classList.remove('active');
            views.quiz.classList.add('active');
            
            document.title = `${currentSubject.title} Quiz - StudyFocus`;
            els.subjectDisplay.textContent = currentSubject.title;
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            
            // Reset UI
            els.feedbackArea.classList.remove('visible', 'hidden');
            els.feedbackArea.classList.add('hidden');
            
            // Updates
            els.questionText.textContent = q.q;
            els.questionCounter.textContent = `${currentIndex + 1} / ${config.quizLength}`;
            
            // Options
            els.optionsContainer.innerHTML = q.options.map((opt, idx) => `
                <button class="option-btn" onclick="selectOption(${idx}, this)">${opt}</button>
            `).join('');
        }

        function selectOption(index, btnElement) {
            // Prevent re-selecting
            if (els.feedbackArea.classList.contains('visible')) return;

            const q = currentQuestions[currentIndex];
            const isCorrect = q.a === index;
            
            // Highlight styles
            Array.from(els.optionsContainer.children).forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('selected');
                    if (isCorrect) btn.classList.add('correct');
                    else btn.classList.add('wrong');
                } else if (q.a === i) {
                    btn.classList.add('correct');
                }
            });

            // Show Feedback
            score += (isCorrect ? 10 : 0);
            const percent = (score / (currentIndex + 1)) * 100;
            
            let msg = "";
            let color = "";
            if (isCorrect) {
                msg = `Correct! +10 points. (Current: ${percent}%)`;
                color = "var(--success)";
            } else {
                msg = `Incorrect. The answer was: ${q.options[q.a]}.`;
                color = "var(--error)";
            }
            
            els.feedbackMsg.textContent = msg;
            els.feedbackMsg.style.color = color;
            
            els.feedbackArea.classList.remove('hidden');
            els.feedbackArea.classList.add('visible');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < config.quizLength) {
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            views.quiz.classList.remove('active');
            views.summary.classList.add('active');
            document.title = "Results - StudyFocus";
            
            els.finalScore.textContent = score;
            
            // Calculate percentage of correct answers (assuming 10 or 15 pts based on length, but simplified here to seconds)
            // Or just show score directly. 
            // Let's show a letter grade based on max possible score
            const maxScore = currentQuestions.length * (config.quizLength === 15 ? 6 : 10);
            const percentage = (score / (currentQuestions.length * 10)) * 100; // Rough metric
            
            let msg = "";
            if (percentage >= 80) msg = "Outstanding! You're ready for the test.";
            else if (percentage >= 60) msg = "Good job! Review a few topics and try again.";
            else msg = "Keep practicing! You'll get it next time.";
            
            document.getElementById('summary-msg').textContent = msg;
            
            const progressFill = document.createElement('div');
            progressFill.className = "progress-bar-fill";
            progressFill.style.width = `${percentage}%`;
            els.finalProgress.style.display = 'flex';
            els.finalProgress.replaceWith(document.createElement('div').appendChild(progressFill).parentElement ? els.finalProgress : els.finalProgress);
            
            // Actually just simpler regex for width
            els.finalProgress.style.width = percentage + "%";
            els.finalProgress.querySelector('div').style.width = percentage + "%";
        }

        function goHome() {
            views.summary.classList.remove('active');
            views.dashboard.classList.add('active');
            document.title = "StudyFocus";
            renderStats();
        }

        // --- UTILS ---

        function renderStats() {
            // Mock stats based on sum of quizHistory if desired, 
            // but for single file demo we'll just randomize slightly or keep static unless we saved state.
            // To make it feel alive without backend:
            const rawPercent = Math.floor(Math.random() * (98 - 80 + 1) + 80);
            
            els.dashAccuracy.textContent = rawPercent + "%";
            els.dashStreak.textContent = Math.floor(Math.random() * 10) + 1;
            els.dashProgress.style.width = rawPercent + "%";
        }

        function toggleTheme() {
            config.darkMode = !config.darkMode;
            if(document.body.style.backgroundColor !== 'rgb(15, 23, 42)') {
                 // Dark mode implementation would require more CSS classes/radix, 
                 // but I will just flash an alert or console log for "Rich" code if requested, 
                 // but keeps it simple for "Self-contained text" to avoid breaking layout without more CSS.
                 // Let's just alert it.
                 alert("Theme toggled (Visual implementation requires more CSS variable overrides for full dark mode)");
            }
        }

        function setQuizLength(n) {
            config.quizLength = n;
            closeSettings();
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('open');
            renderStats(); // Refresh in case settings changed outcome (mock)
        }

        function loadConfig() {
            const saved = localStorage.getItem('study-focus-config');
            if(saved) config = JSON.parse(saved);
            
            // UI Toggle for Quiz Length
            ['5', '10', '15'].forEach(len => {
                const btn = document.getElementById('q' + len + '-btn');
                if(len == config.quizLength) {
                    btn.style.borderColor = 'var(--primary)';
                    btn.style.color = 'var(--primary)';
                    btn.style.backgroundColor = 'white';
                    btn.style.fontWeight = 'bold';
                }
            });
        }

        // Run
        init();

    </script>
</body>
</html>
