<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: 'Courier New', Courier, monospaced;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin: 10px 0; }
        #game-container {
            position: relative;
            border: 4px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background-color: #000;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            pointer-events: none; /* Let clicks pass through if needed, though we use buttons */
        }
        .hidden { display: none !important; }
        #score-board {
            font-size: 20px;
            margin-bottom: 10px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-family: inherit;
            pointer-events: auto;
        }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div id="score-board">Score: <span id="score">0</span></div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="ui-layer">
            <h2 id="game-message" style="font-size: 32px; margin-bottom: 20px;">Press Start</h2>
            <button id="restart-btn">Start Game</button>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const CANVAS_SIZE = 400;
        const TILE_SIZE = 20;
        const GRID_SIZE = CANVAS_SIZE / TILE_SIZE; // 20x20
        const BASE_SPEED = 150; // ms per frame (lower is faster)
        const SPEED_DECREMENT = 10; // how much faster per level
        const INITIAL_SPEED = BASE_SPEED;

        // --- State ---
        let canvas, ctx;
        let gameLoopId;
        let isGameRunning = false;
        
        let snake = [];
        let food = { x: 0, y: 0 };
        let velocity = { x: 0, y: 0 };
        let score = 0;
        let speed = INITIAL_SPEED;
        let foodCounter = 0; // Count to trigger speedup

        // DOM Elements
        const scoreEl = document.getElementById('score');
        const uiLayer = document.getElementById('ui-layer');
        const messageEl = document.getElementById('game-message');
        const restartBtn = document.getElementById('restart-btn');

        // --- Initialization ---
        window.onload = () => {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            document.addEventListener('keydown', handleInput);
            restartBtn.addEventListener('click', startGame);
        };

        function resetGame() {
            // Initial Snake Position (Center)
            const startCol = Math.floor(GRID_SIZE / 2);
            const startRow = Math.floor(GRID_SIZE / 2);
            
            // Create a snake of length 3
            snake = [
                { x: startCol, y: startRow },
                { x: startCol, y: startRow + 1 },
                { x: startCol, y: startRow + 2 }
            ];

            velocity = { x: 0, y: -1 }; // Start moving up
            
            score = 0;
            speed = INITIAL_SPEED;
            foodCounter = 0;
            scoreEl.innerText = score;

            placeFood();
        }

        function startGame() {
            resetGame();
            isGameRunning = true;
            uiLayer.classList.add('hidden');
            
            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(gameLoop, speed);
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoopId);
            messageEl.innerText = "Game Over!";
            restartBtn.innerText = "Restart";
            uiLayer.classList.remove('hidden');
        }

        // --- Game Logic ---
        function gameLoop() {
            if (!isGameRunning) return;

            update();
            draw();
        }

        function update() {
            // Calculate new head position
            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // 1. Check Wall Collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // 2. Check Self Collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // Move Snake (Add new head)
            snake.unshift(head);

            // 3. Check Food Collision
            if (head.x === food.x && head.y === food.y) {
                // Ate food
                score++;
                scoreEl.innerText = score;
                foodCounter++;

                // Speed up every 5 pieces
                if (foodCounter > 0 && foodCounter % 5 === 0) {
                    speed = Math.max(50, speed - SPEED_DECREMENT); // Cap max speed at 50ms
                    clearInterval(gameLoopId);
                    gameLoopId = setInterval(gameLoop, speed);
                }

                placeFood();
            } else {
                // Didn't eat, remove tail to maintain length
                snake.pop();
            }
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw Food
            ctx.fillStyle = '#ff3333'; // Red food
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff3333";
            ctx.fillRect(food.x * TILE_SIZE, food.y * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);
            ctx.shadowBlur = 0; // Reset shadow

            // Draw Snake
            ctx.fillStyle = '#4CAF50'; // Green snake
            snake.forEach((segment, index) => {
                // Make head a slightly different color
                if (index === 0) ctx.fillStyle = '#81C784';
                else ctx.fillStyle = '#4CAF50';

                ctx.fillRect(segment.x * TILE_SIZE, segment.y * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);
            });
        }

        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                const x = Math.floor(Math.random() * GRID_SIZE);
                const y = Math.floor(Math.random() * GRID_SIZE);
                
                // Check if food spawned on snake body
                let onSnake = false;
                for (let segment of snake) {
                    if (segment.x === x && segment.y === y) {
                        onSnake = true;
                        break;
                    }
                }
                
                if (!onSnake) {
                    food = { x, y };
                    validPosition = true;
                }
            }
        }

        // --- Input Handling ---
        function handleInput(e) {
            if (!isGameRunning) return;

            // Prevent default scrolling for arrow keys
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            switch (e.key) {
                case 'ArrowUp':
                    if (velocity.y === 1) break; // Can't go down if moving up
                    velocity = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (velocity.y === -1) break; // Can't go up if moving down
                    velocity = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (velocity.x === 1) break; // Can't go right if moving left
                    velocity = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (velocity.x === -1) break; // Can't go left if moving right
                    velocity = { x: 1, y: 0 };
                    break;
            }
        }
    </script>
</body>
</html>
