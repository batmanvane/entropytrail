<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Table Trainer</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --error: #e74c3c;
            --background: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 1.5rem;
            color: var(--primary);
            font-size: 1.8rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            background-color: #f0f2f5;
            border-radius: 8px;
            font-weight: bold;
        }

        .stat-item span {
            font-size: 1.2rem;
            color: #555;
        }

        .timer-box span {
            color: var(--primary);
        }

        .score-box span {
            color: var(--success);
        }

        .question {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            color: #2c3e50;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            outline: none;
            transition: border-color 0.3s;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .message {
            height: 1.5rem;
            margin-top: 1rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .message.show {
            opacity: 1;
        }

        .message.correct { color: var(--success); }
        .message.wrong { color: var(--error); }

        .hidden {
            display: none;
        }

        .start-screen, .game-over-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .hidden-screen {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Start Screen -->
        <div id="start-screen" class="start-screen">
            <h1>Times Table Trainer</h1>
            <p style="margin-bottom: 2rem; color: #666;">Test your speed with the 1-10 multiplication tables!</p>
            <button class="btn" onclick="startGame()">Start Game</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden-screen">
            <div class="stats-bar">
                <div class="timer-box">Time: <span id="timer">60</span>s</div>
                <div class="score-box">Score: <span id="score">0</span></div>
            </div>

            <div class="question" id="question-text">
                <!-- Example: 5 x 7 -->
            </div>

            <input type="number" id="answer-input" placeholder="?" autocomplete="off">
            
            <button class="btn" id="submit-btn" onclick="checkAnswer()">Submit</button>
            <button class="btn" id="next-btn" onclick="generateQuestion()" style="margin-top: 10px; display: none; background-color: var(--success);">Next &rarr;</button>

            <div id="feedback-message" class="message"></div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden-screen">
            <h1>Time's Up!</h1>
            <p>Your final score:</p>
            <h2 style="font-size: 3rem; color: var(--primary); margin-bottom: 1rem;" id="final-score">0</h2>
            <p id="encouragement" style="margin-bottom: 1rem;">Great job!</p>
            <button class="btn" onclick="resetGame()">Play Again</button>
        </div>

    </div>

    <script>
        // Game State
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let currentQuestion = {};
        let isPaused = false;

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const questionEl = document.getElementById('question-text');
        const inputEl = document.getElementById('answer-input');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback-message');
        const encouragementEl = document.getElementById('encouragement');

        // Event Listener for Enter key
        inputEl.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                if (!isPaused) {
                    checkAnswer();
                }
            }
        });

        function startGame() {
            score = 0;
            timeLeft = 60;
            isPaused = false;
            updateStats();
            
            startScreen.classList.add('hidden-screen');
            gameOverScreen.classList.add('hidden-screen');
            gameScreen.classList.remove('hidden-screen');

            generateQuestion();

            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(updateTimer, 1000);
        }

        function resetGame() {
            clearInterval(timerInterval); // Ensure timer stops
            // Reset to start screen
            gameOverScreen.classList.remove('hidden-screen'); // Just in case
            startScreen.classList.remove('hidden-screen');
            
            // Clear any focus
            inputEl.value = '';
        }

        function updateTimer() {
            timeLeft--;
            timerEl.textContent = timeLeft;

            // Visual cue for low time
            if (timeLeft <= 10) {
                timerEl.parentElement.style.color = 'var(--error)';
            } else {
                timerEl.parentElement.style.color = 'var(--primary)';
            }

            if (timeLeft <= 0) {
                endGame();
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            isPaused = true;
            
            finalScoreEl.textContent = score;
            
            // Encouragement based on score
            if (score === 0) encouragementEl.textContent = "Keep practicing!";
            else if (score < 10) encouragementEl.textContent = "Nice start!";
            else if (score < 20) encouragementEl.textContent = "Good job!";
            else encouragementEl.textContent = "Excellent speed!";

            gameScreen.classList.add('hidden-screen');
            gameOverScreen.classList.remove('hidden-screen');
        }

        function generateQuestion() {
            if (timeLeft <= 0) return; // Safety check if timer stopped
            
            // Random numbers 1 to 10
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            const answer = num1 * num2;

            currentQuestion = { answer };

            // Display question
            questionEl.textContent = `${num1} &times; ${num2}`;

            // Reset UI
            inputEl.value = '';
            inputEl.focus();
            inputEl.disabled = false;
            submitBtn.style.display = 'block';
            nextBtn.style.display = 'none';
            feedbackEl.className = 'message';
            feedbackEl.textContent = '';
        }

        function checkAnswer() {
            const userVal = parseInt(inputEl.value);

            if (isNaN(userVal)) {
                return; // Do nothing if empty
            }

            if (userVal === currentQuestion.answer) {
                // Correct
                score++;
                feedbackEl.textContent = "Correct!";
                feedbackEl.classList.add('show', 'correct');
            } else {
                // Incorrect
                feedbackEl.textContent = `Wrong! It was ${currentQuestion.answer}`;
                feedbackEl.classList.add('show', 'wrong');
            }

            updateStats();
            
            // Prevent further input until next button is clicked
            inputEl.disabled = true;
            submitBtn.style.display = 'none';
            nextBtn.style.display = 'block';
        }

        function updateStats() {
            if (scoreEl) scoreEl.textContent = score;
        }
    </script>
</body>
</html>
