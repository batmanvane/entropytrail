<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith: A Deconstructionist Canvas</title>
    <style>
        :root {
            --bg-color: #0a0a0b;
            --panel-bg: rgba(20, 20, 23, 0.7);
            --accent: #00f3ff;
            --text-main: #e0e0e0;
            --text-dim: #888;
            --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        /* Canvas Overlay (The Grid) */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
            width: 100%;
            height: 100%;
            opacity: 0.3;
            background-image: 
                linear-gradient(to right, var(--accent) 1px, transparent 1px),
                linear-gradient(to bottom, var(--accent) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        /* UI Controls */
        .ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .control-group {
            pointer-events: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin: 20px;
            transition: opacity 0.3s ease;
        }

        .controls-top-left {
            top: 20px;
            left: 20px;
        }

        .controls-bottom-right {
            bottom: 20px;
            right: 20px;
        }

        h1 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin: 0 0 15px 0;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        label {
            display: block;
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin-bottom: 12px;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: -5px;
            box-shadow: 0 0 10px var(--accent);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        select {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main);
            padding: 5px;
            font-family: var(--font-ui);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--accent);
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        button:hover {
            background: var(--accent);
            color: black;
            box-shadow: 0 0 15px var(--accent);
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        .instruction {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 10px;
            color: var(--text-dim);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    
    <div class="grid-overlay"></div>

    <div class="ui-layer">
        <!-- Top Left Controls -->
        <div class="control-group controls-top-left">
            <h1>Zenith.</h1>
            
            <label for="brushColor">Palette</label>
            <select id="brushColor">
                <option value="#00f3ff">Cyber Blue</option>
                <option value="#7b2cbf">Deep Purple</option>
                <option value="#ff0055">Neon Red</option>
                <option value="#00ff99">Matrix Green</option>
                <option value="#ffffff">Pure White</option>
                <option value="#ffaa00">Sunset Orange</option>
                <option value="rainbow">Rainbow</option>
            </select>

            <label for="strokeWidth">Flow: <span id="val-width">2</span></label>
            <input type="range" id="strokeWidth" min="0.5" max="10" step="0.5" value="2">
        </div>

        <!-- Bottom Right Controls -->
        <div class="control-group controls-bottom-right">
            <label for="brushStyle">Physics</label>
            <select id="brushStyle">
                <option value="technical">Technique (Straight)</option>
                <option value="perlin" selected>Perlin Flow</option>
                <option value="noise">Organic Cloud</option>
                <option value="glitch">Glitch Effect</option>
            </select>

            <label for="fractalDepth">Layers: <span id="val-circles">3</span></label>
            <input type="range" id="fractalDepth" min="1" max="12" value="4">
            
            <label for="paperType">Texture</label>
            <select id="paperType">
                <option value="clean">Void</option>
                <option value="paper">Blueprint Paper</option>
                <option value="dust">Dust Particles</option>
            </select>
        </div>

        <div class="control-group controls-top-left" style="left: 50%; transform: translateX(-50%); border-color: rgba(255,255,255,0.2);">
            <button id="clearBtn">Reset Canvas</button>
            <button id="saveBtn">Save Snapshot</button>
        </div>

        <div class="instruction">
            Left Click: Draw | Right Click / Shift: Eraser | Double Click: Zoom In
        </div>
    </div>

<script>
/**
 * ZENITH CANVAS ENGINE
 * Features:
 * - Abstract Line Art / Circuit Visualization

 * - Zoom navigation logic

 */

// --- Utility: Simple Perlin Noise Implementation ---
class Perlin {
    constructor() {
        this.p = new Uint8Array(512);
        const p = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
        for (let i = 0; i < 255; i++) this.p[255 + i] = this.p[i] = p[i];
    }

    fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    lerp(t, a, b) { return a + t * (b - a); }
    grad(hash, x, y, z) {
        const h = hash & 15;
        const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
    }

    noise(x, y, z) {
        const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
        x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
        const u = this.fade(x), v = this.fade(y), w = this.fade(z);
        const A = this.p[X] + Y, AA = this.p[A] + Z, AB = this.p[A + 1] + Z,
              B = this.p[X + 1] + Y, BA = this.p[B] + Z, BB = this.p[B + 1] + Z;
        return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z),
                this.grad(this.p[BA], x - 1, y, z)),
                this.lerp(u, this.grad(this.p[AB], x, y - 1, z),
                this.grad(this.p[BB], x - 1, y - 1, z))),
                this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1),
                this.grad(this.p[BA + 1], x - 1, y, z - 1)),
                this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1),
                this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));
    }
}

// --- Vector Math Class ---
class Vec2 {
    constructor(x, y) { this.x = x; this.y = y; }
    add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
    mult(n) { return new Vec2(this.x * n, this.y * n); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() {
        const m = this.mag();
        return m === 0 ? new Vec2(0,0) : new Vec2(this.x / m, this.y / m);
    }
    dist(v) { return Math.sqrt((this.x - v.x)**2 + (this.y - v.y)**2); }
}

// --- Main Canvas Logic ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;

// State
const state = {
    isDragging: false,
    isErasing: false,
    lastX: 0,
    lastY: 0,
    zoom: 1,
    history: [],
    currentPath: [],
    noise: new Perlin(),
    paperType: 'clean'
};

// Configuration UI
const ui = {
    color: document.getElementById('brushColor'),
    width: document.getElementById('strokeWidth'),
    widthDisplay: document.getElementById('val-width'),
    style: document.getElementById('brushStyle'),
    depth: document.getElementById('fractalDepth'),
    depthDisplay: document.getElementById('val-circles'),
    paper: document.getElementById('paperType')
};

// Resize Handler

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);

function tealToHSL(x, y) {
    const px = width * x;
    const py = height * y;
    const value = state.noise.noise(px * 0.003, py * 0.003, Date.now() * 0.0001);
    return {
        h: (value + 0.5) * 360,
        s: 0.8,
        l: 0.5
    };
}

function verifyCollision(tet, poly1, poly2) {
    // Simple check: do the edges cross?
    // In a proper implementation, use Segment-Segment intersection
    // For speed/complexity balance in this demo:
    // We check if the segment touches the polygon by iterating edges
    // and checking against triangles (simplified for this demo context)
    
    // Actually, for the "Technique" style, strict topology isn't visual
    // but for the "Perlin/Organic" styles, we just draw.
    // Let's stick to simple visual overlap for the style logic.
    
    const segmentA = tet.p1;
    const segmentB = tet.p2;
    const n = poly1.poly; // vertices of the polygon

    // A quick "Is inside polygon" check isn't easy here without lots of lines.
    // Instead, we just add the segments. For the "Circuit" effect, we just trace lines.
    // Let's implement basic intersection for strictness.

    const AB = segmentB.sub(segmentA);
    const C1 = poly1.poly[0];
    
    // Check if any line segment from the loop crosses the new line
    for (let i = 0; i < poly1.poly.length; i++) {
        const C2 = poly1.poly[(i + 1) % poly1.poly.length];
        const CB = C2.sub(C1);
        const DA = tet.p2.sub(tet.p1);

        const u = (CB.x * (tet.p1.y - C1.y) - CB.y * (tet.p1.x - C1.x)) / (CB.x * DA.y - CB.y * DA.x);
        const v = (tet.p1.x - C1.x) * (DA.x * (tet.p1.y - C1.y) + DA.y * (tet.p1.x - C1.x)) / (CB.x * DA.y - CB.y * DA.x);

        if (u >= 0 && u <= 1 && v >= 0 && v <= 1) return true; // Collision
    }
    return false;
}

function drawLoop() {
    ctx.clearRect(0, 0, width, height);
    
    // Draw existing lines
    for (let i = 0; i < state.history.length; i++) {
        const p = state.history[i];
        if (p.lines) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            
            // "Technique" style draws straight lines
            if (ui.style.value === 'technical') {
                for (let j = 0; j < p.lines.length; j++) {
                    const toX = newX(state.history[i].lines[j].x);
                    const toY = newY(state.history[i].lines[j].y);
                    ctx.lineTo(toX, toY);
                }
            } else {
                // Flow style
                p.lines.forEach(pt => {
                    ctx.lineTo(pt.x, pt.y);
                });
            }
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Dynamic Coloring
            if (ui.color.value === 'rainbow') {
                const hue = (Date.now() / 10) % 360;
                ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
            } else {
                ctx.strokeStyle = ui.color.value;
            }
            
            ctx.lineWidth = Number(ui.width.value);
            ctx.stroke();
        }
    }

    // Draw current path
    if (state.currentPath.length > 1) {
        ctx.beginPath();
        ctx.moveTo(state.currentPath[0].x, state.currentPath[0].y);
        ctx.lineTo(state.currentPath[1].x * newX(state.currentPath[1].x), newY(state.currentPath[1].y)); // Init
        
        // Apply Style Physics
        if (ui.style.value === 'technique') {
             // In technique mode, we don't store a complex path array, we store target points
             // Real logic handled in draw, simplified here
        } else if (ui.style.value === 'perlin') {
            // Ease the line to the next perlin-defined point
             let controlPoint = null;
             
        } else if (ui.style.value === 'organic') {
            // Random jitter loop
        } else if (ui.style.value === 'glitch') {
             // Snap every 3rd segment
        }
    }

    // Draw Texture
    if (ui.paper.value === 'dust') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
        // Skip redundant texture calls to save performance
    }
}

// --- Interaction Handlers ---

function newPoint(e) {
    const x = normalize(e.clientX);
    const y = normalize(e.clientY);
    
    state.history.push({
        lines: [
            {x: newX(x), y: newY(y)} // Initial point in local space
        ]
    });
    
    state.currentPath = [{x: x, y: y}];
}

function updatePoint(e) {
    const a = normalize(e.clientX);
    const b = normalize(e.clientY);
    
    // Only draw if significant movement
    const d = dist({x: a, y: b}, {x: state.lastX, y: state.lastY});
    if (d > 0.001) {
        state.currentPath.push({x: a, y: b});
        drawLoop();
        state.lastX = a;
        state.lastY = b;
    }
}

function doChoose(l) {
    const c = normalize(l.clientX);
    const nextPath = state.currentPath().lines;
    
    // In technique mode, we actually snap to a new point
    if (ui.style.value === 'technique') {
        // Snap to nice angle or just add point
        // Simplified: just add point
    }
    
    // Normal flow
    state.history.push({
        lines: [...state.currentPath]
    });
    state.currentPath = [];
}

function draw(x, y, style) {
    ctx.beginPath();
    ctx.moveTo(newX(x), newY(y));

    if (style === 'technical') {
        ctx.lineTo(newX(x), newY(y));
        ctx.stroke();
    } else {
        // Simple sampling for organic
        state.noise.noise(x * 0.01, y * 0.01, Date.now());
        ctx.arc(newX(x), newY(y), Number(ui.width.value)/2, 0, Math.PI * 2);
        ctx.fill();
    }
}

// --- Event Listeners ---
canvas.addEventListener('mousedown', (e) => {
    state.isDragging = true;
    state.isErasing = e.button === 2 || e.shiftKey;
    newPoint(e);
    state.lastX = e.clientX;
    state.lastY = e.clientY;
});

canvas.addEventListener('mousemove', (e) => {
    if (!state.isDragging) return;
    updatePoint(e);
});

canvas.addEventListener('mouseup', () => {
    state.isDragging = false;
    doChoose();
});
canvas.addEventListener('mouseleave', () => {
    state.isDragging = false;
    doChoose();
});

// Prevention for right click menu
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// UI Bindings
ui.color.addEventListener('change', (e) => {
    if (e.target.value === 'rainbow') return;
    drawLoop();
});
ui.style.addEventListener('change', () => {
    state.currentPath = [];
    drawLoop();
});
ui.width.addEventListener('input', () => {
    ui.widthDisplay.textContent = ui.width.value;
    drawLoop();
});
ui.depth.addEventListener('input', () => {
    ui.depthDisplay.textContent = ui.depth.value;
    drawLoop();
});
ui.paper.addEventListener('change', (e) => {
    state.paperType = e.target.value;
    drawLoop();
});
document.getElementById('clearBtn').addEventListener('click', () => {
    state.history = [];
    drawLoop();
});
document.getElementById('saveBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'zenith-art.png';
    link.href = canvas.toDataURL();
    link.click();
});

// Zoom (Double Click)
canvas.ondblclick = (e) => {
    const scale = 1.1;
    if (e.type === 'click') {
        zoom -= zoom * (scale - 1);
    }
    drawLoop();
}

// Init
newPoint({clientX: 0, clientY: 0}); // Placeholder to init context

</script>
