<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Tile Puzzle</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --text-color: #e94560;
            --accent-color: #0f3460;
            --tile-bg: #16213e;
            --tile-text: #ffffff;
            --tile-hover: #e94560;
            --tile-enabled: rgba(255, 255, 255, 0.05);
            --gap: 10px;
            --border: 2px solid rgba(255,255,255,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0f1a 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 90%;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--text-color);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: #adb5bd;
        }

        .stats span {
            color: #fff;
            font-weight: bold;
        }

        .game-info {
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #aaa;
            height: 20px;
        }

        .grid {
            position: relative;
            width: 320px;
            height: 320px;
            background-color: rgba(0, 0, 0, 0.3);
            margin: 0 auto;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            width: 72px;
            height: 72px;
            background-color: var(--tile-bg);
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--tile-text);
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto; /* Enable clicking on tiles */
        }

        .tile:hover {
            background-color: var(--tile-hover);
            z-index: 10;
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--tile-hover);
        }

        /* The empty space/void placeholder */
        .tile[aria-label="Empty"] {
            background: transparent;
            border: none;
            box-shadow: none;
            cursor: default;
            pointer-events: none;
            transform: none !important;
            z-index: 0;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: 1px solid var(--text-color);
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:hover {
            background: var(--text-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Message overlay for win condition */
        .message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .message-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .message-content {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid var(--text-color);
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .message-title {
            font-size: 2rem;
            color: #4cd137;
            margin-bottom: 15px;
        }

        .message-sub {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #fff;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .difficulty-select {
            margin-top: 10px;
            justify-content: center;
        }
        
        select {
            background: var(--accent-color);
            color: white;
            border: 1px solid var(--text-color);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sliding Puzzle</h1>
        
        <div class="stats">
            <div>Moves: <span id="move-count">0</span></div>
            <div>Time: <span id="timer">00:00</span></div>
        </div>

        <div class="game-info" id="difficulty-display">Difficulty: 4x4</div>

        <div class="grid" id="grid-container">
            <!-- Tiles generated by JS -->
        </div>

        <div class="controls">
            <button id="btn-shuffle">Shuffle</button>
            <div class="difficulty-select">
                <select id="diff-select">
                    <option value="3">3x3</option>
                    <option value="4" selected>4x4</option>
                    <option value="5">5x5</option>
                    <option value="6">6x6</option>
                    <option value="15">15x15</option>
                </select>
            </div>
            <button id="btn-reset">New Game</button>
        </div>
    </div>

    <div class="message-overlay" id="win-overlay">
        <div class="message-content">
            <div class="message-title">You Won!</div>
            <div class="message-sub" id="win-stats">
                Moves: 0 | Time: 00:00
            </div>
            <button id="btn-play-again">Play Again</button>
        </div>
    </div>

    <script>
        class PuzzleGame {
            constructor() {
                this.gridSize = 4; // Default 4x4
                this.tiles = []; // Array of tile objects
                this.emptyIndex = 0; // Current index of the empty slot (size^2 - 1)
                this.moves = 0;
                this.timerDuration = 0;
                this.timerInterval = null;
                this.isShuffling = false;
                
                // DOM Elements
                this.gridEl = document.getElementById('grid-container');
                this.movesEl = document.getElementById('move-count');
                this.timerEl = document.getElementById('timer');
                this.winOverlay = document.getElementById('win-overlay');
                this.winStatsEl = document.getElementById('win-stats');
                this.diffSelect = document.getElementById('diff-select');
                this.diffDisplay = document.getElementById('difficulty-display');

                // Bind events
                document.getElementById('btn-shuffle').addEventListener('click', () => this.shuffle());
                document.getElementById('btn-reset').addEventListener('click', () => this.startNewGame());
                document.getElementById('btn-play-again').addEventListener('click', () => this.initGame());
                this.diffSelect.addEventListener('change', (e) => {
                    this.gridSize = parseInt(e.target.value);
                    this.initGame();
                });

                this.initGame();
            }

            // Initialize the game grid based on difficulty
            initGame() {
                this.stopTimer();
                this.createGridStructure();
                this.resetState();
                this.setupData();
                this.render();
                this.startTimer();
                this.winOverlay.classList.remove('visible');
            }

            createGridStructure() {
                this.gridEl.innerHTML = '';
                this.tileElements = [];
                this.gridEl.style.width = `${this.gridSize * 64 + (this.gridSize - 1) * 10}px`; // 64px tile + 10px gap
                this.gridEl.style.height = this.gridEl.style.width;
            }

            resetState() {
                this.moves = 0;
                this.updateStats();
            }

            setupData() {
                const totalTiles = this.gridSize * this.gridSize;
                this.tiles = [];
                
                for (let i = 0; i < totalTiles - 1; i++) {
                    this.tiles.push({
                        value: i + 1,
                        x: null,
                        y: null
                    });
                }
                // The last tile is the empty one (represented as 0)
                this.tiles.push({ value: 0, x: null, y: null });
                
                this.moves = 0;
            }

            // Destructive shuffle method that ensures a solvable state.
            // We simulate random valid moves.
            shuffle() {
                this.isShuffling = true;
                const totalTiles = this.gridSize * this.gridSize;
                const shuffleMoves = 100; // Number of random moves to make
                
                let currentEmptyX = this.emptyX;
                let currentEmptyY = this.emptyY;

                for (let i = 0; i < shuffleMoves; i++) {
                    const neighbors = this.getNeighbors(currentEmptyX, currentEmptyY);
                    const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];

                    // Swap logic
                    let tileIndex = 0;
                    if (randomNeighbor.x > currentEmptyX) tileIndex = randomNeighbor.x * this.gridSize + randomNeighbor.y; // Right
                    else if (randomNeighbor.x < currentEmptyX) tileIndex = randomNeighbor.x * this.gridSize + randomNeighbor.y; // Left
                    else if (randomNeighbor.y > currentEmptyY) tileIndex = randomNeighbor.x * this.gridSize + randomNeighbor.y; // Down
                    else if (randomNeighbor.y < currentEmptyY) tileIndex = randomNeighbor.x * this.gridSize + randomNeighbor.y; // Up

                    const tile = this.tiles[tileIndex];
                    
                    // Update tile coords
                    tile.x = currentEmptyX;
                    tile.y = currentEmptyY;

                    // Update empty coords
                    currentEmptyX = randomNeighbor.x;
                    currentEmptyY = randomNeighbor.y;
                }

                this.emptyX = currentEmptyX;
                this.emptyY = currentEmptyY;

                this.isShuffling = false;
                this.render();
                this.startTimer();
            }

            startTimer() {
                this.timerDuration = 0;
                this.timerInterval = setInterval(() => {
                    this.timerDuration++;
                    this.timerEl.textContent = this.formatTime(this.timerDuration);
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                }
            }

            formatTime(seconds) {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            }

            updateStats() {
                this.movesEl.textContent = this.moves;
                if (!this.isShuffling) this.timerEl.textContent = this.formatTime(this.timerDuration);
            }

            onTime() {
                this.updateStats();
            }

            getNeighbors(x, y) {
                const neighbors = [];
                if (x > 0) neighbors.push({ x: x - 1, y: y });
                if (x < this.gridSize - 1) neighbors.push({ x: x + 1, y: y });
                if (y > 0) neighbors.push({ x: x, y: y - 1 });
                if (y < this.gridSize - 1) neighbors.push({ x: x, y: y + 1 });
                return neighbors;
            }

            // Calculate theoretical position of a tile based on its value
            getTileCoordinates(val) {
                // 1-based values, 0 is empty
                const index = val - 1; 
                return {
                    x: index % this.gridSize,
                    y: Math.floor(index / this.gridSize)
                };
            }

            // Check if puzzle is solved
            isSolved() {
                for (let tile of this.tiles) {
                    if (tile.value === 0) continue; // Empty space
                    const pos = this.getTileCoordinates(tile.value);
                    if (pos.x !== tile.x || pos.y !== tile.y) {
                        return false;
                    }
                }
                return true;
            }

            onTileClick(e) {
                if (this.isShuffling) return;
                const tileEl = e.currentTarget;
                const val = parseInt(tileEl.dataset.val);
                
                if (val === 0) return; // Can't click empty

                // Get coordinates of clicked tile and empty space
                const tileX = parseInt(tileEl.dataset.x);
                const tileY = parseInt(tileEl.dataset.y);
                const emptyX = this.emptyX;
                const emptyY = this.emptyY;

                // Check adjacency
                const distX = Math.abs(tileX - emptyX);
                const distY = Math.abs(tileY - emptyY);

                if (distX + distY === 1) {
                    this.moveTile(tileEl);
                }
            }

            moveTile(tileEl) {
                const tileX = parseInt(tileEl.dataset.x);
                const tileY = parseInt(tileEl.dataset.y);

                // Swap coordinates in data
                const tempX = this.emptyX;
                const tempY = this.emptyY;
                this.emptyX = tileX;
                this.emptyY = tileY;

                this.emptyIndex = this.emptyX * this.gridSize + this.emptyY;
                
                this.moves++;
                this.updateStats();

                this.render(); // Re-render to update tile positions and state of the empty slot
                this.checkWin();
            }

            render() {
                // Determine dimensions of cell (includes gap logic in CSS usually, but let's calculate based on tile count)
                // Actually, we used fixed CSS widths (72px) and gaps (10px).
                // Total width = n * (tile + gap) - gap
                const tileWidth = 72;
                const gap = 10;
                
                // We don't want to re-read CSS, just calculate based on fixed constraints used in CSS
                const totalTiles = this.gridSize * this.gridSize;

                this.tiles.forEach((tile) => {
                    const value = tile.value;
                    const xPos = tile.x * (tileWidth + gap);
                    const yPos = tile.y * (tileWidth + gap);

                    let element;
                    
                    if (value === 0) {
                        // Create/Find empty element
                        const oldEmpty = this.gridEl.querySelector('.tile[aria-label="Empty"]');
                        if (oldEmpty) {
                            oldEmpty.remove();
                        }
                        // We actually don't need a DOM element for the empty slot, 
                        // but the logic needs to handle the click grid or size.
                        // For simplicity in this specific implementation, we just don't render the empty div.
                        return;
                    }

                    // Find existing element in DOM for this value
                    let tileEl = this.gridEl.querySelector(`.tile[data-val="${value}"]`);
                    
                    if (!tileEl) {
                        tileEl = document.createElement('div');
                        tileEl.classList.add('tile');
                        tileEl.textContent = value;
                        tileEl.dataset.val = value;
                        tileEl.dataset.x = tile.x;
                        tileEl.dataset.y = tile.y;
                        tileEl.addEventListener('click', this.onTileClick.bind(this));
                        this.gridEl.appendChild(tileEl);
                    } else {
                        tileEl.textContent = value;
                        tileEl.dataset.x = tile.x;
                        tileEl.dataset.y = tile.y;
                    }

                    tileEl.style.left = `${xPos}px`;
                    tileEl.style.top = `${yPos}px`;
                });
            }

            checkWin() {
                if (this.isSolved()) {
                    this.stopTimer();
                    this.winStatsEl.innerHTML = `Moves: ${this.moves} | Time: ${this.formatTime(this.timerDuration)}`;
                    this.winOverlay.classList.add('visible');
                }
            }

            handleZoom() {
                // Mobile support for touch
                // For a basic implementation, simple click works, but this prevents double-clicking zoom on mobile
                event.preventDefault();
            }
        }

        // Start the application
        window.onload = () => {
            const game = new PuzzleGame();
            window.game = game; // Expose for debugging or easy access
        };

    </script>
</body>
</html>
