<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Snake Game</title>
    <style>
        body {
            background-color: #202020;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        canvas {
            background-color: #000;
            display: block;
            border: 4px solid #555;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
        }
        .score-board {
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            color: #ff4444;
            text-transform: uppercase;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="ui-layer">
            <div class="score-board">Score: <span id="score">0</span></div>
        </div>

        <div id="game-over-screen">
            <h1>Game Over</h1>
            <button onclick="resetGame()">Restart</button>
        </div>
    </div>

    <script>
        // Configuration
        const CANVAS_SIZE = 400;
        const TILE_COUNT = 20;
        const TILE_SIZE = CANVAS_SIZE / TILE_COUNT;
        const INITIAL_SPEED = 150; // ms per tick
        const SPEED_DECREMENT = 10; // How much faster it gets
        const GROWTH_PER_FOOD = 1;

        // Game State
        let canvas, ctx;
        let score = 0;
        let snake = [];
        let food = { x: 0, y: 0 };
        let velocity = { x: 0, y: 0 };
        let nextVelocity = { x: 0, y: 0 }; // Buffer for input to prevent self-collision on quick turns
        let lastRenderTime = 0;
        let currentSpeed = INITIAL_SPEED;
        let isGameOver = false;
        let isRunning = false;

        // DOM Elements
        const scoreEl = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over-screen');

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            // Input Listeners
            window.addEventListener('keydown', handleInput);

            // Start the game loop
            window.requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            score = 0;
            scoreEl.innerText = score;
            currentSpeed = INITIAL_SPEED;
            isGameOver = false;
            isRunning = true;
            
            // Reset Snake position (center)
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            
            // Reset movement (moving up)
            velocity = { x: 0, y: -1 };
            nextVelocity = { x: 0, y: -1 };

            placeFood();
            gameOverScreen.style.display = 'none';
            
            // Restart loop logic if it stopped (simple approach: just update state, main loop handles timing)
        }

        function handleInput(e) {
            if (isGameOver) return;

            switch (e.key) {
                case 'ArrowUp':
                    if (velocity.y === 0) nextVelocity = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (velocity.y === 0) nextVelocity = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (velocity.x === 0) nextVelocity = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (velocity.x === 0) nextVelocity = { x: 1, y: 0 };
                    break;
            }
        }

        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);

                // Make sure food doesn't spawn on snake body
                validPosition = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        function update() {
            // Apply buffered input
            velocity = { ...nextVelocity };

            // Calculate new head position
            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // Check Wall Collision
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                endGame();
                return;
            }

            // Check Self Collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            // Move Snake
            snake.unshift(head); // Add new head

            // Check Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                
                // Speed increase logic: every 5 pieces (5 * 10 = 50 points)
                // We check if score is divisible by 50 to know when to speed up
                // Or simpler: check food count equivalent
                if (score % 50 === 0) {
                    currentSpeed = Math.max(50, currentSpeed - SPEED_DECREMENT);
                }

                placeFood();
                // Don't pop the tail, so snake grows
            } else {
                snake.pop(); // Remove tail
            }
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw Food
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(food.x * TILE_SIZE, food.y * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);

            // Draw Snake
            ctx.fillStyle = '#4CAF50';
            snake.forEach((part, index) => {
                // Head is slightly different color
                if (index === 0) ctx.fillStyle = '#66FF66';
                else ctx.fillStyle = '#4CAF50';
                
                ctx.fillRect(part.x * TILE_SIZE, part.y * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);
            });
        }

        function endGame() {
            isGameOver = true;
            isRunning = false;
            gameOverScreen.style.display = 'flex';
        }

        function gameLoop(currentTime) {
            window.requestAnimationFrame(gameLoop);

            if (isGameOver) return;

            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if (secondsSinceLastRender < currentSpeed / 1000) return;

            lastRenderTime = currentTime;

            update();
            draw();
        }

        // Boot
        init();

    </script>
</body>
</html>
