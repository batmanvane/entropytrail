<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Quiz</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #22c55e;
            --error: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 1.5rem;
            color: var(--primary);
            font-size: 2rem;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0 5px;
            font-family: 'Courier New', Courier, monospace;
        }

        .numerator {
            border-bottom: 2px solid currentColor;
            padding-bottom: 2px;
            line-height: 1.2;
            width: 100%;
            text-align: center;
        }

        .denominator {
            padding-top: 2px;
            line-height: 1.2;
            width: 100%;
            text-align: center;
        }

        .operator {
            font-size: 1.8rem;
            margin: 0 10px;
        }

        .question-area {
            font-size: 1.5rem;
            margin: 2rem 0;
            word-break: break-word;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        button {
            padding: 1rem;
            font-size: 1rem;
            border: 2px solid #e5e7eb;
            background: white;
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover:not([disabled]) {
            border-color: var(--primary);
            background-color: #eef2ff;
        }

        button:disabled {
            cursor: default;
            opacity: 0.7;
        }

        button.correct {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        button.wrong {
            background-color: var(--error);
            border-color: var(--error);
            color: white;
        }

        .feedback-area {
            margin-top: 2rem;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .feedback-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .explanation {
            font-size: 0.95rem;
            color: #4b5563;
            font-style: italic;
        }

        .controls {
            margin-top: 2rem;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            font-size: 1.1rem;
            padding: 1rem;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none !important;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #e5e7eb;
            border-radius: 3px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .start-screen, .result-screen {
            padding: 2rem 0;
        }

        .result-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 1rem 0;
        }

        .result-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #4b5563;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Progress Bar -->
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="start-screen">
        <h1>Fraction Challenge</h1>
        <p style="margin-bottom: 2rem; font-size: 1.1rem;">Test your skills in adding and comparing fractions!</p>
        <button class="next-btn" onclick="game.start()">Start Quiz</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
        <div id="question-container" class="question-area">
            <!-- Question injected via JS -->
        </div>

        <div class="options-grid" id="options-container">
            <!-- Options injected via JS -->
        </div>

        <div class="feedback-area" id="feedback-area">
            <div id="feedback-message" class="feedback-text"></div>
            <div id="feedback-explanation" class="explanation"></div>
        </div>

        <div class="controls" id="controls-area">
            <button class="next-btn" id="next-btn" onclick="game.nextQuestion()">Next Question</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="result-screen hidden">
        <h1>Quiz Complete!</h1>
        <div id="final-score" class="result-score"></div>
        <p id="final-message" class="result-message"></p>
        <button class="next-btn" onclick="game.restart()">Play Again</button>
    </div>
</div>

    const GameState = {

    const questionTypes = ['add', 'compare'];

    function generateGCD(a, b) {
        return b === 0 ? a : generateGCD(b, a % b);
    }

    function generateLCM(a, b) {
        return (a * b) / generateGCD(a, b);
    }

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function simplify(r, d) {
        if (d === 0) return { n: 0, d: 1 };
        const neg = (r < 0) ^ (d < 0);
        const rAbs = Math.abs(r);
        const dAbs = Math.abs(d);
        const common = generateGCD(rAbs, dAbs);
        return {
            n: neg ? Math.floor(-rAbs / common) : Math.floor(rAbs / common),
            d: dAbs / common
        };
    }

    function compareFractions(n1, d1, n2, d2) {
        const common = generateLCM(d1, d2);
        const n1Adj = (n1 * (common / d1));
        const n2Adj = (n2 * (common / d2));
        return n1Adj > n2Adj ? 1 : (n1Adj < n2Adj ? -1 : 0);
    }

    function addFractions(n1, d1, n2, d2) {
        const common = generateLCM(d1, d2);
        const n1Adj = (n1 * (common / d1));
        const n2Adj = (n2 * (common / d2));
        const resultN = n1Adj + n2Adj;
        const resultD = common;
        return simplify(resultN, resultD);
    }

        generateDistractor(correctAns, type, n1, d1, n2, d2) {

            } else {

            this.feedbackMessage.textContent = isCorrect ? "Correct!" : "Incorrect";
            this.feedbackMessage.style.color = isCorrect ? "var(--success)" : "var(--error)";

            this.nextBtn.disabled = false;
        }
    }

    // Initialize Game
    const game = new FractionQuiz();

</script>

</html>
