<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --card-back: #34495e;
            --card-front: #ecf0f1;
            --accent: #e74c3c;
            --text: #ecf0f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            justify-content: center;
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 600px;
            perspective: 1000px;
        }

        .card {
            background-color: transparent;
            height: 100px; /* Fixed height for uniformity */
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            border-radius: 8px;
        }

        .card.flip {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card.matched .card-back,
        .card.matched .card-front {
            opacity: 0;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 2.5rem;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card-front {
            background-color: var(--card-front);
            transform: rotateY(180deg);
            border: 2px solid #bdc3c7;
        }

        .card-back {
            background-color: var(--card-back);
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%232c3e50' fill-opacity='0.4' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='3'/%3E%3Ccircle cx='13' cy='13' r='3'/%3E%3C/g%3E%3C/svg%3E");
        }

        button {
            margin-top: 25px;
            padding: 10px 25px;
            font-size: 1rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #c0392b;
        }

        /* Modal/Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-size: 3rem;
            color: #2ecc71;
            margin-bottom: 20px;
        }

        .overlay p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Memory Match</h1>
        <div class="stats">
            <span>Moves: <b id="move-count">0</b></span>
        </div>
    </header>

    <div class="game-container" id="game-board">
        <!-- Cards will be injected here by JavaScript -->
    </div>

    <button id="restart-btn" onclick="initGame()">Restart Game</button>

    <div class="overlay" id="victory-overlay">
        <h2>You Won!</h2>
        <p>Total Moves: <span id="final-moves"></span></p>
        <button onclick="initGame()">Play Again</button>
    </div>

    <script>
        const gameBoard = document.getElementById('game-board');
        const moveCountEl = document.getElementById('move-count');
        const victoryOverlay = document.getElementById('victory-overlay');
        const finalMovesEl = document.getElementById('final-moves');
        
        let cardsArray = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchesFound = 0;

        // Total pairs (16 cards)
        const totalPairs = 8;

        // Emoji set for icons
        const icons = ['🍕', '🚀', '🐱', '🌵', '🎸', '💎', '🍦', '🎈'];

        function initGame() {
            // Reset state
            moves = 0;
            matchesFound = 0;
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            moveCountEl.textContent = moves;
            victoryOverlay.classList.remove('show');
            gameBoard.innerHTML = '';

            // Create pairs
            cardsArray = [...icons, ...icons];
            // Shuffle
            cardsArray.sort(() => 0.5 - Math.random());

            // Generate HTML
            cardsArray.forEach(icon => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.icon = icon;

                const frontFace = document.createElement('div');
                frontFace.classList.add('card-face', 'card-front');
                frontFace.textContent = icon;

                const backFace = document.createElement('div');
                backFace.classList.add('card-face', 'card-back');

                card.appendChild(frontFace);
                card.appendChild(backFace);
                
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                // First click
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Second click
            secondCard = this;
            incrementMoves();
            checkForMatch();
        }

        function incrementMoves() {
            moves++;
            moveCountEl.textContent = moves;
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.icon === secondCard.dataset.icon;

            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');

            matchesFound++;
            resetBoard();

            if (matchesFound === totalPairs) {
                setTimeout(() => {
                    finalMovesEl.textContent = moves;
                    victoryOverlay.classList.add('show');
                }, 500);
            }
        }

        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        // Initialize on load
        initGame();
    </script>
</body>
</html>
