<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Sliding Puzzle</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-color: #16213e;
            --text-color: #e94560;
            --tile-bg: #0f3460;
            --tile-text: #ffffff;
            --accent: #e94560;
            --gap: 8px;
            --tile-size: 80px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 1.2rem;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .stat-value {
            font-weight: bold;
        }

        .game-container {
            position: relative;
            padding: 10px;
            background: var(--panel-color);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: width 0.3s ease, height 0.3s ease;
        }

        #puzzle-board {
            display: grid;
            gap: var(--gap);
            position: relative;
        }

        .tile {
            background-color: var(--tile-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--tile-text);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: absolute; /* Vital for logical movement */
            width: 100%;
            height: 100%;
        }

        .tile:hover {
            background-color: #1a4b85;
        }

        .tile.correct {
            background-color: #2ecc71;
            color: white;
            pointer-events: none;
        }

        /* Loading Screen */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Controls */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--accent);
            border: none;
            padding: 10px 20px;
            color: white;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 0 #8a1c30;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #8a1c30;
        }

        button.secondary {
            background: #e94560;
        }

        /* Modal */
        #win-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #win-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        #win-modal h2 {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 400px) {
            :root {
                --tile-size: 8vw; /* Scale with viewport */
            }
            h1 { font-size: 1.5rem; }
            .stat-value { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Infinity Puzzle</h1>
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">Moves</span>
                <span class="stat-value" id="move-count">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Time</span>
                <span class="stat-value" id="time-count">00:00</span>
            </div>
        </div>
    </header>

    <div class="game-container" id="game-container">
        <div id="loading">
            <div class="spinner"></div>
            <span id="level-indicator">Level 1</span>
        </div>

        <div id="puzzle-board" style="grid-template-columns: repeat(3, 1fr);">
            <!-- Tiles generated by JS -->
        </div>

        <div id="win-modal">
            <h2>Unlocked!</h2>
            <p id="win-stats">Level 3 • 42 Moves</p>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="game.nextLevel()">Next Level</button>
                <button class="secondary" onclick="game.restartLevel()">Retry</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="secondary" onclick="game.restartLevel()">Restart</button>
        <button class="secondary" onclick="game.randomizeBoard()">Shuffle</button>
    </div>

    <script>
        class PuzzleGame {
            constructor() {
                this.board = [];
                this.moves = 0;
                this.timer = 0;
                this.isPlaying = false;
                this.level = 1;
                this.boardSize = 3;
                this.moveLimit = 50;
                
                // Select elements
                this.boardEl = document.getElementById('puzzle-board');
                this.moveEl = document.getElementById('move-count');
                this.timeEl = document.getElementById('time-count');
                this.loadingEl = document.getElementById('loading');
                this.winModal = document.getElementById('win-modal');
                this.levelInd = document.getElementById('level-indicator');

                this.loadLevel();
            }

            // Load current level configuration
            loadLevel() {
                // Difficulty Ramp
                this.level = 1;
                const sizes = [3, 4, 5, 6];
                const sizeIdx = Math.min(Math.floor((this.level - 1) / 4), sizes.length - 1);
                this.boardSize = sizes[sizeIdx];
                
                this.moveLimit = 20 + (this.level * 15);
                
                this.boardEl.style.setProperty('--tile-size', `calc(25% / ${this.boardSize})`);
                this.boardEl.style.gridTemplateColumns = `repeat(${this.boardSize}, 1fr)`;
                this.boardEl.style.gridTemplateRows = `repeat(${this.boardSize}, 1fr)`;
                
                this.levelInd.innerText = `Level ${this.level}`;
                this.startGame();
            }

            startGame() {
                this.isPlaying = true;
                this.moves = 0;
                this.timer = Date.now();
                this.updateStats();
                this.updateTimer();
                this.renderBoard();
                
                // Clear previous loading
                this.loadingEl.style.opacity = '0';
                
                // Wait for fade then zoom
                setTimeout(() => {
                    this.loadingEl.style.display = 'none';
                }, 500);
            }

            restartLevel() {
                this.playing = true;
                this.moves = 0;
                this.updateStats();
                this.renderBoard();
                this.loadingEl.style.display = 'flex';
                // Re-show loading briefly to indicate restart
                setTimeout(() => {
                    this.loadingEl.style.display = 'none';
                }, 500);
            }

            renderBoard() {
                this.boardEl.innerHTML = '';
                
                // Create tiles
                // 0 represents the empty space
                const tiles = this.createTilesArray();
                
                tiles.forEach((tile, index) => {
                    const div = document.createElement('div');
                    div.className = 'tile';
                    
                    if (tile.number !== 0) {
                        div.innerText = tile.number;
                        div.style.zIndex = tile.number; // Simulate stack order roughly
                        div.dataset.val = tile.number;
                        
                        // Bind click
                        div.addEventListener('click', () => this.handleMove(index));
                    } else {
                        // The "correct" one that disappears
                        div.style.opacity = '0'; 
                        div.style.cursor = 'default';
                        // This is visually the empty space
                    }
                    
                    this.boardEl.appendChild(div);
                });
            }

            createTilesArray() {
                // Create array 1 to N, with 0 at end
                let arr = Array.from({length: this.boardSize * this.boardSize}, (_, i) => i + 1);
                arr.push(0);
                // Shuffle for simplified version (random valid move)
                return arr;
            }

            // Find the index of number N in the flattened board array
            getTileIndex(value) {
                return this.board.findIndex(t => t === value);
            }

            // Generate a valid board state for a specific level number
            generateSolvedState() {
                let arr = Array.from({length: this.boardSize * this.boardSize}, (_, i) => i + 1);
                arr[this.boardSize * this.boardSize - 1] = 0;
                return arr;
            }

            async startRound() {
                // Calculate random valid moves to shuffle
                // To ensure solvability, we perform random valid moves from a solved state
                // OR we can use a standard randomized shuffle and verify inversion count (complex).
                // Simple approach: Generate a solved state, then block click logic except for specific empty tile.
                // Better approach for this context: 
                // 1. Generate perfect grid.
                // 2. Pick a random spot.
                
                // Algorithm for playable board:
                // Start with solved state.
                // Pick a random valid move (move empty space to a neighbor).
                // Repeat N times.
                
                let state = [...this.generateSolvedState()];
                let emptyIdx = state.length - 1;
                
                const shuffleMoves = 1000 + (this.boardSize * 50);
                
                for(let i=0; i<shuffleMoves; i++) {
                    // Get neighbors of empty space
                    const row = Math.floor(emptyIdx / this.boardSize);
                    const col = emptyIdx % this.boardSize;
                    const neighbors = [];
                    
                    if (row > 0) neighbors.push(emptyIdx - this.boardSize); // Up
                    if (row < this.boardSize - 1) neighbors.push(emptyIdx + this.boardSize); // Down
                    if (col > 0) neighbors.push(emptyIdx - 1); // Left
                    if (col < this.boardSize - 1) neighbors.push(emptyIdx + 1); // Right
                    
                    const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                    // Swap
                    [state[emptyIdx], state[randomNeighbor]] = [state[randomNeighbor], state[emptyIdx]];
                    emptyIdx = randomNeighbor;
                }
                
                this.board = state;
                this.renderBoard();
            }

            handleMove(index) {
                if (!this.isPlaying) return;
                
                const val = this.board[index];
                
                // If user clicks a tile and it's their actual correct position in the solved state
                // We allow this to "lock it" to guide them
                if (val === index + 1) {
                    this.board[index] = 0; // Mark correct as solved
                    this.renderBoard();
                    this.moves++;
                    this.updateStats();
                } 
                // Normal play (toggle with empty space)
                else if (this.isAdjacent(index, 0)) {
                    this.swapTiles(index, 0);
                    this.moves++;
                    this.updateStats();
                }
            }

            swapTiles(idx1, idx2) {
                [this.board[idx1], this.board[idx2]] = [this.board[idx2], this.board[idx1]];
                this.renderBoard();
                this.checkWin();
            }

            isAdjacent(idx1, idx2) {
                const row1 = Math.floor(idx1 / this.boardSize);
                const col1 = idx1 % this.boardSize;
                const row2 = Math.floor(idx2 / this.boardSize);
                const col2 = idx2 % this.boardSize;

                const dist = Math.abs(row1 - row2) + Math.abs(col1 - col2);
                return dist === 1;
            }

            checkWin() {
                // Check if board matches generated state and all valid tiles are placed
                // The generated state has 0 at the last index.
                // We need to check if 0 is at [x][x]
                
                const emptyIdx = this.board.indexOf(0);
                const isDomino = (this.boardSize === 2);
                
                if (isDomino && emptyIdx === 1 && this.board[0] === 1) {
                    this.gameOver(true);
                } else {
                    // General check
                    const correctCount = this.board.filter((val, idx) => idx + 1 === val || idx + 1 === 0).length;
                    if (correctCount === (this.boardSize * this.boardSize)) {
                        this.gameOver(true);
                    }
                }
            }

            gameOver(win) {
                this.isPlaying = false;
                this.winModal.classList.add('active');
                
                const el = document.getElementById('win-stats');
                el.innerHTML = `Level ${this.level} <br> ${this.moves} Moves`;

                if (!win) {
                    this.restartLevel();
                }
            }

            nextLevel() {
                this.level++;
                this.winModal.classList.remove('active');
                this.loadLevel();
            }

            updateStats() {
                this.moveEl.innerText = this.moves;
                this.timeEl.innerText = new Date(this.timer).toISOString().substr(11, 8);
            }

            updateTimer() {
                if (!this.isPlaying) return;
                timerInterval = setInterval(() => {
                    this.timer = Date.now();
                    this.updateStats();
                }, 1000);
            }

            randomizeBoard() {
                if(this.isPlaying) {
                    // If playing, just reset level
                    this.restartLevel();
                } else {
                    // If not playing (level just loaded), reset
                    this.loadLevel();
                }
            }

            loadLevel() {
                this.isPlaying = false;
                this.runStartRound = this.startRound.bind(this);
                setTimeout(this.runStartRound, 800); // Deliberate delay for effect
            }
        }

        let timerInterval;
        const game = new PuzzleGame();
    </script>
</body>
</html>
