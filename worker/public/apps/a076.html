<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Match Puzzle</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-color: #16213e;
            --text-color: #e94560;
            --tile-back: #0f3460;
            --tile-front: #e94560;
            --tile-back-anim: #1a5f7a;
            --border-radius: 10px;
            --gap: 10px;
            --tile-size: 80px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        header {
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            color: #aebbc9;
        }

        .stat-box {
            background: var(--panel-color);
            padding: 10px 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .game-area {
            position: relative;
            width: calc((var(--tile-size) * 4) + (var(--gap) * 5));
            height: calc((var(--tile-size) * 4) + (var(--gap) * 5));
            background-color: var(--panel-color);
            padding: var(--gap);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* The grid container */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, var(--tile-size));
            grid-template-rows: repeat(4, var(--tile-size));
            gap: var(--gap);
            width: 100%;
            height: 100%;
        }

        /* Individual Tile Styles */
        .tile {
            width: 100%;
            height: 100%;
            border-radius: var(--border-radius);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
            outline: none;
        }

        .tile.flipped {
            transform: rotateY(180deg);
        }

        .tile.matched {
            animation: popOut 0.5s ease forwards;
        }

        /* Tile Faces */
        .tile-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: var(--border-radius);
            font-size: 2rem;
            font-weight: bold;
            transition: padding 0.2s;
        }

        .tile-front {
            background-color: var(--tile-front);
            color: white;
        }

        .tile-flipped .tile-front {
            opacity: 0;
            pointer-events: none;
        }

        .tile-flipped .tile-back {
            transform: rotateY(180deg);
            transform-style: preserve-3d;
            display: flex;
        }

        .tile-back {
            background-color: var(--tile-back);
            color: white;
        }
        
        /* Matched state visual */
        .tile.flipped > .tile-front {
            background-color: var(--tile-front);
            color: #ffccdd;
        }

        .tile.flipped.matched {
            background-color: #00ff88;
            box-shadow: 0 0 15px #00ff88;
        }
        
        .tile.flipped.matched .tile-front {
            color: #003300;
            opacity: 1; /* Show checkmark/color */
            pointer-events: auto;
        }
        
        .tile.flipped.matched .tile-back {
            display: none; /* Hide the back number when matched */
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--text-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            font-weight: bold;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:active {
            transform: scale(0.95);
        }

        button.secondary {
            background-color: #0f3460;
        }

        /* Modal */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: var(--border-radius);
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            visibility: visible;
            opacity: 1;
        }

        .modal h2 {
            font-size: 3rem;
            color: #4ade80;
            margin-bottom: 10px;
        }

        .modal p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .modal button {
            font-size: 1.2rem;
            padding: 15px 40px;
        }

        /* Animations */
        @keyframes popOut {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.2); opacity: 1; }
            100% { transform: rotateY(180deg) scale(0); opacity: 0; }
        }

        /* Responsive Adjustments */
        @media (max-width: 500px) {
            :root {
                --tile-size: 10vw;
                --gap: 2vw;
            }
            .container { padding: 10px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Grid Match</h1>
        <div class="stats">
            <div class="stat-box">Moves: <span id="moves">0</span></div>
            <div class="stat-box">Time: <span id="timer">00:00</span></div>
        </div>
    </header>

    <div class="game-area">
        <div class="grid" id="grid">
            <!-- Tiles generated by JS -->
        </div>
        
        <!-- Win Modal -->
        <div id="winModal" class="modal">
            <h2>Victory!</h2>
            <p>Moves: <span id="finalMoves">0</span></p>
            <div class="controls">
                <button onclick="initGame()">Play Again</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="secondary" onclick="initGame()">Restart</button>
        <button class="secondary" onclick="createDeck(4)">4x4</button>
        <button class="secondary" onclick="createDeck(6)">6x6</button>
    </div>
</div>

<script>
    const gridElement = document.getElementById('grid');
    const movesElement = document.getElementById('moves');
    const timerElement = document.getElementById('timer');
    const modal = document.getElementById('winModal');
    const finalMovesElement = document.getElementById('finalMoves');

    let cards = [];
    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;
    let moves = 0;
    let matchesFound = 0;
    let timerInterval;
    let seconds = 0;
    let gameActive = false;

    // Symbol sets for different difficulty levels
    const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮'];
    const colors = ['🔴', '🔵', '🟢', '🟡', '🟣', '🟠', '🟤', '⚫', '⚪', '🟣'];

    function createDeck(gridSize) {
        const size = gridSize * gridSize;
        const symbols = emojis.slice(0, Math.ceil(size / 2));
        // Create pairs
        cards = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
        
        if (gridSize === 4) {
            clearGrid();
            const gap = 10;
            const tileSize = 80;
            gridElement.style.width = `${(tileSize * 4) + (gap * 5)}px`;
            gridElement.style.height = `${(tileSize * 4) + (gap * 5)}px`;
            gridElement.innerHTML = '';
            cards.forEach((symbol, index) => {
                createTile(symbol, index);
            });
        } else if (gridSize === 6) {
            clearGrid();
            const gap = 10;
            const tileSize = 120;
            gridElement.style.width = `${(tileSize * 6) + (gap * 7)}px`;
            gridElement.style.height = `${(tileSize * 6) + (gap * 7)}px`;
            gridElement.innerHTML = '';
            cards.forEach((symbol, index) => {
                createTile(symbol, index);
            });
        }
        resetGame();
    }

    function createTile(symbol, index) {
        const tile = document.createElement('button');
        tile.classList.add('tile');
        tile.dataset.symbol = symbol;
        tile.dataset.index = index;

        const frontFace = document.createElement('div');
        frontFace.classList.add('tile-face', 'tile-front');
        // Using the emoji on the front face as a generic icon when hidden, 
        // but we'll hide the front face completely when the card is active
        // Actually, to keep it clean, let's put the symbol on the back, 
        // and a " "? on the front until flipped.
        frontFace.innerText = '?';

        const backFace = document.createElement('div');
        backFace.classList.add('tile-face', 'tile-back');
        backFace.innerText = symbol;

        tile.appendChild(frontFace);
        tile.appendChild(backFace);

        tile.addEventListener('click', flipCard);
        gridElement.appendChild(tile);
    }

    function clearGrid() {
        gridElement.innerHTML = '';
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flipped');

        if (!hasFlippedCard) {
            // First click
            hasFlippedCard = true;
            firstCard = this;
            return;
        }

        // Second click
        secondCard = this;
        incrementMoves();
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.symbol === secondCard.dataset.symbol;

        isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
        lockBoard = true; // Prevent clicking others while animating

        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            
            // Add specific matched styling
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            
            resetBoard();
            matchesFound++;
            checkForWin();
        }, 800);
    }

    function unflipCards() {
        lockBoard = true;

        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetBoard();
        }, 1500);
    }

    function resetBoard() {
        [hasFlippedCard, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }

    function disableCards() {
        // Only append one of the matched buttons
        const button = document.createElement('button');
        button.innerText = "✓";
        button.style.color = "#003300";
        button.style.bgColor = "#00ff88";
        button.style.borderRadius = "10px";
        button.style.display = "flex";
        button.style.justifyContent = "center";
        button.style.alignItems = "center";
        button.style.padding = "0";
        
        console.log("Dash to remove?");
        // console.log("dash to remove: ", "remove soon");
    }

    function incrementMoves() {
        moves++;
        movesElement.innerText = moves;
    }

    function checkForWin() {
        // Total tiles = cards array length
        const totalTiles = cards.length;
        const matchedTiles = totalTiles / 2;

        // We need to count how many tiles are currently physically matching
        // But since matched class stays on them, we count them.
        const matchingTiles = document.querySelectorAll('.tile.matched').length;

        if (matchingTiles === totalTiles) {
            gameActive = false;
            clearInterval(timerInterval);
            finalMovesElement.innerText = moves;
            modal.classList.add('show');
        }
    }

    function resetGame() {
        moves = 0;
        matchesFound = 0;
        movesElement.innerText = moves;
        modal.classList.remove('show');
        resetBoard();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        seconds = 0;
        timerElement.innerText = "00:00";
        
        timerInterval = setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            timerElement.innerText = `${mins}:${secs}`;
        }, 1000);
    }

    function initGame() {
        modal.classList.remove('show');
        // Default 4x4
        createDeck(4);
    }

    // Initialize on load
    window.onload = initGame;

</script>
</body>
</html>
