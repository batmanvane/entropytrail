<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <style style="display: block; font-family: sans-serif;">
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: Arial, Helvetica, sans-serif;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            padding: 0 10px;
            box-sizing: border-box;
            font-size: 1.2rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
        }

        .card {
            background-color: #34495e;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            backface-visibility: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .card-front {
            background-color: #e74c3c;
            color: white;
            font-size: 1.5rem;
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.1) 10px,
                rgba(0, 0, 0, 0.1) 10px,
                rgba(0, 0, 0, 0.1) 20px
            );
        }

        .card-back {
            background-color: #ecf0f1;
            color: #2c3e50;
            transform: rotateY(180deg);
        }

        .restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .restart-btn:hover {
            background-color: #2ecc71;
        }

        .message {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #27ae60;
            height: 1.5em;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="game-info">
        <span>Moves: <span id="move-count">0</span></span>
        <span>Pairs: <span id="pairs-count">0</span>/8</span>
    </div>

    <div class="grid-container" id="grid">
        <!-- Cards will be injected here by JavaScript -->
    </div>

    <div class="message" id="message"></div>

    <button class="restart-btn" onclick="restartGame()">Restart Game</button>

    <script>
        const grid = document.getElementById('grid');
        const moveDisplay = document.getElementById('move-count');
        const pairsDisplay = document.getElementById('pairs-count');
        const messageDisplay = document.getElementById('message');
        
        const symbols = ['🍎', '🍌', '🍒', '🍇', '🍉', '🍍', '🥝', '🍓'];
        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let pairsFound = 0;

        function initGame() {
            grid.innerHTML = '';
            cards = [];
            moves = 0;
            pairsFound = 0;
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            
            moveDisplay.textContent = moves;
            pairsDisplay.textContent = pairsFound;
            messageDisplay.textContent = '';

            // Create 8 pairs
            const deck = [...symbols, ...symbols];
            // Shuffle deck
            deck.sort(() => 0.5 - Math.random());

            // Generate HTML
            deck.forEach(symbol => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.symbol = symbol;
                
                const front = document.createElement('div');
                front.classList.add('card-face', 'card-front');
                front.textContent = '?';

                const back = document.createElement('div');
                back.classList.add('card-face', 'card-back');
                back.textContent = symbol;

                card.appendChild(front);
                card.appendChild(back);
                
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
                
                cards.push(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                // First click
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Second click
            secondCard = this;
            incrementMoves();
            checkForMatch();
        }

        function incrementMoves() {
            moves++;
            moveDisplay.textContent = moves;
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.symbol === secondCard.dataset.symbol;
            
            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            pairsFound++;
            pairsDisplay.textContent = pairsFound;

            resetBoard();
            checkForWin();
        }

        function unflipCards() {
            lockBoard = true;
            
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function checkForWin() {
            if (pairsFound === symbols.length) {
                messageDisplay.textContent = `🎉 You won in ${moves} moves! 🎉`;
                // Disable all cards visually after a delay
                setTimeout(() => {
                    grid.setAttribute('data-disabled', 'true');
                }, 500);
            }
        }

        function restartGame() {
            // Small delay to allow "You won" message to be seen
            if(messageDisplay.textContent && !messageDisplay.textContent.includes('Restart')) {
                 messageDisplay.textContent = '';
            }
            messageDisplay.textContent = '';
            initGame();
        }

        // Start the game on load
        window.onload = initGame;
    </script>
</body>
</html>
