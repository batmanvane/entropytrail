<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Entropic Clock of Thought</title>
    <style>
        :root {
            --bg: #050505;
            --text: #e0e0e0;
            --accent: #00ffcc;
            --secondary: #ff0088;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* The Ambient Background Grid */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.1;
            transform: perspective(500px) rotateX(60deg) scale(2);
            z-index: -2;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) scale(2) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) scale(2) translateY(40px); }
        }

        /* Central Container */
        #interface {
            z-index: 10;
            position: relative;
            width: 600px;
            max-width: 90%;
            perspective: 1000px;
        }

        /* The Main Thought Box */
        .thought-container {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative;
            transition: transform 0.1s ease;
            transform-style: preserve-3d;
            backdrop-filter: blur(5px);
        }

        .thought-text {
            font-size: 1.5rem;
            line-height: 1.6;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            min-height: 150px;
        }

        /* Input Area */
        .input-group {
            display: flex;
            gap: 10px;
            position: relative;
        }

        input {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: box-shadow 0.3s;
        }

        input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            background: rgba(0, 255, 204, 0.01);
        }

        button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--accent);
            color: var(--bg);
        }

        /* Visualizer Canvas */
        #visualizer {
            position: absolute;
            top: 0;
            right: -20px;
            width: 20px;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            z-index: 5;
        }

        /* Abstract Particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
        }

        /* Log Console at Bottom */
        #log-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid var(--border);
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            z-index: 20;
        }

        .log-item {
            font-size: 0.8rem;
            margin-right: 20px;
            color: #666;
            white-space: nowrap;
            animation: fadeOut 5s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateY(10px); }
        }

        /* Scramble Effect Class */
        .scrambled {
            animation: scramble 0.1s infinite;
        }

        @keyframes scramble {
            0% { content-visibility: auto; }
            50% { content-visibility: hidden; } /* Trick for blink */
        }
        
        /* The "Glitch" utility */
        .glitch-text {
            position: relative;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 var(--secondary);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 var(--accent);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        
        @keyframes glitch-anim {
            0% { clip: rect(14px, 9999px, 122px, 0); }
            20% { clip: rect(80px, 9999px, 10px, 0); }
            40% { clip: rect(6px, 9999px, 160px, 0); }
            60% { clip: rect(100px, 9999px, 20px, 0); }
            80% { clip: rect(34px, 9999px, 8px, 0); }
            100% { clip: rect(120px, 9999px, 140px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(120px, 9999px, 10px, 0); }
            20% { clip: rect(10px, 9999px, 130px, 0); }
            40% { clip: rect(100px, 9999px, 30px, 0); }
            60% { clip: rect(20px, 9999px, 80px, 0); }
            80% { clip: rect(110px, 9999px, 5px, 0); }
            100% { clip: rect(5px, 9999px, 100px, 0); }
        }

    </style>
</head>
<body>

    <div class="grid-bg"></div>
    
    <div id="particles-canvas" class="particles"></div>

    <div id="interface">
        <div class="thought-container" id="main-box">
            <div class="thought-text" id="output-text">Initializing Entropic Core...</div>
            <div class="input-group">
                <input type="text" id="thought-input" placeholder="Focus your mind..." autocomplete="off">
                <button id="project-btn">Project</button>
                <button id="clear-btn">Evict</button>
            </div>
        </div>
        <div id="visualizer"></div>
    </div>

    <div id="log-panel">
        <!-- Logs go here -->
    </div>

    <script>
        // --- Core Logic ---

        const output = document.getElementById('output-text');
        const input = document.getElementById('thought-input');
        const btn = document.getElementById('project-btn');
        const clearBtn = document.getElementById('clear-btn');
        const box = document.getElementById('main-box');
        const logPanel = document.getElementById('log-panel');
        const particlesDiv = document.getElementById('particles-canvas');
        const visualizer = document.getElementById('visualizer');

        let silhouetteOpacity = 0;
        let isFocussed = false;

        // --- Audio Synth (Silent by default to avoid browser policy blockers without interaction) ---
        // We implement the audio capability, but let the user interact first.
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'input') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200 + Math.random() * 500, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'thought') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'evict') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // --- Visual System ---

        function spawnParticles(text) {
            const words = text.split(' ');
            
            words.forEach((word, i) => {
                setTimeout(() => {
                    const p = document.createElement('div');
                    p.classList.add('particle');
                    p.innerText = word;
                    p.style.left = '50%';
                    p.style.top = '50%';
                    p.style.fontSize = '1.2rem';
                    p.style.fontWeight = 'bold';
                    p.style.color = Math.random() > 0.5 ? 'var(--accent)' : 'var(--secondary)';
                    p.style.transform = 'translate(-50%, -50%)';
                    
                    particlesDiv.appendChild(p);

                    // Animate
                    const x = (Math.random() - 0.5) * window.innerWidth;
                    const y = (Math.random() - 0.5) * window.innerHeight;
                    const rot = (Math.random() - 0.5) * 360;

                    p.animate([
                        { opacity: 1, transform: `translate(-50%, -50%) rotate(0deg)` },
                        { opacity: 0, transform: `translate(${x}px, ${y}px) rotate(${rot}deg)` }
                    ], {
                        duration: 2000 + Math.random() * 2000,
                        easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',
                        fill: 'forwards'
                    });

                    setTimeout(() => p.remove(), 4000);

                }, i * 100); // Stagger
            });
        }

        function updateVisualizer() {
            if (isFocussed) {
                const x = Math.sin(Date.now() * 0.002) * 20 + (silhouetteOpacity * 20);
                visualizer.style.width = (50 + x) + 'px';
                visualizer.style.background = `linear-gradient(to right, var(--accent), var(--bg))`;
            } else {
                visualizer.style.background = 'rgba(255, 255, 255, 0.05)';
            }
        }

        // --- Application Logic ---

        function log(text) {
            const item = document.createElement('div');
            item.classList.add('log-item');
            item.innerText = `[${new Date().toLocaleTimeString([], {hour12: false})}] ${text}`;
            logPanel.appendChild(item);
        }

        btn.addEventListener('click', () => {
            initAudio();
            const text = input.value.trim();
            if (!text) return;

            // Focus State
            isFocussed = true;
            input.style.opacity = '0';
            input.style.pointerEvents = 'none';
            
            // Transform Box
            box.style.transform = 'rotateY(15deg) scale(1.05)';
            box.style.borderColor = 'var(--secondary)';
            
            log(`Projecting: "${text}"...`);
            spawnParticles(text);

            // The "Thought" Process: Type out, scramble, stabilize
            let i = 0;
            const speed = 50;
            const glitchDuration = 200;
            const stabilizeDuration = 1500;

            function processWord() {
                if (i <= text.length) {
                    const char = text[i];
                    output.style.opacity = 0;
                    
                    setTimeout(() => {
                        output.querySelector('span') || (output.innerHTML = '');
                        output.innerHTML += `<span class="scrambled" data-text="${char}">${char} ${i < text.length - 1 ? ' ' : ''}</span>`;
                        output.style.opacity = 1;
                        playSound('thought');
                        
                        i++;
                        processWord();
                    }, speed);
                } else {
                    // Finish typing
                    setTimeout(() => {
                        createSilhouette();
                        output.classList.add('glitch-text');
                        output.setAttribute('data-text', output.innerText);
                    }, 200);
                }
            }

            processWord();

            // Reset
            setTimeout(() => clearSession(), stabilizeDuration + (Math.random() * 1000 - 500));
        });

        function createSilhouette() {
            // Create a darkening effect behind the text
            silhouetteOpacity += 0.1;
            box.style.boxShadow = `inset 0 0 50px rgba(0,0,0,${silhouetteOpacity})`;
            box.style.background = `rgba(${200 - silhouetteOpacity*50}, ${200 - silhouetteOpacity*50}, ${200 - silhouetteOpacity*50}, 0.5)`;
            
            playSound('input');
        }

        function clearSession() {
            isFocussed = false;
            input.style.opacity = '1';
            input.style.pointerEvents = 'all';
            input.focus();
            
            // Reset Box
            box.style.transform = 'rotateY(0deg) scale(1)';
            box.style.borderColor = 'var(--border)';
            box.style.boxShadow = '0 0 30px rgba(0, 0, 0, 0.5)';
            box.style.background = 'var(--glass)';
            output.classList.remove('glitch-text');
            
            silhouetteOpacity = 0;
            visualizer.style.width = '50px';
        }

        clearBtn.addEventListener('click', () => {
            initAudio();
            playSound('evict');
            input.value = '';
            clearSession();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btn.click();
        });

        // Background Hover Effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            // Subtle parallax on the grid
            const grid = document.querySelector('.grid-bg');
            grid.style.transform = `perspective(500px) rotateX(60deg) scale(2) translateY(${y}px) translateX(${x}px)`;
        });

    </script>
</body>
</html>
