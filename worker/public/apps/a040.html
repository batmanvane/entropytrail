<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            font-size: 1.1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        select {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fff;
            cursor: pointer;
            box-sizing: border-box;
        }

        .outputs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .output-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            padding: 0.75rem;
            border-radius: var(--border-radius);
            border-left: 4px solid var(--primary-color);
        }

        .output-label {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.25rem;
        }

        .output-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Length Converter</h1>

    <div class="input-group">
        <label for="inputValue">Value</label>
        <input type="text" id="inputValue" placeholder="Enter value" inputmode="decimal" autocomplete="off">
    </div>

    <div class="input-group">
        <label for="inputUnit">From Unit</label>
        <select id="inputUnit">
            <option value="cm">Centimetres</option>
            <option value="in">Inches</option>
            <option value="ft">Feet</option>
        </select>
    </div>

    <div id="error" class="error-msg"></div>

    <div class="outputs">
        <div class="output-item">
            <span class="output-label">In Centimetres</span>
            <span class="output-value" id="resCm">0.00</span>
        </div>
        <div class="output-item">
            <span class="output-label">In Inches</span>
            <span class="output-value" id="resIn">0.00</span>
        </div>
        <div class="output-item">
            <span class="output-label">In Feet</span>
            <span class="output-value" id="resFt">0.00</span>
        </div>
    </div>
</div>

<script>
    (function() {
        const inputEl = document.getElementById('inputValue');
        const unitSelectEl = document.getElementById('inputUnit');
        const resCmEl = document.getElementById('resCm');
        const resInEl = document.getElementById('resIn');
        const resFtEl = document.getElementById('resFt');
        const errorEl = document.getElementById('error');

        // Conversion rates to Centimetres (the base unit for calculation)
        const RATE_CENTIM = {
            cm: 1,      // 1 cm = 1 cm
            in: 2.54,   // 1 inch = 2.54 cm
            ft: 30.48   // 1 foot = 12 inches = 30.48 cm
        };

        function convert() {
            const rawValue = inputEl.value;
            
            // Clear error
            errorEl.textContent = '';

            // Validate input: Must be a number (can be negative, can be decimal)
            if (rawValue === '' || isNaN(rawValue)) {
                resCmEl.textContent = '---';
                resInEl.textContent = '---';
                resFtEl.textContent = '---';
                return;
            }

            const value = parseFloat(rawValue);
            const sourceUnit = unitSelectEl.value;

            // Calculate base value in centimetres
            const valueInCm = value * RATE_CENTIM[sourceUnit];

            // Round to 4 decimal places for display, avoiding floating point errors
            const toFixed = (n) => parseFloat(n.toFixed(4));

            // Update outputs
            resCmEl.textContent = toFixed(valueInCm);
            
            // Convert base (cm) to inches
            resInEl.textContent = toFixed(valueInCm / RATE_CENTIM.in);
            
            // Convert base (cm) to feet
            resFtEl.textContent = toFixed(valueInCm / RATE_CENTIM.ft);
        }

        // Event Listeners
        inputEl.addEventListener('input', convert);
        unitSelectEl.addEventListener('change', convert);

        // Initial state
        convert();
    })();
</script>

</body>
</html>
