<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Focus - Focus Timer & Todo</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            background: var(--surface);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 20px;
            background: var(--surface);
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }

        .date {
            font-size: 0.875rem;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: #f9fafb;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary);
            background: var(--surface);
            border-top: 3px solid var(--primary);
        }

        /* Content Area */
        .content {
            padding: 20px;
            flex: 1;
            position: relative;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Todo Styles */
        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #todo-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #todo-input:focus {
            border-color: var(--primary);
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background: var(--primary-hover);
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f3f4f6;
            gap: 10px;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .todo-text {
            flex: 1;
            font-size: 1rem;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-light);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 5px;
        }

        .todo-item:hover .delete-btn {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            color: var(--text-light);
            margin-top: 40px;
            font-size: 0.9rem;
        }

        /* Timer Styles */
        .timer-display {
            font-size: 5rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            text-align: center;
            color: var(--text);
            margin: 20px 0;
            font-feature-settings: "tnum";
        }

        .timer-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .control-btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .control-btn:active {
            transform: scale(0.98);
        }

        .btn-start {
            background: var(--success);
            color: white;
            grid-column: span 2;
            height: 60px;
        }

        .btn-reset {
            background: #e5e7eb;
            color: var(--text);
        }

        .preset-btn {
            background: #f3f4f6;
            color: var(--text);
            height: 50px;
            font-size: 0.9rem;
        }

        .preset-btn:hover {
            background: #e5e7eb;
        }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.75rem;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
        }

        /* Animation for leaving items */
        .fall-down {
            animation: fall 0.5s forwards;
        }

        @keyframes fall {
            to { opacity: 0; transform: translate(0, 20px); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Daily Focus</h1>
            <div class="date" id="current-date">Loading...</div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="todos">Tasks</button>
            <button class="tab-btn" data-tab="timer">Focus Timer</button>
        </div>

        <div class="content">
            <!-- TODO Section -->
            <div id="todos" class="tab-content active">
                <div class="todo-input-group">
                    <input type="text" id="todo-input" placeholder="What needs to be done today?">
                    <button class="add-btn" id="add-todo">Add</button>
                </div>
                <ul class="todo-list" id="todo-list">
                    <!-- Items injected via JS -->
                </ul>
                <div class="empty-state" id="empty-state">No tasks yet. Add one above!</div>
            </div>

            <!-- Timer Section -->
            <div id="timer" class="tab-content">
                <div class="timer-display" id="time-display">25:00</div>
                <div class="timer-controls">
                    <button class="control-btn btn-start" id="start-pause">Start Focus</button>
                    <button class="control-btn btn-reset" id="reset-timer">Reset</button>
                </div>
                <div class="timer-controls" style="display: grid; gap: 10px;">
                    <button class="control-btn preset-btn" data-seconds="120">15m</button>
                    <button class="control-btn preset-btn" data-seconds="1800">30m</button>
                    <button class="control-btn preset-btn" data-seconds="900">15m Break</button>
                    <button class="control-btn preset-btn" data-seconds="180">3m Break</button>
                </div>
            </div>
        </div>

        <footer>
            Powered by Simple Focus
        </footer>
    </div>

    <script>
        /* --- DOM Elements --- */
        const initials = document.getElementById('current-date');
        const todoInput = document.getElementById('todo-input');
        const addTodoBtn = document.getElementById('add-todo');
        const todoList = document.getElementById('todo-list');
        const emptyState = document.getElementById('empty-state');
        
        // Tabs
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = {
            todos: document.getElementById('todos'),
            timer: document.getElementById('timer')
        };

        // Timer
        const timeDisplay = document.getElementById('time-display');
        const startPauseBtn = document.getElementById('start-pause');
        const resetBtn = document.getElementById('reset-timer');
        const presetBtns = document.querySelectorAll('.preset-btn');

        /* --- State --- */
        let todos = [];
        let timerSeconds = 25 * 60; // 25 minutes default
        let timerInterval = null;
        let isRunning = false;

        /* --- Initialization --- */
        function init() {
            loadTodos(); // Load from local storage if available
            updateDate();
            renderTodos();
            startIntervalClock();
        }

        function updateDate() {
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            initials.textContent = new Date().toLocaleDateString('en-US', options);
        }

        /* --- Todo Logic --- */
        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) return;

            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false
            };

            todos.push(newTodo);
            saveTodos();
            renderTodos();
            todoInput.value = '';
            todoInput.focus();
        }

        function toggleTodo(id) {
            todos = todos.map(t => {
                if (t.id === id) return { ...t, completed: !t.completed };
                return t;
            });
            saveTodos();
            renderTodos();
        }

        function deleteTodo(id) {
            const item = document.querySelector(`[data-id="${id}"]`);
            item.classList.add('fall-down');
            
            setTimeout(() => {
                todos = todos.filter(t => t.id !== id);
                saveTodos();
                renderTodos();
            }, 500);
        }

        function renderTodos() {
            todoList.innerHTML = '';
            
            if (todos.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                todos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                    li.dataset.id = todo.id;
                    
                    li.innerHTML = `
                        <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''}>
                        <span class="todo-text">${escapeHtml(todo.text)}</span>
                        <button class="delete-btn" title="Delete">&times;</button>
                    `;
                    
                    li.querySelector('.todo-checkbox').addEventListener('change', () => toggleTodo(todo.id));
                    li.querySelector('.delete-btn').addEventListener('click', () => deleteTodo(todo.id));
                    
                    todoList.appendChild(li);
                });
            }
        }

        function saveTodos() {
            localStorage.setItem('dailyFocusTodos', JSON.stringify(todos));
        }

        function loadTodos() {
            const saved = localStorage.getItem('dailyFocusTodos');
            if (saved) {
                todos = JSON.parse(saved);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /* --- Tab Logic --- */
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class from all
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(v => v.classList.remove('active'));
                
                // Add active to clicked
                btn.classList.add('active');
                tabContents[btn.dataset.tab].classList.add('active');
            });
        });

        /* --- Timer Logic --- */
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timeDisplay.textContent = formatTime(timerSeconds);
        }

        function startTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                isRunning = true;
                startPauseBtn.textContent = 'Pause';
                startPauseBtn.classList.remove('btn-start'); // visual feedback
                timeDisplay.classList.add('pulse');
                
                timerInterval = setInterval(() => {
                    timerSeconds--;
                    updateDisplay();
                    
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        startPauseBtn.textContent = 'Start Focus';
                        timeDisplay.classList.remove('pulse');
                        // Optional: Audio beep could go here, but we avoid external assets.
                        // Instead, we set it to 0 and stop it.
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startPauseBtn.textContent = 'Resume';
            timeDisplay.classList.remove('pulse');
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 25 * 60;
            updateDisplay();
        }

        function loadPreset(seconds) {
            pauseTimer();
            timerSeconds = seconds;
            updateDisplay();
        }

        /* --- Event Listeners --- */
        
        // Todos
        addTodoBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        // Timer
        startPauseBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                loadPreset(parseInt(btn.dataset.seconds));
            });
        });

        // Helper for real-time update without setInterval
        function startIntervalClock() {
            setInterval(() => {
                if(!isRunning && !timerInterval) {
                   updateDisplay();
                }
            }, 1000);
        }

        // Run Init
        init();

    </script>
</body>
</html>
