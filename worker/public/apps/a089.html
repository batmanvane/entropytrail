<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Table Trainer</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #22c55e;
            --error: #ef4444;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-bottom: 1rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
        }

        /* Game View Styles */
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .stat-value {
            color: var(--text);
        }

        .timer-bar-container {
            width: 100%;
            height: 6px;
            background-color: #e5e7eb;
            border-radius: 3px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background-color: var(--primary);
            width: 100%;
            transition: width 1s linear;
        }

        .question-card {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .question {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .answer-input {
            width: 100px;
            padding: 0.5rem;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .answer-input:focus {
            border-color: var(--primary);
        }

        .answer-input.correct {
            border-color: var(--success);
            background-color: #f0fdf4;
        }

        .answer-input.incorrect {
            border-color: var(--error);
            background-color: #fef2f2;
        }

        .message {
            margin-top: 1.5rem;
            font-weight: 600;
            min-height: 1.5rem;
        }

        .message.success { color: var(--success); }
        .message.error { color: var(--error); }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>Times Table Trainer</h1>
            <button id="start-btn" class="btn">Start Game</button>
            <p style="margin-top: 1rem; color: var(--text-light); font-size: 0.9rem;">
                Answer correctly in 60 seconds to win!
            </p>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <div class="stats">
                <div>Time: <span id="time-left" class="stat-value">60</span></div>
                <div>Score: <span id="score" class="stat-value">0</span></div>
            </div>
            
            <div class="timer-bar-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>

            <div class="question-card">
                <div id="question-text" class="question"></div>
                <input type="number" id="answer-input" class="answer-input" placeholder="?" autocomplete="off">
            </div>

            <div id="message" class="message"></div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="hidden">
            <h1>Game Over</h1>
            <p style="margin-bottom: 1rem;">Final Score: <span id="final-score" style="font-weight: bold; font-size: 1.2rem;"></span></p>
            <button id="restart-btn" class="btn">Play Again</button>
        </div>
    </div>

    <script>
        // State
        let timeLeft = 60;
        let score = 0;
        let currentNumber = 1;
        let timerInterval = null;
        let isPlaying = false;

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        const timeLeftEl = document.getElementById('time-left');
        const scoreEl = document.getElementById('score');
        const timerBar = document.getElementById('timer-bar');
        
        const questionEl = document.getElementById('question-text');
        const answerInput = document.getElementById('answer-input');
        const messageEl = document.getElementById('message');
        
        const finalScoreEl = document.getElementById('final-score');

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        answerInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // Game Logic
        function startGame() {
            // Reset State
            timeLeft = 60;
            score = 0;
            isPlaying = true;
            currentNumber = Math.floor(Math.random() * 10) + 1;
            
            // Update UI
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            updateStats();
            generateQuestion();
            startTimer();
            
            // Focus input
            setTimeout(() => answerInput.focus(), 100);
        }

        function generateQuestion() {
            const multiplier = Math.floor(Math.random() * 10) + 1;
            currentNumber = multiplier;
            
            questionEl.textContent = `${multiplier} × ?`;
            answerInput.value = '';
            answerInput.className = 'answer-input'; // Reset classes
            messageEl.textContent = '';
            messageEl.className = 'message';
        }

        function checkAnswer() {
            if (!isPlaying) return;

            const userAnswer = parseInt(answerInput.value);
            
            // Determine correct answer based on the multiplier stored in currentNumber
            // currentNumber is the multiplier (e.g., 5), so answer is 5 * x
            // But we need to generate the full question 5 x 6 in the logic, 
            // so we stored the multiplier in currentNumber.
            // Let's re-generate the specific instance question for clarity inside checkAnswer or setup.
            
            // Actually, let's just store the second number in a variable `targetNumber` 
            // or calculate it. 
            // Since I set `currentNumber` to the multiplier (1-10), I need a target to multiply.
            // Wait, to make the game state simpler:
            // I need to know what the question IS before checking.
            // Let's generate the full math expression in generateQuestion.
        }

        // Refactoring generateQuestion to set the answer key
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    endGame();
                    return;
                }
                timeLeft--;
                updateStats();
                updateTimerBar();
            }, 1000);
        }

        function updateStats() {
            timeLeftEl.textContent = timeLeft;
            scoreEl.textContent = score;
        }

        function updateTimerBar() {
            const percentage = (timeLeft / 60) * 100;
            timerBar.style.width = `${percentage}%`;
            
            // Color change for urgency
            if (percentage < 30) {
                timerBar.style.backgroundColor = '#ef4444'; // Red
            } else {
                timerBar.style.backgroundColor = '#4f46e5'; // Blue
            }
        }

        function checkAnswer() {
            const userAnswer = parseInt(answerInput.value);
            if (isNaN(userAnswer)) return;

            // The logic: currentNumber is the multiplier shown (e.g., "5 x ?")
            // We need to check if userAnswer * currentNumber is... wait.
            // The question is "5 x ?". The user inputs the missing number.
            // I need to generate the missing number too.
            
            // Let's fix generateQuestion to store the missing number.
        }

        // Correcting the logic flow:
        // 1. Generate Multiplier (1-10)
        // 2. Generate Target Number (1-10) - to vary the answers so it's not just 1x, 2x, 3x...
        // 3. Display "Multiplier x ?"
        // 4. User inputs "Target Number"
        // 5. Check if (User Input * Multiplier) is correct? No, that's math.
        // The prompt asks for "times-table trainer". Usually that implies "3 x 4 = ?" or "3 = ? x 4".
        // Standard trainer format: "3 x 4 = 12". 
        // User Input: 12.
        // My previous logic was wrong. Let's stick to "A x B = ?"

        function generateQuestionFixed() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            const correctAnswer = num1 * num2;
            
            questionEl.textContent = `${num1} × ${num2} = ?`;
            answerInput.value = '';
            answerInput.className = 'answer-input';
            messageEl.textContent = '';
                                 
            
            // Store the correct answer for checking
            window.currentCorrectAnswer = correctAnswer;
        }

        function checkAnswerFixed() {
            const userAnswer = parseInt(answerInput.value);
            if (isNaN(userAnswer)) return;

            if (userAnswer === window.currentCorrectAnswer) {
                handleCorrect();
            } else {
                handleIncorrect();
            }
        }

        function handleCorrect() {
            score++;
            updateStats();
            
            // Visual feedback
            answerInput.classList.add('correct');
            messageEl.textContent = "Correct!";
            messageEl.classList.add('success');
            
            generateQuestionFixed();
            
            // Clear input and refocus
            answerInput.value = '';
            setTimeout(() => answerInput.focus(), 100);
        }

        function handleIncorrect() {
            // Visual feedback
            answerInput.classList.add('incorrect');
            messageEl.textContent = "Try again!";
            messageEl.classList.add('error');
            
            // Shake effect
            answerInput.style.borderColor = 'var(--error)';
            setTimeout(() => {
                answerInput.style.borderColor = '#e5e7eb';
                answerInput.value = '';
                answerInput.focus();
            }, 500);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            finalScoreEl.textContent = score;
            gameScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
        }

        // Re-assign event listeners after fixes
        window.checkAnswer = checkAnswerFixed;

    </script>
</body>
</html>
