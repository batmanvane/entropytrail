<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Mastery Quiz</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #22c55e;
            --error: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: #f9fafb;
            border-bottom: 1px solid var(--border);
            font-weight: 500;
            color: var(--text-light);
        }

        .quiz-content {
            padding: 30px 20px;
        }

        /* Question Styling */
        .question-text {
            font-size: 1.25rem;
            margin-bottom: 25px;
            font-weight: 500;
            text-align: center;
        }

        /* Fraction Display */
        .fraction {
            display: inline-block;
            text-align: center;
            vertical-align: middle;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0 5px;
        }

        .fraction > span {
            display: block;
            padding: 0 2px;
        }

        .fraction span.denominator {
            border-bottom: 2px solid currentColor;
            display: block;
        }

        .fraction > span + span {
            margin-left: 2px; /* Space between fractions */
        }

        .operator {
            color: #dc2626;
            font-weight: bold;
            margin: 0 5px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 480px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: #f9fafb;
            border-color: #d1d5db;
        }

        button:disabled {
            cursor: default;
        }

        /* Feedback States */
        button.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }

        button.incorrect {
            background-color: var(--error);
            color: white;
            border-color: var(--error);
        }

        .feedback-message {
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
            min-height: 24px;
        }

        .next-btn {
            margin-top: 25px;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            padding: 12px;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            margin: 20px 0;
        }

        .final-message {
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .restart-btn {
            background-color: var(--text);
            color: white;
            border: none;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Fraction Master</h1>
    </header>

    <div id="quiz-screen">
        <div class="status-bar">
            <span id="question-counter">Question 1/10</span>
            <span id="score-tracker">Score: 0</span>
        </div>

        <div class="quiz-content">
            <div id="question-container" class="question-text">
                <!-- Dynamic Content -->
            </div>

            <div id="options-container" class="options-grid">
                <!-- Dynamic Options -->
            </div>

            <div id="feedback" class="feedback-message"></div>

            <button id="next-btn" class="next-btn" style="display: none;">Next Question</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>Quiz Completed!</h2>
        <div class="score-display" id="final-score">0%</div>
        <p class="final-message" id="final-message">Great job!</p>
        <button id="restart-btn" class="restart-btn">Restart Quiz</button>
    </div>
</div>

<script>
    /**
     * Fraction Logic Helper
     */
    const Fraction = {
        add: (f1, f2) => {
            // Find LCM of denominators
            const lcm = (a, b) => a * b /parseFloat(this.gcd(a, b));
            const commonDenominator = lcm(f1.den, f2.den);
            
            const num1 = f1.num * (commonDenominator / f1.den);
            const num2 = f2.num * (commonDenominator / f2.den);
            
            let totalNum = num1 + num2;
            this.reduce(totalNum, commonDenominator);
            
            return { num: totalNum, den: commonDenominator };
        },
        
        subtract: (f1, f2) => {
            const lcm = (a, b) => a * b / parseFloat(this.gcd(a, b));
            const commonDenominator = lcm(f1.den, f2.den);
            
            const num1 = f1.num * (commonDenominator / f1.den);
            const num2 = f2.num * (commonDenominator / f2.den);
            
            let totalNum = num1 - num2;
            this.reduce(totalNum, commonDenominator);
            
            return { num: totalNum, den: commonDenominator };
        },
        
        multiply: (f1, f2) => {
            let totalNum = f1.num * f2.num;
            let totalDen = f1.den * f2.den;
            this.reduce(totalNum, totalDen);
            return { num: totalNum, den: totalDen };
        },
        
        compare: (f1, f2) => {
            const lcm = (a, b) => a * b / parseFloat(this.gcd(a, b));
            const commonDenominator = lcm(f1.den, f2.den);
            
            const num1 = f1.num * (commonDenominator / f1.den);
            const num2 = f2.num * (commonDenominator / f2.den);
            
            if (num1 > num2) return 'greater';
            if (num1 < num2) return 'less';
            return 'equal';
        },

        gcd: (a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b) {
                [a, b] = [b, a % b];
            }
            return a;
        },

        reduce: (num, den) => {
            if (den === 0) return; // Safety
            const divisor = this.gcd(num, den);
            num /= divisor;
            den /= divisor;
            if (num === 0) den = 1;
            if (num < 0 && den < 0) { num = -num; den = -den; }
            this.normalizeString(num, den);
        },

        normalizeString: (num, den) => {
            // Keep it simple for display, no complex decimal handling
            if (num < 0 && den < 0) { num = Math.abs(num); den = Math.abs(den); }
        }
    };

    // Quiz Data: 10 Questions
    // Type: 'add', 'subtract', 'multiply', 'compare'
    // Answer: 'greater', 'less', 'equal' for compares
    const questions = [
        // Addition
        {
            type: 'add',
            f1: { num: 1, den: 2 },
            f2: { num: 1, den: 4 },
            options: ['3/4', '2/4', '1/4', '4/4']
        },
        {
            type: 'add',
            f1: { num: 2, den: 5 },
            f2: { num: 3, den: 5 },
            options: ['5/5', '1/1', '4/5', '6/5']
        },
        {
            type: 'add',
            f1: { num: 1, den: 3 },
            f2: { num: 2, den: 3 },
            options: ['1', '3/3', '2', '5/3']
        },
        {
            type: 'add',
            f1: { num: 3, den: 4 },
            f2: { num: 1, den: 2 },
            options: ['5/4', '1/4', '7/4', '1/2']
        },
        
        // Comparison
        {
            type: 'compare',
            f1: { num: 1, den: 2 },
            f2: { num: 1, den: 3 },
            options: ['>', '<', '=']
        },
        {
            type: 'compare',
            f1: { num: 2, den: 5 },
            f2: { num: 4, den: 10 },
            options: ['>', '<', '=']
        },
        {
            type: 'compare',
            f1: { num: 1, den: 2 },
            f2: { num: 2, den: 4 },
            options: ['>', '<', '=']
        },
        
        // Multiplication
        {
            type: 'multiply',
            f1: { num: 1, den: 2 },
            f2: { num: 2, den: 3 },
            options: ['2/6', '1/3', '3/6', '2/5']
        },
        {
            type: 'multiply',
            f1: { num: 2, den: 3 },
            f2: { num: 3, den: 4 },
            options: ['5/12', '6/12', '1/2', '2/3']
        }
    ];

    // State
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;

    // DOM Elements
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionText = document.getElementById('question-container');
    const optionsContainer = document.getElementById('options-container');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const counterEl = document.getElementById('question-counter');
    const scoreEl = document.getElementById('score-tracker');
    const finalScoreEl = document.getElementById('final-score');
    const finalMsgEl = document.getElementById('final-message');
    const restartBtn = document.getElementById('restart-btn');

    // Shuffle Array Helper
    const shuffle = (array) => {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    };

    function initQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        quizScreen.style.display = 'block';
        resultScreen.style.display = 'none';
        scoreEl.textContent = `Score: 0`;
        loadQuestion();
    }

    function loadQuestion() {
        isAnswered = false;
        const { f1, f2, options } = questions[currentQuestionIndex];
        
        // Reset UI
        feedbackEl.textContent = '';
        feedbackEl.style.color = 'inherit';
        nextBtn.style.display = 'none';
        optionsContainer.innerHTML = '';

        // Update Counter
        counterEl.textContent = `Question ${currentQuestionIndex + 1}/${questions.length}`;

        // Render Question
        const type = questions[currentQuestionIndex].type;
        
        let qText = '';
        if (type === 'add') qText = `What is ${renderFractionDisplay(f1)} + ${renderFractionDisplay(f2)}?`;
        else if (type === 'subtract') qText = `What is ${renderFractionDisplay(f1)} - ${renderFractionDisplay(f2)}?`;
        else if (type === 'multiply') qText = `What is ${renderFractionDisplay(f1)} × ${renderFractionDisplay(f2)}?`;
        else if (type === 'compare') qText = `Is ${renderFractionDisplay(f1)} ${renderFractionDisplay(f2)}...?`;

        questionText.innerHTML = qText;

        // Render Numbers
        // Math: numerator <br> denominator
        const renderFractionDisplay = (f) => `<span class="fraction"><span class="numerator">${f.num}</span><span class="denominator">${f.den}</span></span>`;

        // Sort/Shuffle options
        const uniqueOptions = [...new Set(options)]; // Remove duplicates
        let sortedOptions = shuffle(uniqueOptions).slice(0, 4);
        
        // Calculate correct answer to validate
        let correctVal = null;
        
        if (type === 'add' || type === 'subtract' || type === 'multiply') {
            correctVal = Fraction[type](f1, f2).num;
        } else {
            correctVal = Fraction.compare(f1, f2);
        }

        sortedOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.textContent = opt;
            btn.onclick = () => handleAnswer(btn, opt, correctVal);
            optionsContainer.appendChild(btn);
        });
    }

    function handleAnswer(btn, selectedValue, correctValue) {
        if (isAnswered) return;
        isAnswered = true;

        // Disable all buttons
        const allBtns = optionsContainer.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);

        if (selectedValue === correctValue) {
            score++;
            scoreEl.textContent = `Score: ${score}`;
            btn.classList.add('correct');
            feedbackEl.textContent = "Correct!";
            feedbackEl.style.color = "var(--success)";
        } else {
            btn.classList.add('incorrect');
            feedbackEl.textContent = `Incorrect. The correct answer was ${correctValue}`;
            feedbackEl.style.color = "var(--error)";
            
            // Highlight correct one
            allBtns.forEach(b => {
                // Simple check: if button text matches value string representation
                if (['>','<','='].includes(b.textContent) && b.textContent === correctValue) {
                    b.classList.add('correct');
                } else if (parseInt(b.textContent) === correctValue) {
                    // Note: This simplistic string check is usually enough, 
                    // but strictly we should check button id or value. 
                    // Given the render logic above, textContent works for the data passed.
                    // However, for robustness:
                    if(b.textContent === correctValue) b.classList.add('correct');
                }
            });
        }

        nextBtn.style.display = 'block';
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    };

    function showResults() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';
        finalScoreEl.textContent = `${score}/${questions.length}`;
        
        const percentage = (score / questions.length) * 100;
        let msg = "Great effort!";
        if (percentage === 100) msg = "Perfect Score! You are a math wizard!";
        else if (percentage >= 80) msg = "Excellent work!";
        else if (percentage >= 50) msg = "Good job, keep practicing!";
        else msg = "Don't give up! Try again to improve.";
        
        finalMsgEl.textContent = msg;
    }

    restartBtn.onclick = initQuiz;

    // Start
    initQuiz();

</script>

</body>
</html>
