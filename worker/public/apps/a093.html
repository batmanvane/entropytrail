<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --card-bg: #ecf0f1;
            --card-back: #34495e;
            --text-color: #ecf0f1;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .stat-label {
            font-size: 0.8rem;
            display: block;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            perspective: 1000px;
        }

        .card {
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            flex-shrink: 0;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-size: 3rem;
            user-select: none;
        }

        .card-front {
            background-color: var(--card-bg);
            color: #333;
        }

        .card-back {
            background-color: var(--card-back);
            transform: rotateY(180deg);
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--card-back);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
        }

        #winner-message {
            margin-top: 20px;
            font-size: 1.5rem;
            color: var(--success-color);
            opacity: 0;
            transition: opacity 0.5s;
        }

        #winner-message.visible {
            opacity: 1;
        }

        @media (max-width: 500px) {
            .grid {
                gap: 10px;
            }
            .card-face {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <h1>MEMORY GAME</h1>

    <div class="stats-container">
        <div class="stat-box">
            <span class="stat-label">Moves</span>
            <span id="move-count">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Pairs Found</span>
            <span id="pairs-count">0/8</span>
        </div>
    </div>

    <div class="grid" id="game-grid">
        <!-- Cards generated by JS -->
    </div>

    <div id="winner-message">Congratulations! You won!</div>

    <div class="controls">
        <button onclick="restartGame()">Restart Game</button>
    </div>

    <script>
        const grid = document.getElementById('game-grid');
        const moveDisplay = document.getElementById('move-count');
        const pairsDisplay = document.getElementById('pairs-count');
        const winnerMessage = document.getElementById('winner-message');

        const faces = ['🍕', '🚀', '🐱', '🌵', '🎈', '🎸', '💎', '⚽'];
        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchedPairs = 0;

        function initGame() {
            // Reset state
            moves = 0;
            matchedPairs = 0;
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            updateStats();
            winnerMessage.classList.remove('visible');

            // Duplicate faces to create pairs
            const gameFaces = [...faces, ...faces];
            // Shuffle
            gameFaces.sort(() => 0.5 - Math.random());

            // Clear grid
            grid.innerHTML = '';

            // Create cards
            gameFaces.forEach(face => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.face = face;

                const frontFace = document.createElement('div');
                frontFace.classList.add('card-face', 'card-front');
                frontFace.textContent = face;

                const backFace = document.createElement('div');
                backFace.classList.add('card-face', 'card-back');
                backFace.textContent = '?';

                card.appendChild(frontFace);
                card.appendChild(backFace);
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return; // Prevent double clicking same card

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                // First click
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Second click
            secondCard = this;
            incrementMoves();
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.face === secondCard.dataset.face;

            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            matchedPairs++;
            updateStats();

            resetBoard();

            if (matchedPairs === faces.length) {
                setTimeout(() => {
                    winnerMessage.classList.add('visible');
                }, 500);
            }
        }

        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function incrementMoves() {
            moves++;
            updateStats();
        }

        function updateStats() {
            moveDisplay.textContent = moves;
            pairsDisplay.textContent = `${matchedPairs}/${faces.length}`;
        }

        function restartGame() {
            initGame();
        }

        // Start the game on load
        initGame();
    </script>
</body>
</html>
