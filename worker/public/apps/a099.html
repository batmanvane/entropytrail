<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length Converter</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-color);
        }

        .converter-card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input[type="number"] {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            font-size: 1rem;
            outline: none;
        }

        .output-grid {
            display: grid;
            gap: 10px;
        }

        .output-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f9fafb;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }

        .label {
            font-weight: 500;
            color: #4b5563;
        }

        .value {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="converter-card">
    <h1>Length Converter</h1>
    
    <div class="input-group">
        <input type="number" id="inputField" placeholder="Enter value" step="any">
        <select id="unitSelect">
            <option value="cm">Centimetres (cm)</option>
            <option value="in">Inches (in)</option>
            <option value="ft">Feet (ft)</option>
        </select>
    </div>

    <div class="output-grid">
        <div class="output-row">
            <span class="label">Centimetres</span>
            <span class="value"><span id="outCm">0</span> cm</span>
        </div>
        <div class="output-row">
            <span class="label">Inches</span>
            <span class="value"><span id="outIn">0</span> in</span>
        </div>
        <div class="output-row">
            <span class="label">Feet</span>
            <span class="value"><span id="outFt">0</span> ft</span>
        </div>
    </div>
</div>

<script>
    // DOM Elements
    const inputField = document.getElementById('inputField');
    const unitSelect = document.getElementById('unitSelect');
    const outCm = document.getElementById('outCm');
    const outIn = document.getElementById('outIn');
    const outFt = document.getElementById('outFt');

    // Change event listener
    function handleInput() {
        const value = parseFloat(inputField.value);
        const baseUnit = unitSelect.value;
        
        // If input is empty, show 0s
        if (isNaN(value)) {
            outCm.textContent = '0';
            outIn.textContent = '0';
            outFt.textContent = '0';
            return;
        }

        // Convert everything to centimetres first for easy calculation
        let cm = 0;
        
        // Input conversion factors TO centimetres
        const factors = {
            cm: 1,
            in: 2.54,
            ft: 30.48
        };

        // Calculate base value in CM
        cm = value * factors[baseUnit];

        // Update displays
        outCm.textContent = formatNumber(cm);
        outIn.textContent = formatNumber(cm / 2.54);
        outFt.textContent = formatNumber(cm / 30.48);
    }

    // Helper to format number (up to 4 decimal places, append .0 if integer)
    function formatNumber(num) {
        // Remove trailing zeros but keep at least one decimal place
        return parseFloat(num.toFixed(4));
    }

    // Attach listeners
    inputField.addEventListener('input', handleInput);
    unitSelect.addEventListener('change', handleInput);
</script>

</body>
</html>
